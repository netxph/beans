easy:
  - question: "Which stage comes first in the life cycle of a butterfly?"
    choices:
      - "Egg"
      - "Caterpillar"
      - "Chrysalis"
      - "Adult butterfly"
    answer: "Egg"
    topic: "Animals & Life Cycles"
    explanation: "A butterfly starts as an egg. The egg hatches into a caterpillar."
  - question: "Which animal is a mammal?"
    choices:
      - "Frog"
      - "Dolphin"
      - "Eagle"
      - "Snake"
    answer: "Dolphin"
    topic: "Animals & Life Cycles"
    explanation: "Dolphins breathe with lungs and feed milk to their young. These are mammal traits."
  - question: "Which body covering belongs to birds?"
    choices:
      - "Fur"
      - "Moist skin"
      - "Feathers"
      - "Dry scales"
    answer: "Feathers"
    topic: "Animals & Life Cycles"
    explanation: "Feathers are the body covering that sets birds apart from other animal groups."
  - question: "Which animal belongs to the reptile group?"
    choices:
      - "Cat"
      - "Duck"
      - "Tuna"
      - "Turtle"
    answer: "Turtle"
    topic: "Animals & Life Cycles"
    explanation: "Turtles have scales and breathe with lungs. They belong to the reptile group."
  - question: "A frog can live in water and on land during its life cycle. To which group does it belong?"
    choices:
      - "Amphibians"
      - "Mammals"
      - "Birds"
      - "Reptiles"
    answer: "Amphibians"
    topic: "Animals & Life Cycles"
    explanation: "Frogs are amphibians. Many begin life in water and later spend time on land."
  - question: "Which animal pair best shows a predator–prey relationship?"
    choices:
      - "Bee and flower"
      - "Owl and mouse"
      - "Butterfly and flower"
      - "Two rabbits eating grass"
    answer: "Owl and mouse"
    topic: "Ecosystems & Relationships"
    explanation: "An owl hunts and eats a mouse. The owl is the predator, and the mouse is the prey."
  - question: "Which vitamin is known as the “Vision Vitamin”?"
    choices:
      - "Vitamin C"
      - "Vitamin D"
      - "Vitamin A"
      - "Vitamin K"
    answer: "Vitamin A"
    topic: "Vitamins & Minerals"
    explanation: "Vitamin A helps the eyes work normally, especially in dim light."
  - question: "Which mineral is especially important for strong bones and teeth?"
    choices:
      - "Iron"
      - "Iodine"
      - "Sodium"
      - "Calcium"
    answer: "Calcium"
    topic: "Vitamins & Minerals"
    explanation: "Calcium is a mineral used to build and maintain bones and teeth."
  - question: "What is Earth’s rotation?"
    choices:
      - "Earth spinning on its axis"
      - "Earth moving around the Sun"
      - "The Moon moving around Earth"
      - "The Sun moving around Earth"
    answer: "Earth spinning on its axis"
    topic: "Earth, Weather & Space"
    explanation: "Rotation means spinning in place on an axis. Revolution means moving around another object."
  - question: "Which side of Earth has daytime?"
    choices:
      - "The side facing away from the Sun"
      - "The side facing the Sun"
      - "Only the North Pole"
      - "Only the South Pole"
    answer: "The side facing the Sun"
    topic: "Earth, Weather & Space"
    explanation: "The Sun lights the side of Earth facing it. The side turned away is in darkness."
  - question: "What is Earth’s revolution?"
    choices:
      - "Earth spinning on its axis"
      - "The Sun spinning around Earth"
      - "Earth moving around the Sun"
      - "Earth moving around the Moon"
    answer: "Earth moving around the Sun"
    topic: "Earth, Weather & Space"
    explanation: "Earth's trip around the Sun is its revolution. It takes about one year."
  - question: "Which list shows these planets in the correct order from nearest to farthest from the Sun?"
    choices:
      - "Venus, Mercury, Mars, Earth"
      - "Mercury, Earth, Venus, Mars"
      - "Mars, Earth, Venus, Mercury"
      - "Mercury, Venus, Earth, Mars"
    answer: "Mercury, Venus, Earth, Mars"
    topic: "Earth, Weather & Space"
    explanation: "Starting nearest the Sun, this part of the order is Mercury, Venus, Earth, and Mars."
  - question: "What does a decibel (dB) measure?"
    choices:
      - "How loud a sound is"
      - "How fast a sound travels"
      - "How long a sound lasts"
      - "How far away a sound is"
    answer: "How loud a sound is"
    topic: "Light & Sound"
    explanation: "Decibels describe sound level. A higher reading usually means a louder sound, not a higher-pitched sound."
  - question: "Which plant part supports the leaves and flowers above the ground?"
    choices:
      - "Root hair"
      - "Stem"
      - "Petal"
      - "Seed coat"
    answer: "Stem"
    topic: "Plants & Growth"
    explanation: "The stem holds up leaves and flowers. It also contains tissues that carry water and food."
  - question: "Which plant parts usually use sunlight to make food?"
    choices:
      - "Flowers"
      - "Fruits"
      - "Leaves"
      - "Root tips"
    answer: "Leaves"
    topic: "Plants & Growth"
    explanation: "Leaves contain chlorophyll, which takes in light energy to help the plant make food."
  - question: "Which plant parts take in water and minerals from the soil?"
    choices:
      - "Petals"
      - "Fruits"
      - "Seeds"
      - "Roots"
    answer: "Roots"
    topic: "Plants & Growth"
    explanation: "Roots absorb water and dissolved minerals from the soil."
  - question: "Which plant part contains the reproductive structures that help form seeds?"
    choices:
      - "Flower"
      - "Stem"
      - "Root"
      - "Leaf stalk"
    answer: "Flower"
    topic: "Plants & Growth"
    explanation: "Flowers contain the parts used for reproduction. After fertilization, seeds can form."
  - question: "Which plant part usually protects the seeds of a flowering plant?"
    choices:
      - "Root"
      - "Fruit"
      - "Stem"
      - "Leaf"
    answer: "Fruit"
    topic: "Plants & Growth"
    explanation: "Fruit grows around the seeds of many flowering plants and helps protect them."
  - question: "Which part can grow into a new plant after germination?"
    choices:
      - "Petal"
      - "Fruit skin"
      - "Seed"
      - "Root hair"
    answer: "Seed"
    topic: "Plants & Growth"
    explanation: "A seed contains a young plant. With the right conditions, it can sprout and grow."
  - question: "What is the name of the process by which green plants use light to make food?"
    choices:
      - "Digestion"
      - "Freezing"
      - "Pollination"
      - "Photosynthesis"
    answer: "Photosynthesis"
    topic: "Plants & Growth"
    explanation: "Photosynthesis uses light energy, water, and carbon dioxide to make sugars for the plant."
  - question: "Which gas do green plants take in to make food during photosynthesis?"
    choices:
      - "Carbon dioxide"
      - "Helium"
      - "Nitrogen"
      - "Hydrogen"
    answer: "Carbon dioxide"
    topic: "Plants & Growth"
    explanation: "Plants use carbon dioxide from the air as one of the materials for making sugar."
  - question: "Which gas is released by green plants during photosynthesis?"
    choices:
      - "Carbon dioxide"
      - "Oxygen"
      - "Helium"
      - "Nitrogen"
    answer: "Oxygen"
    topic: "Plants & Growth"
    explanation: "Oxygen is released when plants use water and light during photosynthesis."
  - question: "What provides the light energy used by plants growing outdoors?"
    choices:
      - "Soil minerals"
      - "Rainwater"
      - "Sunlight"
      - "Wind"
    answer: "Sunlight"
    topic: "Plants & Growth"
    explanation: "The Sun supplies light energy that outdoor green plants use to make food."
  - question: "Which substance do roots absorb to keep a plant hydrated?"
    choices:
      - "Sugar crystals"
      - "Cooking oil"
      - "Sand"
      - "Water"
    answer: "Water"
    topic: "Plants & Growth"
    explanation: "Roots take in water from the soil. Water helps keep plant cells firm and supports many life processes."
  - question: "What do we call substances such as nitrogen and potassium that plants obtain from soil?"
    choices:
      - "Mineral nutrients"
      - "Petals"
      - "Pollinators"
      - "Seed coats"
    answer: "Mineral nutrients"
    topic: "Plants & Growth"
    explanation: "Mineral nutrients help plants grow and work properly. Roots take them in from the soil."
  - question: "Which plant part anchors the plant in the soil?"
    choices:
      - "Flowers"
      - "Roots"
      - "Fruits"
      - "Petals"
    answer: "Roots"
    topic: "Plants & Growth"
    explanation: "Roots spread through the soil and hold the plant in place."
  - question: "Which plant structure is often brightly colored and attracts pollinators?"
    choices:
      - "Root hair"
      - "Stem vessel"
      - "Petal"
      - "Seed coat"
    answer: "Petal"
    topic: "Plants & Growth"
    explanation: "Bright petals can attract bees and other animals that help move pollen between flowers."
  - question: "Which animal group feeds its young with milk?"
    choices:
      - "Birds"
      - "Reptiles"
      - "Amphibians"
      - "Mammals"
    answer: "Mammals"
    topic: "Animals & Life Cycles"
    explanation: "Mammals have glands that make milk to feed their young."
  - question: "Which animal group has feathers?"
    choices:
      - "Birds"
      - "Mammals"
      - "Reptiles"
      - "Amphibians"
    answer: "Birds"
    topic: "Animals & Life Cycles"
    explanation: "All birds have feathers, even birds that cannot fly."
  - question: "Which animal group includes snakes and lizards?"
    choices:
      - "Mammals"
      - "Reptiles"
      - "Birds"
      - "Amphibians"
    answer: "Reptiles"
    topic: "Animals & Life Cycles"
    explanation: "Snakes and lizards have dry scales and breathe with lungs, which are reptile traits."
  - question: "Which animal group includes frogs and salamanders?"
    choices:
      - "Birds"
      - "Mammals"
      - "Amphibians"
      - "Reptiles"
    answer: "Amphibians"
    topic: "Animals & Life Cycles"
    explanation: "Frogs and salamanders are amphibians. Many have moist skin and begin life in water."
  - question: "Which animal is a bird?"
    choices:
      - "Bat"
      - "Dolphin"
      - "Turtle"
      - "Eagle"
    answer: "Eagle"
    topic: "Animals & Life Cycles"
    explanation: "Eagles have feathers and beaks, so they are birds. Bats are mammals, even though they also fly."
  - question: "Which animal is an amphibian?"
    choices:
      - "Salamander"
      - "Crocodile"
      - "Parrot"
      - "Cat"
    answer: "Salamander"
    topic: "Animals & Life Cycles"
    explanation: "Salamanders belong to the amphibian group and usually have moist skin."
  - question: "Which animal is a reptile?"
    choices:
      - "Frog"
      - "Snake"
      - "Whale"
      - "Penguin"
    answer: "Snake"
    topic: "Animals & Life Cycles"
    explanation: "Snakes have dry scales and breathe with lungs, so they are reptiles."
  - question: "Which animal is a mammal that can fly?"
    choices:
      - "Eagle"
      - "Butterfly"
      - "Bat"
      - "Dragonfly"
    answer: "Bat"
    topic: "Animals & Life Cycles"
    explanation: "Bats are mammals because they feed milk to their young. They are also able to fly."
  - question: "What is the larval stage of a butterfly called?"
    choices:
      - "Chrysalis"
      - "Tadpole"
      - "Adult"
      - "Caterpillar"
    answer: "Caterpillar"
    topic: "Animals & Life Cycles"
    explanation: "A caterpillar is a butterfly's larva. This stage spends much of its time eating and growing."
  - question: "What is the pupal stage of a butterfly called?"
    choices:
      - "Chrysalis"
      - "Egg"
      - "Caterpillar"
      - "Nymph"
    answer: "Chrysalis"
    topic: "Animals & Life Cycles"
    explanation: "A butterfly's pupa is called a chrysalis. The body changes into its adult form inside it."
  - question: "Which stage of a butterfly's life cycle lays eggs?"
    choices:
      - "Caterpillar"
      - "Adult butterfly"
      - "Chrysalis"
      - "Egg"
    answer: "Adult butterfly"
    topic: "Animals & Life Cycles"
    explanation: "Adult female butterflies lay eggs, starting the life cycle again."
  - question: "What is the name for the major body changes during an insect's life cycle?"
    choices:
      - "Migration"
      - "Hibernation"
      - "Metamorphosis"
      - "Pollination"
    answer: "Metamorphosis"
    topic: "Animals & Life Cycles"
    explanation: "Metamorphosis is a major change in body form as an animal passes through its life stages."
  - question: "What is an organism that makes its own food called?"
    choices:
      - "Consumer"
      - "Predator"
      - "Parasite"
      - "Producer"
    answer: "Producer"
    topic: "Ecosystems & Relationships"
    explanation: "Producers make their own food. Green plants do this through photosynthesis."
  - question: "What is an organism that gets energy by eating other organisms called?"
    choices:
      - "Consumer"
      - "Producer"
      - "Mineral"
      - "Sunlight"
    answer: "Consumer"
    topic: "Ecosystems & Relationships"
    explanation: "Consumers cannot make their own food like green plants. They get energy by eating other living things."
  - question: "What is an animal that hunts other animals for food called?"
    choices:
      - "Prey"
      - "Predator"
      - "Producer"
      - "Pollinator"
    answer: "Predator"
    topic: "Ecosystems & Relationships"
    explanation: "A predator hunts another animal for food, such as an owl hunting a mouse."
  - question: "What is an animal that is hunted and eaten by another animal called?"
    choices:
      - "Predator"
      - "Producer"
      - "Prey"
      - "Decomposer"
    answer: "Prey"
    topic: "Ecosystems & Relationships"
    explanation: "Prey is the animal eaten by a predator. A mouse hunted by an owl is prey."
  - question: "Which term names a single pathway of feeding relationships?"
    choices:
      - "Food web"
      - "Life cycle"
      - "Animal class"
      - "Food chain"
    answer: "Food chain"
    topic: "Ecosystems & Relationships"
    explanation: "A food chain follows one feeding path, such as grass to rabbit to fox."
  - question: "Which term names several connected food chains?"
    choices:
      - "Food web"
      - "Life cycle"
      - "Water cycle"
      - "Animal class"
    answer: "Food web"
    topic: "Ecosystems & Relationships"
    explanation: "A food web joins several food chains and shows that animals can have more than one food source."
  - question: "What is the natural place where an organism lives called?"
    choices:
      - "Organelle"
      - "Habitat"
      - "Mineral"
      - "Axis"
    answer: "Habitat"
    topic: "Ecosystems & Relationships"
    explanation: "A habitat is where a living thing gets the food, water, shelter, and other conditions it needs."
  - question: "Which adaptation lets an animal blend into its surroundings?"
    choices:
      - "Migration"
      - "Hibernation"
      - "Camouflage"
      - "Competition"
    answer: "Camouflage"
    topic: "Ecosystems & Relationships"
    explanation: "Camouflage helps an animal match its surroundings so it is harder to see."
  - question: "Which adaptation makes a harmless animal resemble a dangerous animal?"
    choices:
      - "Hibernation"
      - "Migration"
      - "Reabsorption"
      - "Mimicry"
    answer: "Mimicry"
    topic: "Ecosystems & Relationships"
    explanation: "Mimicry means resembling another living thing. Looking like a dangerous animal can help a harmless one avoid predators."
  - question: "Which relationship benefits both organisms?"
    choices:
      - "Mutualism"
      - "Parasitism"
      - "Competition"
      - "Commensalism"
    answer: "Mutualism"
    topic: "Ecosystems & Relationships"
    explanation: "In mutualism, both living things benefit, such as a bee getting nectar while pollinating a flower."
  - question: "Which relationship benefits one organism and harms the other?"
    choices:
      - "Mutualism"
      - "Parasitism"
      - "Commensalism"
      - "Photosynthesis"
    answer: "Parasitism"
    topic: "Ecosystems & Relationships"
    explanation: "In parasitism, the parasite benefits while its host is harmed, such as a tick feeding on a dog."
  - question: "What is the struggle for the same limited resource called?"
    choices:
      - "Mutualism"
      - "Camouflage"
      - "Competition"
      - "Metamorphosis"
    answer: "Competition"
    topic: "Ecosystems & Relationships"
    explanation: "Competition happens when living things need the same resource and there is not enough for all of them."
  - question: "Which paired organs filter blood and produce urine?"
    choices:
      - "Lungs"
      - "Ears"
      - "Eyes"
      - "Kidneys"
    answer: "Kidneys"
    topic: "Kidneys & Digestion"
    explanation: "Kidneys filter the blood, return useful substances, and remove wastes and extra water in urine."
  - question: "Which liquid carries many filtered wastes out of the body?"
    choices:
      - "Urine"
      - "Saliva"
      - "Bile"
      - "Sweat alone"
    answer: "Urine"
    topic: "Kidneys & Digestion"
    explanation: "Urine contains water and dissolved wastes removed from the blood by the kidneys."
  - question: "Which organ stores urine until it leaves the body?"
    choices:
      - "Stomach"
      - "Urinary bladder"
      - "Small intestine"
      - "Liver"
    answer: "Urinary bladder"
    topic: "Kidneys & Digestion"
    explanation: "The bladder stores urine. The kidneys make it, and tubes carry it to the bladder."
  - question: "Which digestive organ absorbs water and salts from undigested material?"
    choices:
      - "Esophagus"
      - "Stomach"
      - "Large intestine"
      - "Mouth"
    answer: "Large intestine"
    topic: "Kidneys & Digestion"
    explanation: "The large intestine takes water and salts back into the body from undigested material."
  - question: "Which vitamin helps the body absorb calcium?"
    choices:
      - "Vitamin A"
      - "Vitamin C"
      - "Vitamin K"
      - "Vitamin D"
    answer: "Vitamin D"
    topic: "Vitamins & Minerals"
    explanation: "Vitamin D helps the intestine absorb calcium, which the body needs for strong bones."
  - question: "Which vitamin helps blood clot normally?"
    choices:
      - "Vitamin K"
      - "Vitamin A"
      - "Vitamin C"
      - "Vitamin D"
    answer: "Vitamin K"
    topic: "Vitamins & Minerals"
    explanation: "Vitamin K helps proteins involved in blood clotting work properly."
  - question: "Which vitamin supports collagen formation and wound healing?"
    choices:
      - "Vitamin D"
      - "Vitamin C"
      - "Vitamin K"
      - "Vitamin B12"
    answer: "Vitamin C"
    topic: "Vitamins & Minerals"
    explanation: "Vitamin C helps make collagen, a protein needed to support tissues and help wounds heal."
  - question: "Which mineral is needed for hemoglobin to carry oxygen?"
    choices:
      - "Iodine"
      - "Calcium"
      - "Iron"
      - "Sodium"
    answer: "Iron"
    topic: "Vitamins & Minerals"
    explanation: "Iron is part of hemoglobin, the protein in red blood cells that carries oxygen."
  - question: "Which mineral is needed to make thyroid hormones?"
    choices:
      - "Calcium"
      - "Iron"
      - "Zinc"
      - "Iodine"
    answer: "Iodine"
    topic: "Vitamins & Minerals"
    explanation: "The thyroid gland uses iodine to make hormones that help control how the body uses energy."
  - question: "Which mineral supports normal growth and wound healing?"
    choices:
      - "Zinc"
      - "Iodine"
      - "Sodium"
      - "Fluoride"
    answer: "Zinc"
    topic: "Vitamins & Minerals"
    explanation: "Zinc helps many body processes, including growth, tissue repair, and wound healing."
  - question: "Which food is a rich source of vitamin C?"
    choices:
      - "White rice"
      - "Guava"
      - "Table salt"
      - "Butter"
    answer: "Guava"
    topic: "Vitamins & Minerals"
    explanation: "Guava contains plenty of vitamin C, which helps support healthy tissues and iron absorption."
  - question: "Which food provides beta-carotene that the body can convert to vitamin A?"
    choices:
      - "Table sugar"
      - "White rice"
      - "Carrots"
      - "Salt"
    answer: "Carrots"
    topic: "Vitamins & Minerals"
    explanation: "Carrots contain beta-carotene. The body can turn this orange pigment into vitamin A."
  - question: "Which food is a common source of calcium?"
    choices:
      - "Sugar"
      - "Cooking oil"
      - "Salt"
      - "Milk"
    answer: "Milk"
    topic: "Vitamins & Minerals"
    explanation: "Milk contains calcium, a mineral important for strong bones and teeth."
  - question: "Which kitchen ingredient is specially fortified to supply iodine?"
    choices:
      - "Iodized salt"
      - "Sugar"
      - "Vinegar"
      - "Plain cooking oil"
    answer: "Iodized salt"
    topic: "Vitamins & Minerals"
    explanation: "Iodized salt has iodine added to it. Ordinary non-iodized salt does not have this added iodine."
  - question: "What is the basic unit of living things called?"
    choices:
      - "Mineral"
      - "Cell"
      - "Planet"
      - "Sound wave"
    answer: "Cell"
    topic: "Cells & Energy"
    explanation: "Cells are the smallest units that carry out life processes. Living things are made of one or more cells."
  - question: "Which organelle releases usable energy from food through cellular respiration?"
    choices:
      - "Nucleus"
      - "Golgi body"
      - "Mitochondrion"
      - "Ribosome"
    answer: "Mitochondrion"
    topic: "Cells & Energy"
    explanation: "Mitochondria help release energy from food and make ATP, an energy supply the cell can use."
  - question: "Which of these is a living thing?"
    choices:
      - "Rock"
      - "Gravel"
      - "Plastic castle"
      - "Green plant"
    answer: "Green plant"
    topic: "Matter & Materials"
    explanation: "Green plants grow, use water and nutrients, and carry out life processes even though they do not walk around."
  - question: "Which of these is nonliving?"
    choices:
      - "Rock"
      - "Fish"
      - "Snail"
      - "Grass"
    answer: "Rock"
    topic: "Matter & Materials"
    explanation: "A rock does not grow through life processes, use food, or reproduce. It is nonliving."
  - question: "What is frozen water called?"
    choices:
      - "Steam"
      - "Ice"
      - "Salt"
      - "Oil"
    answer: "Ice"
    topic: "Matter & Materials"
    explanation: "Ice is water in its solid state. Warming it enough changes it back into liquid water."
  - question: "Which change turns a liquid into a solid?"
    choices:
      - "Melting"
      - "Boiling"
      - "Freezing"
      - "Evaporation"
    answer: "Freezing"
    topic: "Matter & Materials"
    explanation: "Freezing happens when a liquid loses enough heat to become a solid."
  - question: "Which change turns a solid into a liquid?"
    choices:
      - "Freezing"
      - "Condensation"
      - "Boiling"
      - "Melting"
    answer: "Melting"
    topic: "Matter & Materials"
    explanation: "Melting happens when a solid gains enough heat to become a liquid."
  - question: "Which form of water has a fixed shape of its own?"
    choices:
      - "Solid ice"
      - "Liquid water"
      - "Water vapor"
      - "Steam"
    answer: "Solid ice"
    topic: "Matter & Materials"
    explanation: "A solid keeps its own shape. Liquid water takes the shape of its container, and water vapor spreads out as a gas."
  - question: "Which material is a good conductor of heat?"
    choices:
      - "Wood"
      - "Copper"
      - "Plastic"
      - "Rubber"
    answer: "Copper"
    topic: "Matter & Materials"
    explanation: "Copper lets heat pass through it easily. Wood, plastic, and rubber slow heat transfer more."
  - question: "Which material commonly covers electrical wires as an insulator?"
    choices:
      - "Copper"
      - "Aluminum"
      - "Plastic"
      - "Iron"
    answer: "Plastic"
    topic: "Matter & Materials"
    explanation: "Plastic does not let electric current pass through easily. Its covering helps keep people from touching the conducting wire."
  - question: "What is a source of light?"
    choices:
      - "An object that only stores heat"
      - "Any object that can be seen"
      - "Any object that reflects sound"
      - "An object that produces its own light"
    answer: "An object that produces its own light"
    topic: "Light & Sound"
    explanation: "A light source makes its own light, unlike a mirror that only reflects light from elsewhere."
  - question: "Which is a natural source of light?"
    choices:
      - "Lightning"
      - "Mirror"
      - "Flashlight"
      - "Streetlight"
    answer: "Lightning"
    topic: "Light & Sound"
    explanation: "Lightning gives off light naturally. Flashlights and streetlights are human-made light sources."
  - question: "Which object does NOT produce its own light?"
    choices:
      - "Star"
      - "Moon"
      - "Candle flame"
      - "Glowing light bulb"
    answer: "Moon"
    topic: "Light & Sound"
    explanation: "The Moon shines because sunlight reflects from its surface. It does not make its own visible light."
  - question: "What is light bouncing off a surface called?"
    choices:
      - "Refraction"
      - "Absorption"
      - "Reflection"
      - "Convection"
    answer: "Reflection"
    topic: "Light & Sound"
    explanation: "Reflection happens when light hits a surface and bounces away from it."
  - question: "What is light produced by a living organism called?"
    choices:
      - "Reflection"
      - "Conduction"
      - "Friction"
      - "Bioluminescence"
    answer: "Bioluminescence"
    topic: "Light & Sound"
    explanation: "Bioluminescence is light made by a living thing, such as a firefly."
  - question: "Which object can produce light during a power outage?"
    choices:
      - "Working flashlight"
      - "Mirror"
      - "Book"
      - "Metal spoon"
    answer: "Working flashlight"
    topic: "Light & Sound"
    explanation: "A working flashlight makes light using battery power. A mirror or spoon needs light from another source to reflect."
  - question: "What does the word force mean in science?"
    choices:
      - "The space inside an object"
      - "A push or pull that can affect an object"
      - "The color of an object"
      - "The heat stored in an object"
    answer: "A push or pull that can affect an object"
    topic: "Forces & Motion"
    explanation: "A force is a push or pull. It can change an object's motion or shape."
  - question: "Which force pulls objects toward Earth?"
    choices:
      - "Friction"
      - "Magnetism"
      - "Gravity"
      - "Air resistance"
    answer: "Gravity"
    topic: "Forces & Motion"
    explanation: "Gravity attracts objects toward Earth and makes unsupported objects fall."
  - question: "Which force opposes sliding between touching surfaces?"
    choices:
      - "Gravity"
      - "Magnetism"
      - "Radiation"
      - "Friction"
    answer: "Friction"
    topic: "Forces & Motion"
    explanation: "Friction acts between touching surfaces and opposes sliding motion."
  - question: "Which force can attract an iron paper clip to a magnet?"
    choices:
      - "Magnetic force"
      - "Friction"
      - "Air resistance"
      - "Spring force"
    answer: "Magnetic force"
    topic: "Forces & Motion"
    explanation: "A magnet can attract an iron paper clip even before they touch."
  - question: "Which is a non-contact force?"
    choices:
      - "Friction"
      - "Gravity"
      - "Spring force"
      - "Water resistance"
    answer: "Gravity"
    topic: "Forces & Motion"
    explanation: "Gravity can act without objects touching. Friction and spring force require contact."
  - question: "Which force slows an object moving through air?"
    choices:
      - "Magnetism"
      - "Buoyant force in water"
      - "Air resistance"
      - "Spring force"
    answer: "Air resistance"
    topic: "Forces & Motion"
    explanation: "Air resistance is a force from the air that opposes an object's motion through it."
  - question: "Which planet is closest to the Sun?"
    choices:
      - "Venus"
      - "Earth"
      - "Mars"
      - "Mercury"
    answer: "Mercury"
    topic: "Earth, Weather & Space"
    explanation: "Mercury is the nearest planet to the Sun, followed by Venus."
  - question: "Which planet comes immediately after Mercury in order from the Sun?"
    choices:
      - "Venus"
      - "Earth"
      - "Mars"
      - "Jupiter"
    answer: "Venus"
    topic: "Earth, Weather & Space"
    explanation: "The order starts Mercury, Venus, Earth, and Mars, so Venus comes just after Mercury."
  - question: "Which planet is called the Red Planet?"
    choices:
      - "Venus"
      - "Mars"
      - "Earth"
      - "Saturn"
    answer: "Mars"
    topic: "Earth, Weather & Space"
    explanation: "Iron-containing minerals on Mars form rust, giving much of its surface a reddish color."
  - question: "Which planet is famous for its large, easily visible rings?"
    choices:
      - "Earth"
      - "Mars"
      - "Saturn"
      - "Mercury"
    answer: "Saturn"
    topic: "Earth, Weather & Space"
    explanation: "Saturn has a wide ring system made mostly of pieces of ice, with some rock and dust."
  - question: "Which star is at the center of our solar system?"
    choices:
      - "Moon"
      - "Earth"
      - "Jupiter"
      - "Sun"
    answer: "Sun"
    topic: "Earth, Weather & Space"
    explanation: "The Sun is the star the planets in our solar system travel around."
  - question: "Which atmospheric layer contains most clouds and weather?"
    choices:
      - "Troposphere"
      - "Stratosphere"
      - "Mesosphere"
      - "Thermosphere"
    answer: "Troposphere"
    topic: "Earth, Weather & Space"
    explanation: "The troposphere is the lowest atmospheric layer and contains most of the air's water vapor and weather."
  - question: "What does the Mohs scale measure?"
    choices:
      - "Color of minerals"
      - "Hardness of minerals"
      - "Weight of minerals"
      - "Size of minerals"
    answer: "Hardness of minerals"
    topic: "Minerals & Hardness"
    explanation: "The Mohs scale compares how well minerals resist scratching. It does not measure weight or size."
  - question: "Which is the softest mineral on the Mohs scale?"
    choices:
      - "Quartz"
      - "Diamond"
      - "Talc"
      - "Topaz"
    answer: "Talc"
    topic: "Minerals & Hardness"
    explanation: "Talc is the softest reference mineral on the Mohs scale. Harder minerals can scratch it easily."
  - question: "Which is the hardest mineral on the Mohs scale?"
    choices:
      - "Gypsum"
      - "Calcite"
      - "Apatite"
      - "Diamond"
    answer: "Diamond"
    topic: "Minerals & Hardness"
    explanation: "Diamond is the hardest reference mineral on the Mohs scale. It can scratch the other reference minerals."
  - question: "Which motion of Earth causes the day-and-night cycle?"
    choices:
      - "Rotation"
      - "Revolution"
      - "Melting"
      - "Refraction"
    answer: "Rotation"
    topic: "Earth, Weather & Space"
    explanation: "As Earth spins, a place turns toward the Sun for daytime and away from it for nighttime."
  - question: "What is the imaginary line through the North and South Poles around which Earth spins called?"
    choices:
      - "Equator"
      - "Axis"
      - "Orbit"
      - "Atmosphere"
    answer: "Axis"
    topic: "Earth, Weather & Space"
    explanation: "Earth's axis is an imaginary line through its poles. Earth spins around this line."
  - question: "Which unit is used to express sound level?"
    choices:
      - "Meter"
      - "Second"
      - "Decibel"
      - "Degree Celsius"
    answer: "Decibel"
    topic: "Light & Sound"
    explanation: "A decibel, written dB, is a unit used for sound level. It is not a unit of distance or temperature."
  - question: "Which quantity tells how quickly an object travels?"
    choices:
      - "Mass"
      - "Temperature"
      - "Hardness"
      - "Speed"
    answer: "Speed"
    topic: "Forces & Motion"
    explanation: "Speed tells how quickly an object covers distance. A faster object covers the same path in less time."
average:
  - question: "Leaf insects look like the leaves around them, which helps them hide from predators. What is this adaptation called?"
    choices:
      - "Camouflage"
      - "Hibernation"
      - "Migration"
      - "Mimicry"
    answer: "Camouflage"
    topic: "Ecosystems & Relationships"
    explanation: "The insects match the leaves around them, making them harder for predators to spot. Blending into surroundings is camouflage."
  - question: "An orchid grows on a tree. The orchid benefits, but the tree is neither helped nor harmed. What is this relationship called?"
    choices:
      - "Competition"
      - "Commensalism"
      - "Mutualism"
      - "Parasitism"
    answer: "Commensalism"
    topic: "Ecosystems & Relationships"
    explanation: "The orchid gains a place to grow, while the tree is unaffected in this example. That is commensalism."
  - question: "Space is almost empty. How does heat from the Sun travel through space to Earth?"
    choices:
      - "Insulation"
      - "Convection"
      - "Radiation"
      - "Conduction"
    answer: "Radiation"
    topic: "Matter & Materials"
    explanation: "Radiation can carry energy through empty space. Conduction and convection need matter, such as air, water, or metal."
  - question: "Which digestive organ takes water and salts from undigested food back into the blood?"
    choices:
      - "Stomach"
      - "Small Intestine"
      - "Esophagus"
      - "Large Intestine"
    answer: "Large Intestine"
    topic: "Kidneys & Digestion"
    explanation: "The large intestine absorbs water and salts from material left after digestion, helping keep the body's water balance."
  - question: "Which cell part releases usable energy from food through cellular respiration?"
    choices:
      - "Mitochondrion"
      - "Golgi Body"
      - "Nucleus"
      - "Endoplasmic Reticulum"
    answer: "Mitochondrion"
    topic: "Cells & Energy"
    explanation: "Mitochondria help turn energy stored in food into ATP, an energy supply cells can use."
  - question: "Which layer of the Earth's atmosphere is where almost all weather, such as rain, clouds, and storms, takes place?"
    choices:
      - "Stratosphere"
      - "Troposphere"
      - "Thermosphere"
      - "Mesosphere"
    answer: "Troposphere"
    topic: "Earth, Weather & Space"
    explanation: "Most weather happens in the troposphere because it contains most of the atmosphere's water vapor."
  - question: "Which planet has the fastest rotation in our solar system?"
    choices:
      - "Mars"
      - "Saturn"
      - "Jupiter"
      - "Earth"
    answer: "Jupiter"
    topic: "Earth, Weather & Space"
    explanation: "Jupiter spins on its axis faster than the other planets. A faster rotation gives it a shorter day."
  - question: "Which plant tissue carries water and minerals from the roots up to the leaves?"
    choices:
      - "Stomata"
      - "Chloroplast"
      - "Phloem"
      - "Xylem"
    answer: "Xylem"
    topic: "Plants & Growth"
    explanation: "Xylem carries water and dissolved minerals from roots through the stem to the leaves. Phloem carries sugars."
  - question: "A straw in a glass of water looks bent where it enters the water. What behavior of light causes this?"
    choices:
      - "Refraction"
      - "Reflection"
      - "Dispersion"
      - "Absorption"
    answer: "Refraction"
    topic: "Light & Sound"
    explanation: "Light changes direction when it passes between water and air. This bending, called refraction, changes how the straw looks."
  - question: "A doctor explains that an organ keeps the right amount of water in the body while also removing wastes. Which organ is being described?"
    choices:
      - "Ureter"
      - "Kidney"
      - "Cortex"
      - "Nephron"
    answer: "Kidney"
    topic: "Kidneys & Digestion"
    explanation: "The kidney removes wastes from blood and adjusts how much water leaves the body in urine."
  - question: "Imagine the kidney as a water-cleaning system. Which part would best match the tiny filters that do most of the filtering work?"
    choices:
      - "Ureters"
      - "Renal pelvis"
      - "Nephrons"
      - "Medulla"
    answer: "Nephrons"
    topic: "Kidneys & Digestion"
    explanation: "Nephrons are tiny working units of the kidneys. Each filters fluid and helps return useful substances to blood."
  - question: "Nephrons help remove waste from blood and return useful water and nutrients. Which word describes their work of separating waste from blood?"
    choices:
      - "Growing"
      - "Digesting"
      - "Breathing"
      - "Filtering"
    answer: "Filtering"
    topic: "Kidneys & Digestion"
    explanation: "Filtering separates small substances and fluid from the blood. Reabsorption then returns much of the useful material."
  - question: "Which vitamin works with calcium to help build strong bones?"
    choices:
      - "Vitamin D"
      - "Vitamin A"
      - "Vitamin C"
      - "Vitamin K"
    answer: "Vitamin D"
    topic: "Vitamins & Minerals"
    explanation: "Calcium helps build bones, and vitamin D helps the body absorb that calcium. Both are needed for bone health."
  - question: "Which vitamin helps the body make proteins needed for blood to clot?"
    choices:
      - "Vitamin C"
      - "Vitamin K"
      - "Vitamin D"
      - "Vitamin B1"
    answer: "Vitamin K"
    topic: "Vitamins & Minerals"
    explanation: "Vitamin K helps activate several proteins that allow blood to clot and limit bleeding."
  - question: "Which mineral is needed to make hemoglobin, which carries oxygen in the blood?"
    choices:
      - "Calcium"
      - "Iodine"
      - "Iron"
      - "Sodium"
    answer: "Iron"
    topic: "Vitamins & Minerals"
    explanation: "Hemoglobin uses iron to help carry oxygen from the lungs to the rest of the body."
  - question: "Which nutrient is added to iodized salt to help the thyroid gland work?"
    choices:
      - "Iron"
      - "Calcium"
      - "Zinc"
      - "Iodine"
    answer: "Iodine"
    topic: "Vitamins & Minerals"
    explanation: "Iodized salt contains added iodine. The thyroid gland needs iodine to make its hormones."
  - question: "A mystery nutrient is a mineral, helps carry oxygen in the blood, and can come from meat, beans, and leafy greens. What is it?"
    choices:
      - "Iron"
      - "Calcium"
      - "Iodine"
      - "Potassium"
    answer: "Iron"
    topic: "Vitamins & Minerals"
    explanation: "Iron is used in hemoglobin, which carries oxygen. Meat, beans, and some leafy greens can supply iron."
  - question: "Which mineral property tells how difficult it is to scratch?"
    choices:
      - "Toughness"
      - "Hardness"
      - "Density"
      - "Color"
    answer: "Hardness"
    topic: "Minerals & Hardness"
    explanation: "Hardness means resistance to scratching. Toughness means resistance to breaking, which is a different property."
  - question: "Which soft mineral is commonly used to make plaster?"
    choices:
      - "Diamond"
      - "Quartz"
      - "Gypsum"
      - "Corundum"
    answer: "Gypsum"
    topic: "Minerals & Hardness"
    explanation: "Gypsum is a soft mineral used in making plaster and wallboard. Diamond, quartz, and corundum are much harder."
  - question: "Rubies and sapphires are varieties of which very hard mineral?"
    choices:
      - "Talc"
      - "Calcite"
      - "Gypsum"
      - "Corundum"
    answer: "Corundum"
    topic: "Minerals & Hardness"
    explanation: "Ruby and sapphire are forms of corundum. Small amounts of other substances give them different colors."
  - question: "Which plant tissue carries sugar from leaves to other parts of the plant?"
    choices:
      - "Phloem"
      - "Xylem"
      - "Stomata"
      - "Root hairs"
    answer: "Phloem"
    topic: "Plants & Growth"
    explanation: "Phloem moves sugars from leaves to parts that need or store them, such as roots and fruits."
  - question: "Which tiny openings in leaves allow gases and water vapor to pass through?"
    choices:
      - "Xylem vessels"
      - "Stomata"
      - "Seed coats"
      - "Petals"
    answer: "Stomata"
    topic: "Plants & Growth"
    explanation: "Stomata are small leaf openings. Gases move through them, and water vapor can leave through them."
  - question: "Which cells open and close the stomata?"
    choices:
      - "Root hair cells"
      - "Egg cells"
      - "Guard cells"
      - "Pollen grains"
    answer: "Guard cells"
    topic: "Plants & Growth"
    explanation: "Guard cells change shape to open or close stomata, helping control gas exchange and water loss."
  - question: "Which green pigment in leaves takes in light for photosynthesis?"
    choices:
      - "Hemoglobin"
      - "Melanin"
      - "Collagen"
      - "Chlorophyll"
    answer: "Chlorophyll"
    topic: "Plants & Growth"
    explanation: "Chlorophyll gives leaves their green color and takes in light energy used in photosynthesis."
  - question: "Which organelle in a leaf cell carries out photosynthesis?"
    choices:
      - "Chloroplast"
      - "Mitochondrion"
      - "Nucleus"
      - "Golgi body"
    answer: "Chloroplast"
    topic: "Plants & Growth"
    explanation: "Chloroplasts contain chlorophyll and are where photosynthesis happens in green plant cells."
  - question: "What is the loss of water vapor from a plant's leaves called?"
    choices:
      - "Germination"
      - "Transpiration"
      - "Pollination"
      - "Reabsorption"
    answer: "Transpiration"
    topic: "Plants & Growth"
    explanation: "Transpiration is water vapor leaving a plant, mostly through the stomata in its leaves."
  - question: "Which tiny parts of roots help them take in more water and minerals?"
    choices:
      - "Petals"
      - "Stomata"
      - "Root hairs"
      - "Seed coats"
    answer: "Root hairs"
    topic: "Plants & Growth"
    explanation: "Root hairs give roots more surface area, helping them absorb water and minerals from soil."
  - question: "What is the transfer of pollen from an anther to a stigma called?"
    choices:
      - "Germination"
      - "Transpiration"
      - "Respiration"
      - "Pollination"
    answer: "Pollination"
    topic: "Plants & Growth"
    explanation: "Pollination moves pollen from an anther to a stigma. This can help a flower form seeds after fertilization."
  - question: "What is the beginning of a seed's growth into a seedling called?"
    choices:
      - "Germination"
      - "Pollination"
      - "Revolution"
      - "Condensation"
    answer: "Germination"
    topic: "Plants & Growth"
    explanation: "Germination is when a seed begins growing. A root and shoot develop into a seedling."
  - question: "Which flower structure produces pollen?"
    choices:
      - "Stigma"
      - "Anther"
      - "Ovary"
      - "Sepal"
    answer: "Anther"
    topic: "Plants & Growth"
    explanation: "The anther is the part of a flower that makes and releases pollen."
  - question: "Which flower structure receives pollen?"
    choices:
      - "Anther"
      - "Petal"
      - "Stigma"
      - "Root hair"
    answer: "Stigma"
    topic: "Plants & Growth"
    explanation: "The stigma is the flower part that receives pollen during pollination."
  - question: "Which plant process uses light energy to turn carbon dioxide and water into sugars?"
    choices:
      - "Cellular respiration"
      - "Transpiration"
      - "Germination"
      - "Photosynthesis"
    answer: "Photosynthesis"
    topic: "Plants & Growth"
    explanation: "Photosynthesis uses light energy to make sugars from water and carbon dioxide. Oxygen is also released."
  - question: "Which mineral from soil is part of chlorophyll, the green pigment in leaves?"
    choices:
      - "Magnesium"
      - "Gold"
      - "Silver"
      - "Lead"
    answer: "Magnesium"
    topic: "Plants & Growth"
    explanation: "Magnesium is part of chlorophyll. Plants need it to make the green pigment used in photosynthesis."
  - question: "Which term names the four-stage insect life cycle of egg, larva, pupa, and adult?"
    choices:
      - "Incomplete metamorphosis"
      - "Complete metamorphosis"
      - "Hibernation"
      - "Migration"
    answer: "Complete metamorphosis"
    topic: "Animals & Life Cycles"
    explanation: "Complete metamorphosis has four stages: egg, larva, pupa, and adult. The larva looks very different from the adult."
  - question: "In incomplete metamorphosis, what is the young insect that looks like a smaller adult called?"
    choices:
      - "Pupa"
      - "Chrysalis"
      - "Nymph"
      - "Tadpole"
    answer: "Nymph"
    topic: "Animals & Life Cycles"
    explanation: "A nymph is a young insect in incomplete metamorphosis. It looks like a smaller adult and grows without a pupal stage."
  - question: "Which insect life stage usually does most of the feeding and growing in a butterfly?"
    choices:
      - "Pupa"
      - "Egg"
      - "Adult male only"
      - "Larva"
    answer: "Larva"
    topic: "Animals & Life Cycles"
    explanation: "The larva, or caterpillar, eats heavily and grows before entering the pupal stage."
  - question: "Which term names the stage between larva and adult in complete metamorphosis?"
    choices:
      - "Pupa"
      - "Nymph"
      - "Egg"
      - "Embryo"
    answer: "Pupa"
    topic: "Animals & Life Cycles"
    explanation: "The pupa is the stage when the larva's body changes into the adult form."
  - question: "Which animal group includes a platypus, even though it lays eggs?"
    choices:
      - "Birds"
      - "Mammals"
      - "Reptiles"
      - "Amphibians"
    answer: "Mammals"
    topic: "Animals & Life Cycles"
    explanation: "A platypus lays eggs but feeds its young with milk. Milk production makes it a mammal."
  - question: "Which animal class includes penguins, even though they cannot fly?"
    choices:
      - "Mammals"
      - "Reptiles"
      - "Birds"
      - "Amphibians"
    answer: "Birds"
    topic: "Animals & Life Cycles"
    explanation: "Penguins have feathers, so they are birds. An animal does not need to fly to be a bird."
  - question: "Which trait belongs only to mammals among these choices?"
    choices:
      - "Egg laying"
      - "Swimming"
      - "Breathing with lungs"
      - "Milk production for young"
    answer: "Milk production for young"
    topic: "Animals & Life Cycles"
    explanation: "Only mammals make milk for their young. Other animal groups can also lay eggs, swim, or breathe with lungs."
  - question: "A firefly produces light through bioluminescence. What does bioluminescence mean?"
    choices:
      - "Light produced by a living organism"
      - "Light reflected by a shiny surface"
      - "Light produced only by electricity"
      - "Light coming from the Sun"
    answer: "Light produced by a living organism"
    topic: "Light & Sound"
    explanation: "Fireflies make light through chemical reactions in their bodies. Light made by living things is called bioluminescence."
  - question: "What is a consumer that eats producers directly called?"
    choices:
      - "Secondary consumer"
      - "Primary consumer"
      - "Tertiary consumer"
      - "Decomposer only"
    answer: "Primary consumer"
    topic: "Ecosystems & Relationships"
    explanation: "A primary consumer eats producers, such as a grasshopper eating grass."
  - question: "What is a consumer that eats primary consumers called?"
    choices:
      - "Producer"
      - "Primary consumer"
      - "Secondary consumer"
      - "Mineral nutrient"
    answer: "Secondary consumer"
    topic: "Ecosystems & Relationships"
    explanation: "A secondary consumer eats primary consumers, such as a frog eating a plant-eating grasshopper."
  - question: "What is an organism that breaks down dead material called?"
    choices:
      - "Producer"
      - "Predator only"
      - "Pollinator only"
      - "Decomposer"
    answer: "Decomposer"
    topic: "Ecosystems & Relationships"
    explanation: "Decomposers break down dead material and help return nutrients to the environment."
  - question: "Which term describes an animal that eats only plant material?"
    choices:
      - "Herbivore"
      - "Carnivore"
      - "Omnivore"
      - "Parasite"
    answer: "Herbivore"
    topic: "Ecosystems & Relationships"
    explanation: "Herbivores eat plant material, such as rabbits eating grass."
  - question: "Which term describes an animal that eats other animals?"
    choices:
      - "Herbivore"
      - "Carnivore"
      - "Producer"
      - "Decomposer"
    answer: "Carnivore"
    topic: "Ecosystems & Relationships"
    explanation: "Carnivores eat other animals, such as owls eating mice."
  - question: "Which term describes an animal that eats both plants and animals?"
    choices:
      - "Herbivore"
      - "Carnivore"
      - "Omnivore"
      - "Producer"
    answer: "Omnivore"
    topic: "Ecosystems & Relationships"
    explanation: "Omnivores eat both plant and animal foods, such as bears eating berries and fish."
  - question: "What does each feeding position in a food chain represent?"
    choices:
      - "Atmospheric layer"
      - "Life-cycle stage"
      - "Animal class"
      - "Trophic level"
    answer: "Trophic level"
    topic: "Ecosystems & Relationships"
    explanation: "A trophic level is a feeding position, such as producer, primary consumer, or secondary consumer."
  - question: "Which relationship occurs when a bee gets nectar and pollinates a flower?"
    choices:
      - "Mutualism"
      - "Commensalism"
      - "Parasitism"
      - "Competition"
    answer: "Mutualism"
    topic: "Ecosystems & Relationships"
    explanation: "The bee gets food from nectar, and the flower gets help with pollination. Both benefit, so this is mutualism."
  - question: "Which relationship occurs when a tick feeds on and harms a dog?"
    choices:
      - "Commensalism"
      - "Parasitism"
      - "Mutualism"
      - "Competition"
    answer: "Parasitism"
    topic: "Ecosystems & Relationships"
    explanation: "The tick gets food from the dog, but the dog is harmed. This is parasitism."
  - question: "Two birds both need the same nesting hole, but there is room for only one. What is this relationship called?"
    choices:
      - "Mutualism"
      - "Commensalism"
      - "Competition"
      - "Parasitism"
    answer: "Competition"
    topic: "Ecosystems & Relationships"
    explanation: "Both birds need a resource that is too limited to share. Their struggle for it is competition."
  - question: "A harmless fly looks like a stinging wasp. What is this adaptation called?"
    choices:
      - "Camouflage"
      - "Migration"
      - "Hibernation"
      - "Mimicry"
    answer: "Mimicry"
    topic: "Ecosystems & Relationships"
    explanation: "The fly resembles another animal, a wasp. This is mimicry, not camouflage that matches a background."
  - question: "What do we call living things, their nonliving surroundings, and how they affect one another?"
    choices:
      - "Ecosystem"
      - "Animal class"
      - "Organelle"
      - "Life-cycle stage"
    answer: "Ecosystem"
    topic: "Ecosystems & Relationships"
    explanation: "An ecosystem includes living things, nonliving surroundings, and the ways they affect one another."
  - question: "Kidney tubules are tiny tubes. What is the return of useful water and nutrients from these tubes to the blood called?"
    choices:
      - "Digestion"
      - "Reabsorption"
      - "Exhalation"
      - "Egestion"
    answer: "Reabsorption"
    topic: "Kidneys & Digestion"
    explanation: "Reabsorption returns useful water and nutrients from the filtered fluid to the blood, instead of losing them in urine."
  - question: "Which tube carries urine from a kidney to the bladder?"
    choices:
      - "Urethra"
      - "Esophagus"
      - "Ureter"
      - "Trachea"
    answer: "Ureter"
    topic: "Kidneys & Digestion"
    explanation: "Each ureter carries urine from a kidney to the bladder. The urethra carries it out of the body."
  - question: "Which tube carries urine from the bladder out of the body?"
    choices:
      - "Ureter"
      - "Renal artery"
      - "Esophagus"
      - "Urethra"
    answer: "Urethra"
    topic: "Kidneys & Digestion"
    explanation: "The urethra is the tube that carries urine from the bladder to the outside of the body."
  - question: "What is the group of tiny blood vessels where filtering begins in a nephron called?"
    choices:
      - "Glomerulus"
      - "Ureter"
      - "Bladder"
      - "Renal pelvis"
    answer: "Glomerulus"
    topic: "Kidneys & Digestion"
    explanation: "The glomerulus is a group of tiny blood vessels that filters fluid into the nephron."
  - question: "What is the outer region of a kidney called?"
    choices:
      - "Renal pelvis"
      - "Renal cortex"
      - "Ureter"
      - "Bladder"
    answer: "Renal cortex"
    topic: "Kidneys & Digestion"
    explanation: "The renal cortex is the kidney's outer region. Many of its filtering structures are found there."
  - question: "What is the inner region of a kidney called?"
    choices:
      - "Renal cortex"
      - "Urethra"
      - "Renal medulla"
      - "Colon"
    answer: "Renal medulla"
    topic: "Kidneys & Digestion"
    explanation: "The renal medulla is the kidney's inner region. It contains parts of tubules and ducts involved in making urine."
  - question: "Which vessel brings blood into a kidney for filtering?"
    choices:
      - "Ureter"
      - "Urethra"
      - "Renal vein"
      - "Renal artery"
    answer: "Renal artery"
    topic: "Kidneys & Digestion"
    explanation: "The renal artery brings blood into a kidney. The renal vein carries blood away after it passes through the kidney."
  - question: "Which waste is made when the body uses protein and is removed from blood by the kidneys?"
    choices:
      - "Urea"
      - "Chlorophyll"
      - "Starch"
      - "Cellulose"
    answer: "Urea"
    topic: "Kidneys & Digestion"
    explanation: "Urea is a waste formed when the body uses protein. Kidneys remove it from blood and pass it out in urine."
  - question: "Which vitamin helps the body absorb iron from beans and other plant foods?"
    choices:
      - "Vitamin K"
      - "Vitamin C"
      - "Vitamin D"
      - "Vitamin B12"
    answer: "Vitamin C"
    topic: "Vitamins & Minerals"
    explanation: "Vitamin C helps the body absorb the kind of iron found in plant foods such as beans."
  - question: "Which mineral helps the body grow and repair damaged tissues?"
    choices:
      - "Iodine"
      - "Calcium"
      - "Zinc"
      - "Sodium"
    answer: "Zinc"
    topic: "Vitamins & Minerals"
    explanation: "Zinc supports many processes needed for growth and tissue repair, including normal wound healing."
  - question: "Which orange pigment in carrots can the body turn into vitamin A?"
    choices:
      - "Hemoglobin"
      - "Chlorophyll"
      - "Melanin"
      - "Beta-carotene"
    answer: "Beta-carotene"
    topic: "Vitamins & Minerals"
    explanation: "Beta-carotene gives carrots an orange color. The body can turn it into vitamin A when needed."
  - question: "Fat-soluble vitamins dissolve in fat. Which group contains only these vitamins?"
    choices:
      - "Vitamins A, D, E, and K"
      - "Vitamins B1, B2, B12, and C"
      - "Vitamins A, B1, C, and D"
      - "Vitamins B6, C, D, and K"
    answer: "Vitamins A, D, E, and K"
    topic: "Vitamins & Minerals"
    explanation: "Vitamins A, D, E, and K dissolve in fat. B vitamins and vitamin C are water-soluble."
  - question: "Which vitamin dissolves in water rather than in fat?"
    choices:
      - "Vitamin A"
      - "Vitamin C"
      - "Vitamin D"
      - "Vitamin K"
    answer: "Vitamin C"
    topic: "Vitamins & Minerals"
    explanation: "Vitamin C dissolves in water. Vitamins A, D, and K dissolve in fat instead."
  - question: "Which food naturally contains vitamin D?"
    choices:
      - "White rice"
      - "Table sugar"
      - "Salmon"
      - "Cucumber"
    answer: "Salmon"
    topic: "Vitamins & Minerals"
    explanation: "Fatty fish such as salmon naturally contain vitamin D. Some other foods have vitamin D added to them."
  - question: "Which food is a good source of vitamin K?"
    choices:
      - "White sugar"
      - "Table salt"
      - "Plain cooking oil only"
      - "Leafy green vegetables"
    answer: "Leafy green vegetables"
    topic: "Vitamins & Minerals"
    explanation: "Leafy green vegetables contain vitamin K, which helps blood clot normally."
  - question: "Which nutrient pair works together to help the body absorb calcium and build strong bones?"
    choices:
      - "Vitamin D and calcium"
      - "Vitamin C and iodine"
      - "Vitamin A and sodium"
      - "Vitamin K and iron"
    answer: "Vitamin D and calcium"
    topic: "Vitamins & Minerals"
    explanation: "Vitamin D helps absorb calcium, and calcium helps build bones. These nutrients work together."
  - question: "What is the process by which cells release usable energy from nutrients called?"
    choices:
      - "Photosynthesis"
      - "Cellular respiration"
      - "Transpiration"
      - "Pollination"
    answer: "Cellular respiration"
    topic: "Cells & Energy"
    explanation: "Cellular respiration releases energy stored in nutrients and helps cells make ATP for their work."
  - question: "Which molecule carries energy that cells can use right away?"
    choices:
      - "DNA"
      - "Cellulose"
      - "ATP"
      - "Chlorophyll"
    answer: "ATP"
    topic: "Cells & Energy"
    explanation: "ATP carries energy that cells can use for tasks such as moving materials, growing, and repairing themselves."
  - question: "Aerobic cellular respiration releases energy from food using a gas. Which gas does it use?"
    choices:
      - "Helium"
      - "Nitrogen"
      - "Hydrogen"
      - "Oxygen"
    answer: "Oxygen"
    topic: "Cells & Energy"
    explanation: "Aerobic cellular respiration uses oxygen to help release energy from food."
  - question: "When cells use oxygen to release energy from food, which two substances are also made?"
    choices:
      - "Carbon dioxide and water"
      - "Oxygen and glucose"
      - "Nitrogen and salt"
      - "Chlorophyll and starch"
    answer: "Carbon dioxide and water"
    topic: "Cells & Energy"
    explanation: "When cells break down food using oxygen, they produce carbon dioxide and water while releasing usable energy."
  - question: "Which property tells how tightly mass is packed into a material?"
    choices:
      - "Speed"
      - "Density"
      - "Hardness"
      - "Temperature"
    answer: "Density"
    topic: "Matter & Materials"
    explanation: "Density describes how much mass is packed into a given space. Materials can have different densities even if they take up the same space."
  - question: "How are water molecules arranged in ice, making it less dense than liquid water?"
    choices:
      - "A tightly packed metallic lattice"
      - "Detached hydrogen atoms"
      - "An open crystalline structure"
      - "A collection of trapped air bubbles only"
    answer: "An open crystalline structure"
    topic: "Matter & Materials"
    explanation: "Ice has a crystal pattern with spaces between water molecules. This makes it less dense than liquid water."
  - question: "What change of state happens when liquid water boils into vapor?"
    choices:
      - "Freezing"
      - "Melting"
      - "Condensation"
      - "Vaporization"
    answer: "Vaporization"
    topic: "Matter & Materials"
    explanation: "Vaporization changes a liquid into a gas. During boiling, water vapor forms bubbles throughout the liquid."
  - question: "What is the temperature at which a solid becomes a liquid called?"
    choices:
      - "Melting point"
      - "Boiling point"
      - "Freezing duration"
      - "Sound level"
    answer: "Melting point"
    topic: "Matter & Materials"
    explanation: "The melting point is the temperature at which a solid changes into a liquid under given conditions."
  - question: "What is a liquid changing into gas at its surface called?"
    choices:
      - "Freezing"
      - "Evaporation"
      - "Melting"
      - "Condensation"
    answer: "Evaporation"
    topic: "Matter & Materials"
    explanation: "Evaporation happens when particles escape from the surface of a liquid as gas. It can happen below the boiling point."
  - question: "What is water vapor changing into liquid droplets called?"
    choices:
      - "Evaporation"
      - "Melting"
      - "Condensation"
      - "Freezing"
    answer: "Condensation"
    topic: "Matter & Materials"
    explanation: "Condensation happens when water vapor cools and changes into liquid droplets."
  - question: "What type of heat transfer happens when touching particles pass heat to one another?"
    choices:
      - "Radiation"
      - "Convection"
      - "Refraction"
      - "Conduction"
    answer: "Conduction"
    topic: "Matter & Materials"
    explanation: "In conduction, nearby particles pass heat to one another through contact without the whole material flowing."
  - question: "What type of heat transfer happens as warm liquid or gas moves?"
    choices:
      - "Convection"
      - "Conduction"
      - "Radiation"
      - "Reflection"
    answer: "Convection"
    topic: "Matter & Materials"
    explanation: "In convection, moving liquid or gas carries heat. Warm regions often rise while cooler regions sink."
  - question: "Which term describes a material that slows heat transfer?"
    choices:
      - "Thermal conductor"
      - "Thermal insulator"
      - "Light source"
      - "Magnetic pole"
    answer: "Thermal insulator"
    topic: "Matter & Materials"
    explanation: "A thermal insulator slows heat transfer. It does not stop every kind of heat transfer completely."
  - question: "What do we call a material that does not let electric current flow through it easily?"
    choices:
      - "Electrical conductor"
      - "Heat source"
      - "Electrical insulator"
      - "Magnet"
    answer: "Electrical insulator"
    topic: "Matter & Materials"
    explanation: "An electrical insulator resists electric current. Plastic and rubber are common examples."
  - question: "What is the science term for an object that gives off its own light?"
    choices:
      - "Nonluminous"
      - "Transparent only"
      - "Reflective only"
      - "Luminous"
    answer: "Luminous"
    topic: "Light & Sound"
    explanation: "Luminous objects give off their own light, such as stars and glowing light bulbs."
  - question: "What is the science term for an object that does not make its own light but can reflect light?"
    choices:
      - "Nonluminous"
      - "Luminous"
      - "Bioluminescent"
      - "Incandescent"
    answer: "Nonluminous"
    topic: "Light & Sound"
    explanation: "Nonluminous objects do not make their own visible light. We see them when they reflect light from another source."
  - question: "What process makes light bounce off a mirror toward someone's eyes?"
    choices:
      - "Refraction"
      - "Reflection"
      - "Convection"
      - "Cellular respiration"
    answer: "Reflection"
    topic: "Light & Sound"
    explanation: "Reflection is light bouncing from a surface. A mirror reflects light that can then enter our eyes."
  - question: "What is the number of sound-wave vibrations per second called?"
    choices:
      - "Intensity"
      - "Distance"
      - "Frequency"
      - "Density"
    answer: "Frequency"
    topic: "Light & Sound"
    explanation: "Frequency counts how many vibrations happen each second. Higher sound frequency usually gives a higher pitch."
  - question: "Which unit measures sound frequency rather than sound level?"
    choices:
      - "Decibel"
      - "Meter"
      - "Degree Celsius"
      - "Hertz"
    answer: "Hertz"
    topic: "Light & Sound"
    explanation: "Hertz means vibrations per second. Decibels describe sound level, not frequency."
  - question: "Which sound property tells us how high or low a note sounds?"
    choices:
      - "Pitch"
      - "Loudness"
      - "Duration"
      - "Speed"
    answer: "Pitch"
    topic: "Light & Sound"
    explanation: "Pitch describes how high or low a sound seems. It depends mainly on the sound's frequency."
  - question: "Which term describes how fast an object travels over a whole trip?"
    choices:
      - "Mass"
      - "Average speed"
      - "Force"
      - "Density"
    answer: "Average speed"
    topic: "Forces & Motion"
    explanation: "Average speed describes the whole trip, including fast parts, slow parts, and any stops."
  - question: "Which unit is commonly used for speed in science?"
    choices:
      - "Meters only"
      - "Seconds only"
      - "Meters per second"
      - "Decibels"
    answer: "Meters per second"
    topic: "Forces & Motion"
    explanation: "Meters per second tells how many meters an object travels in each second."
  - question: "What is the name for the whole length of the path an object travels?"
    choices:
      - "Speed"
      - "Time"
      - "Force"
      - "Distance"
    answer: "Distance"
    topic: "Forces & Motion"
    explanation: "Distance describes how far an object travels along its path. Speed describes how quickly it covers that distance."
  - question: "Which term means an object keeps the same speed during a trip?"
    choices:
      - "Constant speed"
      - "Changing speed"
      - "Friction"
      - "Gravity"
    answer: "Constant speed"
    topic: "Forces & Motion"
    explanation: "Constant speed means the object does not speed up or slow down. It can keep the same speed even if its direction changes."
  - question: "Which contact force is also called drag when an object moves through air?"
    choices:
      - "Gravity"
      - "Air resistance"
      - "Magnetism"
      - "Weight"
    answer: "Air resistance"
    topic: "Forces & Motion"
    explanation: "Drag is resistance from a fluid, such as air. Air particles push against an object moving through them."
  - question: "Which feature of Earth causes the seasons as Earth moves around the Sun?"
    choices:
      - "Daily rotation speed changes"
      - "Number of moons"
      - "Axial tilt"
      - "Distance from the Equator to the Moon"
    answer: "Axial tilt"
    topic: "Earth, Weather & Space"
    explanation: "Earth's axis is tilted. As Earth travels around the Sun, each half receives different sunlight angles and day lengths."
  - question: "What do we call the path Earth follows around the Sun?"
    choices:
      - "Axis"
      - "Equator"
      - "Atmosphere"
      - "Orbit"
    answer: "Orbit"
    topic: "Earth, Weather & Space"
    explanation: "An orbit is the path an object follows around another object. Earth's orbit is its path around the Sun."
  - question: "Which planet has natural moons named Phobos and Deimos?"
    choices:
      - "Mars"
      - "Earth"
      - "Venus"
      - "Mercury"
    answer: "Mars"
    topic: "Earth, Weather & Space"
    explanation: "Phobos and Deimos are the natural moons of Mars. Moon names can help identify the planet they orbit."
  - question: "Which planet lies between Mars and Saturn in order from the Sun?"
    choices:
      - "Venus"
      - "Jupiter"
      - "Mercury"
      - "Earth"
    answer: "Jupiter"
    topic: "Earth, Weather & Space"
    explanation: "Moving outward from the Sun, the order in this part of the solar system is Mars, Jupiter, then Saturn."
  - question: "Which mineral forms hard crystals and is a common source of silica for making glass?"
    choices:
      - "Talc"
      - "Gypsum"
      - "Quartz"
      - "Calcite"
    answer: "Quartz"
    topic: "Minerals & Hardness"
    explanation: "Quartz is made of silica. It is a common hard mineral found in rocks and sand used for glassmaking."
  - question: "Which mineral can scratch gypsum but is softer than quartz?"
    choices:
      - "Talc"
      - "Diamond"
      - "Corundum"
      - "Calcite"
    answer: "Calcite"
    topic: "Minerals & Hardness"
    explanation: "Calcite is harder than gypsum but softer than quartz. Talc is softer than gypsum, while diamond and corundum are harder than quartz."
difficult:
  - question: "Ana forgot to water her plant for several days. Which plant part will have difficulty doing its job first?"
    choices:
      - "Roots, because they absorb water from the soil"
      - "Flower, because it makes seeds"
      - "Fruit, because it protects the seeds"
      - "Leaves, because they hold the plant in the soil"
    answer: "Roots, because they absorb water from the soil"
    topic: "Plants & Growth"
    explanation: "Roots need water in the soil to absorb it. Dry soil makes this job harder, even before the rest of the plant shows the effects."
  - question: "A plant has healthy roots, stem, and leaves, but its flowers were removed. What is most likely to happen?"
    choices:
      - "The plant cannot absorb water anymore."
      - "The plant may have difficulty making seeds."
      - "The plant will fall because it has no support."
      - "The leaves will stop getting sunlight."
    answer: "The plant may have difficulty making seeds."
    topic: "Plants & Growth"
    explanation: "Flowers contain the parts needed to form seeds. Removing them can prevent seed formation, though roots and leaves can still work."
  - question: "Carlo puts one plant near a sunny window and one in a dark box. He gives both the same amount of water. Which will likely grow better, and why?"
    choices:
      - "The plant in the box, because its roots do not need light."
      - "The plant in the box, because its stem can make food."
      - "The plant near the window, because its leaves use sunlight to make food."
      - "Both will grow the same because only water is needed."
    answer: "The plant near the window, because its leaves use sunlight to make food."
    topic: "Plants & Growth"
    explanation: "Both plants have water, but the plant near the window also has light. Its leaves can use that light to make food."
  - question: "Study the food chain: Grass → Grasshopper → Frog → Hawk. Which statement best describes a food chain?"
    choices:
      - "It shows all the organisms living in one habitat."
      - "It groups organisms according to their body parts."
      - "It shows several feeding pathways joined together."
      - "It shows one pathway of feeding relationships among organisms."
    answer: "It shows one pathway of feeding relationships among organisms."
    topic: "Ecosystems & Relationships"
    explanation: "The arrows show one route of energy transfer: grass to grasshopper to frog to hawk. A web would show several connected routes."
  - question: "Study the food chain: Grass → Grasshopper → Frog → Hawk. Which statement is correct?"
    choices:
      - "The grasshopper gets energy directly from the grass."
      - "The frog gets energy directly from the grass."
      - "The hawk gets energy directly from the grasshopper."
      - "The grass gets energy directly from the frog."
    answer: "The grasshopper gets energy directly from the grass."
    topic: "Ecosystems & Relationships"
    explanation: "The grasshopper eats the grass, so it receives energy directly from grass. The frog and hawk receive that energy through other animals."
  - question: "Study the food chain: Grass → Grasshopper → Frog → Hawk. If the number of grasshoppers becomes much smaller, what is the most likely effect on the frogs?"
    choices:
      - "Frogs may have more grass to eat."
      - "Frogs may have less food available."
      - "Frogs may receive more energy from hawks."
      - "Frogs may no longer depend on other organisms for food."
    answer: "Frogs may have less food available."
    topic: "Ecosystems & Relationships"
    explanation: "Frogs eat grasshoppers in this chain. Fewer grasshoppers means less of that food is available to the frogs."
  - question: "Why is a food web more complex than a food chain?"
    choices:
      - "It shows organisms arranged from smallest to largest."
      - "It shows only organisms that live in the same place."
      - "It shows several connected feeding relationships."
      - "It shows one organism eating only one kind of food."
    answer: "It shows several connected feeding relationships."
    topic: "Ecosystems & Relationships"
    explanation: "A food web joins many food chains. One animal may eat several foods and may be eaten by several predators."
  - question: "In a food web, a frog may be eaten by both a snake and a hawk. What does this tell us?"
    choices:
      - "Every predator eats the same kind of prey."
      - "An organism can belong to only one feeding relationship."
      - "Predators receive energy directly from plants."
      - "One organism can be connected to more than one consumer."
    answer: "One organism can be connected to more than one consumer."
    topic: "Ecosystems & Relationships"
    explanation: "Both the snake and the hawk eat frogs. A food web can show one prey animal linked to more than one predator."
  - question: "What happens during the caterpillar stage?"
    choices:
      - "It eats and grows."
      - "It lays eggs."
      - "It flies from flower to flower."
      - "It stays inside a chrysalis."
    answer: "It eats and grows."
    topic: "Animals & Life Cycles"
    explanation: "Caterpillars eat leaves and grow. They do not lay eggs or fly during this stage."
  - question: "Which sequence shows the correct order of the butterfly life cycle?"
    choices:
      - "Egg → Chrysalis → Caterpillar → Butterfly"
      - "Egg → Caterpillar → Chrysalis → Butterfly"
      - "Caterpillar → Egg → Butterfly → Chrysalis"
      - "Butterfly → Chrysalis → Egg → Caterpillar"
    answer: "Egg → Caterpillar → Chrysalis → Butterfly"
    topic: "Animals & Life Cycles"
    explanation: "The egg hatches into a caterpillar. The caterpillar forms a chrysalis, and an adult butterfly later emerges."
  - question: "Mia sees a caterpillar eating leaves. What will most likely happen next as it continues its life cycle?"
    choices:
      - "It will become an egg."
      - "It will immediately begin flying."
      - "It will form a chrysalis."
      - "It will become a tadpole."
    answer: "It will form a chrysalis."
    topic: "Animals & Life Cycles"
    explanation: "After feeding and growing, the caterpillar enters the pupal stage by forming a chrysalis."
  - question: "A pupil says a caterpillar and a butterfly cannot be the same animal because they look different. Which statement explains the pupil's mistake?"
    choices:
      - "Caterpillars and butterflies eat exactly the same food."
      - "All insects look different every day."
      - "Butterflies change back into caterpillars after flying."
      - "A caterpillar changes through different stages until it becomes a butterfly."
    answer: "A caterpillar changes through different stages until it becomes a butterfly."
    topic: "Animals & Life Cycles"
    explanation: "A caterpillar is the young stage of a butterfly. Metamorphosis changes its body, but it is still the same animal."
  - question: "An aquarium has fish, a snail, plants, rocks, gravel, a toy castle, and an air pump. Lea puts the fish, snail, and plants in one group. Why do they belong together?"
    choices:
      - "They all need certain conditions to live and grow."
      - "They are all found near the bottom of the aquarium."
      - "They all have the same body parts."
      - "They all move from one place to another."
    answer: "They all need certain conditions to live and grow."
    topic: "Matter & Materials"
    explanation: "Fish, snails, and plants all carry out life processes. They need suitable conditions to stay alive and grow."
  - question: "In an aquarium, which pair is different from the others because both members are nonliving?"
    choices:
      - "Fish and snail"
      - "Rock and gravel"
      - "Plant and fish"
      - "Snail and plant"
    answer: "Rock and gravel"
    topic: "Matter & Materials"
    explanation: "Rocks and gravel do not carry out life processes. The other pairs contain living animals or plants."
  - question: "Carlo says, “The green aquarium plant is nonliving because it does not swim.” Which observation best shows that Carlo is incorrect?"
    choices:
      - "The plant stays beside the rock."
      - "The plant is green and stands upright."
      - "The plant can grow and needs water and sunlight."
      - "The plant is surrounded by gravel."
    answer: "The plant can grow and needs water and sunlight."
    topic: "Matter & Materials"
    explanation: "A plant's growth and need for water and light show that it is living. Swimming is not needed to be alive."
  - question: "Suppose all the living things were removed from an aquarium. Which group could still remain?"
    choices:
      - "Fish, plants, and gravel"
      - "Snail, rock, and castle"
      - "Plants, castle, and sunlight"
      - "Air pump, rock, and gravel"
    answer: "Air pump, rock, and gravel"
    topic: "Matter & Materials"
    explanation: "The pump, rock, and gravel are nonliving. They can remain after the fish, snails, and plants are removed."
  - question: "A pupil puts fish, snails, and plants in Group A, and rocks, gravel, and a toy castle in Group B. Which rule explains the groups?"
    choices:
      - "Living things and nonliving things"
      - "Things that swim and things that fly"
      - "Large things and small things"
      - "Things found in water and things found on land"
    answer: "Living things and nonliving things"
    topic: "Matter & Materials"
    explanation: "The members of Group A carry out life processes. The objects in Group B do not, even though all can be found in an aquarium."
  - question: "A learner says, “A dolphin must be a fish because it lives in water and has fins.” Which evidence best shows that the learner is incorrect?"
    choices:
      - "Dolphins are large animals."
      - "Dolphins breathe air with lungs and feed their babies with milk."
      - "Dolphins can swim quickly."
      - "Dolphins live in groups."
    answer: "Dolphins breathe air with lungs and feed their babies with milk."
    topic: "Animals & Life Cycles"
    explanation: "Dolphins use lungs and feed milk to their young. These mammal traits are better clues than living in water or having fins."
  - question: "Study these animals: Bat, Eagle, Dolphin, Cat. Which two animals may look very different or live in different places but still belong to the same animal group?"
    choices:
      - "Eagle and bat"
      - "Eagle and dolphin"
      - "Dolphin and cat"
      - "Eagle and cat"
    answer: "Dolphin and cat"
    topic: "Animals & Life Cycles"
    explanation: "Dolphins and cats both feed milk to their young, so both are mammals despite their different bodies and habitats."
  - question: "A frog sees a grasshopper and catches it for food. Which statement is correct?"
    choices:
      - "The frog is the prey."
      - "The grasshopper is the predator."
      - "Both are predators."
      - "The frog is the predator and the grasshopper is the prey."
    answer: "The frog is the predator and the grasshopper is the prey."
    topic: "Ecosystems & Relationships"
    explanation: "The frog hunts and eats the grasshopper. The hunter is the predator, and the animal being eaten is the prey."
  - question: "A lunch contains fish, leafy vegetables, beans, and fruit. What is the strongest reason this meal can provide several nutrients?"
    choices:
      - "Different foods can provide different vitamins and minerals."
      - "Every food contains exactly the same nutrients."
      - "Only fruits provide vitamins and minerals."
      - "A food's color tells us every nutrient it contains."
    answer: "Different foods can provide different vitamins and minerals."
    topic: "Vitamins & Minerals"
    explanation: "Different foods contain different nutrients. A varied meal can supply more kinds of vitamins and minerals than just one food."
  - question: "Mia leaves a quiet room and joins a loud conversation. What happens to the sound level around her?"
    choices:
      - "It becomes quieter."
      - "It becomes louder."
      - "It stays the same."
      - "It becomes silent."
    answer: "It becomes louder."
    topic: "Light & Sound"
    explanation: "The conversation produces a higher sound level than the quiet room. Sound level describes how strong a sound is, not its pitch."
  - question: "Ben hears a soft whisper, a normal conversation, and a very loud siren. Which order goes from quietest to loudest?"
    choices:
      - "Siren → conversation → whisper"
      - "Conversation → siren → whisper"
      - "Whisper → conversation → siren"
      - "Whisper → siren → conversation"
    answer: "Whisper → conversation → siren"
    topic: "Light & Sound"
    explanation: "A soft whisper is quieter than a normal conversation, while the very loud siren is the loudest sound described."
  - question: "Ana wants to spend a long time somewhere without risking her hearing. Which place is the best choice?"
    choices:
      - "Beside loud machinery"
      - "Next to a roaring train"
      - "Beside a very loud speaker"
      - "A quiet room"
    answer: "A quiet room"
    topic: "Light & Sound"
    explanation: "The quiet room has less noise. Long exposure to loud machinery, trains, or speakers can harm hearing."
  - question: "It is summer in the Northern Hemisphere while it is winter in the Southern Hemisphere. What best explains this difference?"
    choices:
      - "Earth’s tilt causes the hemispheres to receive sunlight differently."
      - "One hemisphere is much closer to the Sun."
      - "Earth rotates faster during summer."
      - "The Sun becomes hotter for one hemisphere."
    answer: "Earth’s tilt causes the hemispheres to receive sunlight differently."
    topic: "Earth, Weather & Space"
    explanation: "Earth's tilt makes one half receive more direct sunlight and longer days while the other receives less direct sunlight and shorter days."
  - question: "Imagine Earth still spinning on its axis but no longer moving around the Sun. Which pattern would continue?"
    choices:
      - "The yearly cycle would continue normally."
      - "Day and night would continue."
      - "The seasons would continue normally."
      - "Earth would always have daytime."
    answer: "Day and night would continue."
    topic: "Earth, Weather & Space"
    explanation: "Spinning still turns places toward and away from the Sun. That motion causes day and night."
  - question: "Johanne lives near the Equator. Ezra lives far north. Why do Johanne's temperature and hours of daylight usually change less during the year?"
    choices:
      - "The Equator is much closer to the Sun than other places."
      - "Earth stops tilting near the Equator."
      - "The Equator receives relatively direct sunlight throughout the year."
      - "The Equator does not receive sunlight during winter."
    answer: "The Equator receives relatively direct sunlight throughout the year."
    topic: "Earth, Weather & Space"
    explanation: "Sunlight stays fairly direct near the Equator, and day length changes less there. Farther north, Earth's tilt causes larger yearly changes."
  - question: "Which statement correctly compares Earth and Mars?"
    choices:
      - "Both are gas giants."
      - "Earth is a star, while Mars is a planet."
      - "Neither has a solid surface."
      - "Both are rocky planets."
    answer: "Both are rocky planets."
    topic: "Earth, Weather & Space"
    explanation: "Earth and Mars both have solid, rocky surfaces. They are planets, not stars or gas giants."
  - question: "A spacecraft travels away from the Sun. It passes Jupiter and then reaches a planet famous for its large rings. Which planet has it reached?"
    choices:
      - "Saturn"
      - "Mars"
      - "Uranus"
      - "Neptune"
    answer: "Saturn"
    topic: "Earth, Weather & Space"
    explanation: "Saturn comes after Jupiter in order from the Sun and is famous for its large ring system."
  - question: "Scientists find a reddish, rocky planet farther from the Sun than Earth but closer than Jupiter. Which planet is it?"
    choices:
      - "Venus"
      - "Mars"
      - "Saturn"
      - "Neptune"
    answer: "Mars"
    topic: "Earth, Weather & Space"
    explanation: "Mars has a reddish, rocky surface and lies between Earth and Jupiter in order from the Sun."
  - question: "Space teams match planets with clues. Which match has both clues correct?"
    choices:
      - "Earth — blue appearance; gas giant"
      - "Venus — coldest planet; rocky surface"
      - "Mars — reddish surface; rocky planet"
      - "Mercury — farthest from the Sun; rocky surface"
    answer: "Mars — reddish surface; rocky planet"
    topic: "Earth, Weather & Space"
    explanation: "Mars has a reddish, rocky surface. Earth is not a gas giant, Venus is not the coldest planet, and Mercury is nearest the Sun."
  - question: "Why does water take up more space and become less dense when it freezes into ice?"
    choices:
      - "Hydrogen atoms detach from oxygen atoms"
      - "Air bubbles get permanently trapped inside"
      - "Molecules move faster and spread apart"
      - "Water molecules form an open crystalline structure"
    answer: "Water molecules form an open crystalline structure"
    topic: "Matter & Materials"
    explanation: "As water freezes, its molecules form a crystal pattern with more space between them. The same amount of water then takes up more room."
  - question: "A pupil says, “The body should throw away all the water that enters the kidney.” Another says, “Some water must be taken back because the body still needs it.” Which term supports the second pupil's idea?"
    choices:
      - "Reabsorb"
      - "Filter"
      - "Expel"
      - "Secrete"
    answer: "Reabsorb"
    topic: "Kidneys & Digestion"
    explanation: "Reabsorb means take back into the blood. Kidneys must return much of the filtered water so the body does not lose water it still needs."
  - question: "Nina has difficulty seeing in dim light. Her teacher explains that one vitamin supports normal vision. Which food would be a good choice?"
    choices:
      - "White rice"
      - "Carrots"
      - "Sugar"
      - "Salt"
    answer: "Carrots"
    topic: "Vitamins & Minerals"
    explanation: "Carrots contain beta-carotene, which the body can turn into vitamin A. Vitamin A supports vision, especially in dim light."
  - question: "Ana eats beans for lunch. She wants her body to absorb more of the iron from the beans. What could she eat with them?"
    choices:
      - "Butter"
      - "Candy"
      - "Guava"
      - "Salt"
    answer: "Guava"
    topic: "Vitamins & Minerals"
    explanation: "Guava contains vitamin C. Eating it with beans can help the body absorb more of the iron in the beans."
  - question: "Marco cuts his knee while playing. Which nutrient pair helps his body repair tissues and heal the wound?"
    choices:
      - "Vitamin D and sodium"
      - "Vitamin A and iodine"
      - "Vitamin K and potassium"
      - "Vitamin C and zinc"
    answer: "Vitamin C and zinc"
    topic: "Vitamins & Minerals"
    explanation: "Vitamin C helps make collagen for tissue repair. Zinc also supports repair and normal wound healing."
  - question: "Ezra tests minerals A and B. B scratches A, but A cannot scratch B. Which statement is supported?"
    choices:
      - "Mineral B is harder."
      - "Mineral A is harder."
      - "Both have the same hardness."
      - "Mineral B must be heavier."
    answer: "Mineral B is harder."
    topic: "Minerals & Hardness"
    explanation: "A harder mineral can scratch a softer one. The test compares hardness, not weight."
  - question: "Why are many cooking pots made of metal?"
    choices:
      - "Metal stops all heat from moving."
      - "Metal can transfer heat to the food easily."
      - "Metal always stays cold."
      - "Metal makes food lighter."
    answer: "Metal can transfer heat to the food easily."
    topic: "Matter & Materials"
    explanation: "Metal is a good heat conductor. It passes heat from the stove to the food inside the pot."
  - question: "Mia is designing a handle for a hot cooking pan. Which material would be the best choice for the handle?"
    choices:
      - "Copper, because it conducts heat well."
      - "Aluminum, because heat moves through it easily."
      - "Wood, because it slows the movement of heat."
      - "Steel, because it quickly transfers heat."
    answer: "Wood, because it slows the movement of heat."
    topic: "Matter & Materials"
    explanation: "Wood slows heat transfer more than metal does. A wooden handle helps reduce how quickly heat reaches the hand."
  - question: "Ezra places a metal spoon and a wooden spoon in the same bowl of hot soup. After a few minutes, the metal spoon feels warmer. What is the best explanation?"
    choices:
      - "The metal spoon created its own heat."
      - "The wooden spoon removed all the heat from the soup."
      - "Heat can travel only through metal objects."
      - "Heat moved through the metal more easily than through the wood."
    answer: "Heat moved through the metal more easily than through the wood."
    topic: "Matter & Materials"
    explanation: "Heat travels through metal more easily than through wood. The soup supplies the heat; the spoon does not create it."
  - question: "A cooking pan has a metal body and a wooden handle. Why is this a useful design?"
    choices:
      - "Metal transfers heat to the food, while wood slows heat from reaching the hand."
      - "Metal slows heat, while wood makes heat."
      - "Wood transfers heat faster than metal."
      - "Both materials stop heat completely."
    answer: "Metal transfers heat to the food, while wood slows heat from reaching the hand."
    topic: "Matter & Materials"
    explanation: "The metal body carries heat to the food. The wooden handle slows heat moving toward the hand, though a handle can still become hot."
  - question: "An electrical wire has copper inside and plastic covering it. What is the best explanation for using these two materials?"
    choices:
      - "Copper stops electricity, while plastic carries it."
      - "Copper allows electricity to flow, while plastic acts as an insulator."
      - "Both copper and plastic conduct electricity easily."
      - "Plastic produces electricity for the copper."
    answer: "Copper allows electricity to flow, while plastic acts as an insulator."
    topic: "Matter & Materials"
    explanation: "Copper conducts electric current, while plastic resists it. The covering helps prevent contact with the conducting wire."
  - question: "Which statement correctly describes melting?"
    choices:
      - "A liquid loses heat and becomes a solid."
      - "A liquid gains heat and becomes a solid."
      - "A solid gains heat and becomes a liquid."
      - "A gas loses heat and becomes hotter."
    answer: "A solid gains heat and becomes a liquid."
    topic: "Matter & Materials"
    explanation: "A solid melts when it gains enough heat to change into a liquid. A liquid becoming solid is freezing, not melting."
  - question: "Mia places an ice cube and a piece of butter on separate plates in a warm room. After some time, both begin to change. What best explains what happened?"
    choices:
      - "Both lost heat to their surroundings."
      - "Ice and butter have the same melting point."
      - "All solids have the same melting point."
      - "Both gained heat from their surroundings."
    answer: "Both gained heat from their surroundings."
    topic: "Matter & Materials"
    explanation: "The warm room transfers heat to the colder ice and butter. They soften or melt as they gain heat."
  - question: "Carlo heats water and cooking oil. The water starts boiling, but the oil does not boil at the same temperature. What can he conclude?"
    choices:
      - "Different liquids can have different boiling points."
      - "All liquids must boil together."
      - "Cooking oil cannot gain heat."
      - "Water is always hotter than oil."
    answer: "Different liquids can have different boiling points."
    topic: "Matter & Materials"
    explanation: "The liquids behave differently at the same temperature. Each liquid has its own boiling point under the same pressure."
  - question: "Lea places ice, butter, and table salt in a warm place. The ice melts, the butter becomes very soft, but the salt remains solid. Which is the best explanation?"
    choices:
      - "Salt cannot be heated."
      - "Different substances have different melting points, and the temperature is not high enough to melt the salt."
      - "All three materials have the same melting point."
      - "Salt loses heat while ice and butter gain heat."
    answer: "Different substances have different melting points, and the temperature is not high enough to melt the salt."
    topic: "Matter & Materials"
    explanation: "Each substance has its own melting point. The warm place is hot enough to melt ice and soften butter but not to melt salt."
  - question: "Ana can see her book when a lamp is turned on. Which sequence best explains how she sees the book?"
    choices:
      - "Eyes → book → lamp"
      - "Book → lamp → eyes"
      - "Lamp → book → eyes"
      - "Book → eyes → lamp"
    answer: "Lamp → book → eyes"
    topic: "Light & Sound"
    explanation: "Light travels from the lamp to the book and then reflects into Ana's eyes. Eyes receive light rather than send it out to see the book."
  - question: "Ben sees the Moon shining brightly at night. His friend says, “The Moon must produce its own light.” Which observation best shows that his friend is incorrect?"
    choices:
      - "The Moon can be seen at night."
      - "The Moon is found in space."
      - "The Moon sometimes looks round."
      - "The Moon reflects light coming from the Sun."
    answer: "The Moon reflects light coming from the Sun."
    topic: "Light & Sound"
    explanation: "Sunlight reflects from the Moon's surface toward Earth. Being bright in the sky does not mean the Moon makes its own visible light."
  - question: "A flashlight is pointed at a mirror in a dark room. The mirror becomes very bright. Which conclusion is correct?"
    choices:
      - "The mirror is reflecting light from the flashlight."
      - "The mirror has started producing its own light."
      - "The flashlight receives its light from the mirror."
      - "Both objects are natural sources of light."
    answer: "The mirror is reflecting light from the flashlight."
    topic: "Light & Sound"
    explanation: "The flashlight supplies the light, and the mirror reflects it. A mirror is not a light source just because it looks bright."
  - question: "During a power outage, Mia has a mirror, a book, a working flashlight, and a metal spoon. She needs an object that can produce light so she can find her way safely. Which should she choose?"
    choices:
      - "Mirror"
      - "Working flashlight"
      - "Book"
      - "Metal spoon"
    answer: "Working flashlight"
    topic: "Light & Sound"
    explanation: "A working flashlight produces light using battery power. The other objects only reflect light from another source."
  - question: "Situation W: A box moves when pushed. Situation X: An apple falls toward Earth. Situation Y: A magnet attracts a paper clip without touching it. Situation Z: Bicycle brakes slow a wheel. Which situations show non-contact forces?"
    choices:
      - "W and X"
      - "W and Z"
      - "X and Y"
      - "Y and Z"
    answer: "X and Y"
    topic: "Forces & Motion"
    explanation: "Gravity acts in X, and magnetism acts in Y without direct contact. Pushing a box and braking a wheel need contact."
  - question: "Mia rolls a toy car across the floor. She notices that it gradually slows down and stops. Which force mainly causes the car to slow down?"
    choices:
      - "Gravity"
      - "Magnetic force"
      - "Spring force"
      - "Friction"
    answer: "Friction"
    topic: "Forces & Motion"
    explanation: "Friction between the car and the floor opposes its motion, helping slow it down. Air resistance can also contribute."
  - question: "A parachutist opens a parachute while falling. The parachute makes the person fall more slowly. What best explains this?"
    choices:
      - "The parachute increases air resistance."
      - "The parachute removes gravity."
      - "The parachute creates magnetic force."
      - "The parachute stops all forces from acting."
    answer: "The parachute increases air resistance."
    topic: "Forces & Motion"
    explanation: "An open parachute catches more air and increases upward air resistance. Gravity still pulls the person downward."
  - question: "Study the toy car: PUSH → CAR MOVES → CAR SLOWS → CAR STOPS. Which explanation best describes the forces in this process?"
    choices:
      - "Gravity starts the car moving, while magnetism stops it."
      - "The push starts the car moving, while friction helps slow it down."
      - "Friction makes the car speed up, while the push slows it down."
      - "The car moves and stops without any forces acting on it."
    answer: "The push starts the car moving, while friction helps slow it down."
    topic: "Forces & Motion"
    explanation: "The push starts the motion. After the push ends, friction and some air resistance oppose the motion and slow the car."
  - question: "A diagram of a falling parachutist shows air resistance pointing upward and gravity pointing downward. What does the illustration show?"
    choices:
      - "Both forces act upward."
      - "Both forces act downward."
      - "Gravity and air resistance act in opposite directions."
      - "Gravity disappears when the parachute opens."
    answer: "Gravity and air resistance act in opposite directions."
    topic: "Forces & Motion"
    explanation: "The upward arrow shows air resistance, and the downward arrow shows gravity. The forces point in opposite directions."
  - question: "Toy cars A and B travel along the same track. A reaches the finish before B. Which statement is correct?"
    choices:
      - "Car B has a greater average speed."
      - "Their average speeds must be equal."
      - "Their colors decide their speeds."
      - "Car A has a greater average speed."
    answer: "Car A has a greater average speed."
    topic: "Forces & Motion"
    explanation: "Both cover the same distance, but A takes less time. This means A travels faster on average."
  - question: "A bicycle keeps a steady speed. The rider continues cycling instead of stopping. What happens to the total distance traveled?"
    choices:
      - "It keeps increasing."
      - "It becomes smaller."
      - "It stays the same."
      - "It disappears."
    answer: "It keeps increasing."
    topic: "Forces & Motion"
    explanation: "As the bicycle keeps moving, it covers more of its path. At a steady speed, moving for longer means traveling farther."
  - question: "A toy train takes longer than before to travel the same track. What does this tell us about its average speed?"
    choices:
      - "Its average speed is higher."
      - "Its average speed is lower."
      - "Its average speed must be unchanged."
      - "The track must be shorter."
    answer: "Its average speed is lower."
    topic: "Forces & Motion"
    explanation: "Taking longer to cover the same distance means the train is moving more slowly on average."
  - question: "Which statement best describes speed?"
    choices:
      - "It tells how heavy an object is."
      - "It tells the temperature of an object."
      - "It tells how quickly an object covers distance."
      - "It tells the color of an object."
    answer: "It tells how quickly an object covers distance."
    topic: "Forces & Motion"
    explanation: "Speed compares how far an object moves with how long the movement takes. It describes motion, not mass, temperature, or color."
  - question: "A seedling has enough light and water, but its soil has too few minerals. It grows poorly. Which change would best help?"
    choices:
      - "Keep the plant in darkness."
      - "Remove all its leaves."
      - "Replace water with cooking oil."
      - "Supply appropriate mineral nutrients."
    answer: "Supply appropriate mineral nutrients."
    topic: "Plants & Growth"
    explanation: "Light and water are already available, but minerals are missing. Supplying suitable mineral nutrients addresses that shortage."
  - question: "A gardener waters a plant's roots, and later its leaves receive the water. Which explanation best connects the plant parts?"
    choices:
      - "Roots absorb water, and xylem carries it through the stem to leaves."
      - "Flowers absorb water, and petals carry it downward."
      - "Leaves create water that moves into dry soil."
      - "Phloem carries only sunlight to the roots."
    answer: "Roots absorb water, and xylem carries it through the stem to leaves."
    topic: "Plants & Growth"
    explanation: "Roots take up water from soil, and xylem carries it through the stem to the leaves. These parts work together."
  - question: "Sugar made in a leaf reaches a growing fruit. Which tissue carries the sugar, and why does the fruit need it?"
    choices:
      - "Xylem; making sunlight"
      - "Phloem; growth and energy needs"
      - "Stomata; attracting gravity"
      - "Root hairs; removing all minerals"
    answer: "Phloem; growth and energy needs"
    topic: "Plants & Growth"
    explanation: "Phloem carries leaf-made sugar to the fruit. The fruit uses sugar for energy and to build new parts as it grows."
  - question: "Two similar plants receive equal light and mineral nutrients. Only one is watered regularly, and it grows better. Which conclusion is best supported?"
    choices:
      - "Minerals never affect plants."
      - "Plants grow best without light."
      - "Water availability can affect plant growth."
      - "The watered plant has no need for roots."
    answer: "Water availability can affect plant growth."
    topic: "Plants & Growth"
    explanation: "The plants have similar light and minerals, but different water supplies. Better growth in the watered plant supports the importance of water."
  - question: "Leaves lose water through stomata on a hot day. Why can roots help the plant avoid wilting?"
    choices:
      - "They stop sunlight from reaching leaves."
      - "They turn flowers into leaves."
      - "They remove all water from the stem."
      - "They absorb replacement water from the soil."
    answer: "They absorb replacement water from the soil."
    topic: "Plants & Growth"
    explanation: "Roots can replace water lost from leaves by absorbing more from moist soil. This helps keep plant cells firm."
  - question: "A whale lives in water but breathes air and feeds milk to its young. Which animal group fits these clues?"
    choices:
      - "Mammal, because it feeds its young with milk"
      - "Fish, because it swims"
      - "Bird, because it breathes air"
      - "Reptile, because it is large"
    answer: "Mammal, because it feeds its young with milk"
    topic: "Animals & Life Cycles"
    explanation: "Feeding milk to young is a mammal trait. Living in water does not make a whale a fish."
  - question: "A bat and an eagle both fly, but only the bat feeds milk to its young. Why should they not be placed in the same animal class?"
    choices:
      - "All flying animals are birds."
      - "Flying alone does not decide their group; body traits and how they raise young also matter."
      - "Any animal with wings is a reptile."
      - "Living in the same place determines animal class."
    answer: "Flying alone does not decide their group; body traits and how they raise young also matter."
    topic: "Animals & Life Cycles"
    explanation: "Flight is a shared ability, not an animal class. The bat is a mammal, while the feathered eagle is a bird."
  - question: "A learner finds an egg, a caterpillar, and a chrysalis on a plant. Which observation would complete the butterfly life cycle?"
    choices:
      - "A tadpole leaves the egg."
      - "A chrysalis becomes a caterpillar again."
      - "An adult butterfly emerges from the chrysalis."
      - "The caterpillar lays eggs without changing."
    answer: "An adult butterfly emerges from the chrysalis."
    topic: "Animals & Life Cycles"
    explanation: "The adult butterfly emerging from a chrysalis completes the egg, larva, pupa, and adult sequence."
  - question: "A frog starts as a tadpole with gills and later develops lungs and legs. What does this show?"
    choices:
      - "It changes from a fish into a mammal."
      - "It belongs to a different species each day."
      - "All reptiles begin as tadpoles."
      - "Its body changes as it passes through life-cycle stages."
    answer: "Its body changes as it passes through life-cycle stages."
    topic: "Animals & Life Cycles"
    explanation: "The tadpole and adult frog are stages of the same animal. Its body changes to suit different needs as it grows."
  - question: "A bee obtains nectar while carrying pollen between flowers. Why is this an example of mutualism?"
    choices:
      - "Both organisms benefit from the interaction."
      - "Only the bee benefits while the flower is harmed."
      - "The flower hunts and eats the bee."
      - "Neither organism receives a benefit."
    answer: "Both organisms benefit from the interaction."
    topic: "Ecosystems & Relationships"
    explanation: "The bee gets nectar for food, and the flower receives help moving pollen. Both benefit, which makes the relationship mutualism."
  - question: "A tick feeds on a dog and irritates its skin. Why is this different from an orchid growing harmlessly on a tree?"
    choices:
      - "Both interactions must be mutualism."
      - "The tick harms the dog, but the orchid does not harm the tree."
      - "Both organisms benefit equally in each interaction."
      - "The dog and tree are both predators."
    answer: "The tick harms the dog, but the orchid does not harm the tree."
    topic: "Ecosystems & Relationships"
    explanation: "The tick benefits while harming the dog, so it is a parasite. In this example, the orchid benefits without harming the tree."
  - question: "A harmless fly looks like a stinging wasp, while a moth matches tree bark. Which comparison is correct?"
    choices:
      - "Both show migration."
      - "The fly shows camouflage, and the moth shows parasitism."
      - "The fly shows mimicry, and the moth shows camouflage."
      - "Both show hibernation."
    answer: "The fly shows mimicry, and the moth shows camouflage."
    topic: "Ecosystems & Relationships"
    explanation: "The fly looks like another animal, which is mimicry. The moth matches its background, which is camouflage."
  - question: "Study the chain: Grass → Rabbit → Fox. Which explanation correctly follows energy transfer?"
    choices:
      - "Foxes give food energy directly to grass."
      - "Rabbits receive all energy directly from sunlight."
      - "The arrows show which animal is physically largest."
      - "Energy in grass passes to rabbits and then to foxes through feeding."
    answer: "Energy in grass passes to rabbits and then to foxes through feeding."
    topic: "Ecosystems & Relationships"
    explanation: "The rabbit eats the grass, and the fox eats the rabbit. Food carries energy along the chain in that order."
  - question: "If owls that hunt mice become fewer and other conditions stay similar, what may happen to the mice at first?"
    choices:
      - "Their numbers may increase because fewer are eaten."
      - "They immediately stop needing food."
      - "They become producers."
      - "Their numbers must fall because owls make their food."
    answer: "Their numbers may increase because fewer are eaten."
    topic: "Ecosystems & Relationships"
    explanation: "With fewer owls hunting them, more mice may survive at first. Food, disease, and other predators can also affect their numbers."
  - question: "Two plants grow close together in a small pot with limited water and minerals. Which explanation best describes their interaction?"
    choices:
      - "They are predators hunting each other."
      - "They may compete for the same limited resources."
      - "They necessarily benefit equally from the shortage."
      - "They no longer need sunlight."
    answer: "They may compete for the same limited resources."
    topic: "Ecosystems & Relationships"
    explanation: "The plants share a limited supply of water and minerals. Each plant's use leaves less available for the other."
  - question: "If kidneys fail to remove enough waste from the blood, what is the most direct result?"
    choices:
      - "The lungs make more urine."
      - "Food stops entering the mouth."
      - "Waste may build up in the bloodstream."
      - "The bones replace the nephrons."
    answer: "Waste may build up in the bloodstream."
    topic: "Kidneys & Digestion"
    explanation: "Kidneys normally remove wastes from blood. If they cannot do this well, those wastes can build up in the body."
  - question: "A healthy nephron filters water and small substances, then returns much of the useful material to blood. Why is the second step important?"
    choices:
      - "It makes all filtered material leave in urine."
      - "It turns waste into red blood cells."
      - "It prevents any filtering from occurring."
      - "It saves water and nutrients the body still needs."
    answer: "It saves water and nutrients the body still needs."
    topic: "Kidneys & Digestion"
    explanation: "Filtering lets useful substances enter the nephron along with wastes. Reabsorption returns much of the useful water and nutrients to blood."
  - question: "If the large intestine absorbs less water from undigested material, which result is most likely?"
    choices:
      - "More water remains in the material leaving as stool."
      - "All food is absorbed through the lungs."
      - "Urine must contain undigested food."
      - "The stomach no longer holds food."
    answer: "More water remains in the material leaving as stool."
    topic: "Kidneys & Digestion"
    explanation: "Less water is taken back into the body, so more remains in the stool. This can make it watery."
  - question: "A child gets enough calcium but very little vitamin D. Why might the child's body still have trouble using the calcium for strong bones?"
    choices:
      - "Vitamin D replaces the need for all minerals."
      - "Vitamin D helps the intestine absorb calcium."
      - "Calcium prevents all vitamin absorption."
      - "Bones use only vitamin C."
    answer: "Vitamin D helps the intestine absorb calcium."
    topic: "Vitamins & Minerals"
    explanation: "Calcium must be absorbed before the body can use it. Vitamin D helps this absorption, so enough calcium alone may not be enough."
  - question: "Two lunches contain beans. One also has guava. Why might the body absorb more iron from the lunch with guava?"
    choices:
      - "Guava turns iron into iodine."
      - "Fruit removes all minerals from beans."
      - "Vitamin C in guava helps the body absorb iron from beans."
      - "Iron can be absorbed only from meat."
    answer: "Vitamin C in guava helps the body absorb iron from beans."
    topic: "Vitamins & Minerals"
    explanation: "Guava's vitamin C helps the body take in the kind of iron found in beans. The fruit supports absorption rather than creating iron."
  - question: "A poster says every food has exactly the same vitamins and minerals. Which fact shows that the poster is wrong?"
    choices:
      - "All foods have the same color."
      - "Only sweet foods contain minerals."
      - "Water contains every vitamin in equal amounts."
      - "Different foods contain different amounts and kinds of nutrients."
    answer: "Different foods contain different amounts and kinds of nutrients."
    topic: "Vitamins & Minerals"
    explanation: "Foods do not all have the same nutrients. For example, carrots supply beta-carotene, while milk is a common calcium source."
  - question: "A muscle cell has many mitochondria and needs much usable energy. Which explanation best links the two facts?"
    choices:
      - "Mitochondria help release usable energy for the cell's work."
      - "Mitochondria make the cell nonliving."
      - "Mitochondria store only sunlight."
      - "Mitochondria prevent all chemical reactions."
    answer: "Mitochondria help release usable energy for the cell's work."
    topic: "Cells & Energy"
    explanation: "Muscles need energy to do work. Many mitochondria help supply ATP, the usable energy needed for tasks such as movement."
  - question: "A cell has nutrients and oxygen, but many of its mitochondria are damaged. Which change is most likely?"
    choices:
      - "The cell will produce unlimited ATP."
      - "The cell may make less ATP, its usable energy supply."
      - "The nucleus will become a leaf."
      - "The cell will no longer contain water."
    answer: "The cell may make less ATP, its usable energy supply."
    topic: "Cells & Energy"
    explanation: "Damaged mitochondria may not make ATP as effectively. Having oxygen and food does not fix damage to the structures using them."
  - question: "An ice cube floats in liquid water. Which explanation best accounts for this?"
    choices:
      - "Ice is denser than liquid water."
      - "Every floating object must contain a large air bubble."
      - "Ordinary ice is less dense than liquid water."
      - "Freezing removes all oxygen atoms from water."
    answer: "Ordinary ice is less dense than liquid water."
    topic: "Matter & Materials"
    explanation: "The crystal pattern in ice spreads water molecules farther apart. Ice is therefore less dense than liquid water and can float on it."
  - question: "An aquarium pump moves but is nonliving. A plant stays in one place but is living. Which fact explains why?"
    choices:
      - "Anything that moves must be living."
      - "Anything that stays still must be nonliving."
      - "Plastic parts can reproduce because they vibrate."
      - "The plant carries out life processes; movement alone does not identify life."
    answer: "The plant carries out life processes; movement alone does not identify life."
    topic: "Matter & Materials"
    explanation: "The plant grows and carries out life processes. The pump moves because it is powered, so movement alone is not proof of life."
  - question: "Warm water rises and cooler water sinks in a pot heated from below. Which explanation correctly identifies the heat transfer?"
    choices:
      - "Convection transfers heat as water moves."
      - "Radiation requires water to touch the Sun."
      - "Conduction is the movement of the whole liquid."
      - "Refraction makes water circulate."
    answer: "Convection transfers heat as water moves."
    topic: "Matter & Materials"
    explanation: "Moving water carries heat around the pot. Heat transfer by the movement of a liquid or gas is convection."
  - question: "A worker spends hours near loud machinery. Which action best reduces hearing risk?"
    choices:
      - "Move closer to the machine."
      - "Spend less time near the noise and use proper hearing protection."
      - "Turn up headphones to cover the noise."
      - "Ignore the noise if it is familiar."
    answer: "Spend less time near the noise and use proper hearing protection."
    topic: "Light & Sound"
    explanation: "Hearing risk depends on sound level and how long it lasts. Less time near the noise and proper protection both help reduce exposure."
  - question: "A pencil looks bent in water but appears straight when removed. Which explanation best fits the evidence?"
    choices:
      - "Water permanently breaks the pencil."
      - "The eyes produce light that bends the wood."
      - "Light changes direction at the boundary between water and air."
      - "The pencil becomes a light source underwater."
    answer: "Light changes direction at the boundary between water and air."
    topic: "Light & Sound"
    explanation: "The pencil stays straight. Light bends as it passes between water and air, making the underwater part appear shifted."
  - question: "A town faces the Sun at one time and faces away several hours later. Which explanation best accounts for the change?"
    choices:
      - "Earth completes a revolution every few hours."
      - "The Sun circles the town each hour."
      - "The Moon blocks sunlight every night."
      - "Earth's rotation moves the town between daylight and darkness."
    answer: "Earth's rotation moves the town between daylight and darkness."
    topic: "Earth, Weather & Space"
    explanation: "Earth spins on its axis. That turns the town toward the Sun and later away from it, causing day and night."
  - question: "A class sees clouds and rain near the ground. Why do these usually happen in the troposphere?"
    choices:
      - "It is the lowest atmospheric layer and contains most weather."
      - "It is the only layer beyond the Moon."
      - "It contains all of Earth's solid rocks."
      - "It has no water vapor."
    answer: "It is the lowest atmospheric layer and contains most weather."
    topic: "Earth, Weather & Space"
    explanation: "The troposphere is near the ground and holds most of the air's water vapor. This is where most clouds and rain form."
  - question: "Mineral A scratches Mineral B, but B does not scratch A. Which conclusion is best supported?"
    choices:
      - "Mineral B is harder than Mineral A."
      - "Mineral A is harder than Mineral B."
      - "Both minerals must have the same color."
      - "Mineral A must be heavier than Mineral B."
    answer: "Mineral A is harder than Mineral B."
    topic: "Minerals & Hardness"
    explanation: "A harder mineral can scratch a softer one. The test supports A being harder, but does not tell us their weights or colors."
  - question: "Car A travels farther than Car B during the same amount of time. Which comparison is correct?"
    choices:
      - "Car B has a greater average speed."
      - "Both speeds must be equal."
      - "Car A has a greater average speed."
      - "Neither car is moving."
    answer: "Car A has a greater average speed."
    topic: "Forces & Motion"
    explanation: "Covering more distance in the same time means moving faster on average."
  - question: "A pupil says a large toy car must always be faster than a small one. Which test best checks this idea?"
    choices:
      - "Compare only their colors."
      - "Compare only their sizes."
      - "Choose the car with the louder sound."
      - "Race them along the same track and compare when they finish."
    answer: "Race them along the same track and compare when they finish."
    topic: "Forces & Motion"
    explanation: "Size alone does not show speed. Using the same track lets us compare how quickly each car covers the same distance."
  - question: "A sound meter shows a higher reading in Room B than in Room A. Which conclusion is supported?"
    choices:
      - "Room B has a higher sound level."
      - "Sound must travel faster in Room B."
      - "Room A has no sound at all."
      - "Room B must be safe for unlimited listening."
    answer: "Room B has a higher sound level."
    topic: "Light & Sound"
    explanation: "A sound meter compares sound levels. A higher reading does not prove a higher sound speed or guarantee safe listening."
  - question: "A book cannot be seen in a completely dark room, but becomes visible when a lamp is switched on. What does this show?"
    choices:
      - "The book begins producing its own light permanently."
      - "The book reflects light from the lamp toward the eyes."
      - "The eyes create enough light only when a lamp is off."
      - "The book is transparent because it can be seen."
    answer: "The book reflects light from the lamp toward the eyes."
    topic: "Light & Sound"
    explanation: "The lamp gives light to the book, which reflects some into the eyes. Without light reaching the eyes, the book cannot be seen."
  - question: "A cup of hot water has a thick cover made of an insulating material. Why does the cover help the water cool more slowly?"
    choices:
      - "It creates unlimited new heat inside the water."
      - "It prevents every possible heat-transfer mechanism forever."
      - "It slows heat moving from the water to the surroundings."
      - "It raises the boiling point to that of cooking oil."
    answer: "It slows heat moving from the water to the surroundings."
    topic: "Matter & Materials"
    explanation: "An insulating cover slows heat passing from the hot water to the cooler surroundings. It does not make new heat."
  - question: "As water boils, bubbles of water vapor form inside the liquid. What does this show?"
    choices:
      - "Liquid water is changing into ice."
      - "Water is turning into salt."
      - "All the bubbles are solid water."
      - "Liquid water is changing into gas."
    answer: "Liquid water is changing into gas."
    topic: "Matter & Materials"
    explanation: "Boiling changes liquid water into water vapor. The bubbles carry this gas through the liquid."
  - question: "The thyroid gland needs iodine to make hormones. Which change can add iodine to meals without using more salt?"
    choices:
      - "Use iodized salt instead of non-iodized salt."
      - "Replace vegetables with white sugar."
      - "Remove all fish and other iodine sources."
      - "Add only more vitamin C to rice."
    answer: "Use iodized salt instead of non-iodized salt."
    topic: "Vitamins & Minerals"
    explanation: "Switching the same amount of non-iodized salt to iodized salt adds iodine without adding more salt. The iodine supports thyroid hormone production."
  - question: "A class uses a globe and lamp to model day and night. Which action best represents the change at one marked town over a day?"
    choices:
      - "Move the lamp around the globe once every second."
      - "Spin the globe on its axis while keeping the lamp in place."
      - "Paint the town black without moving the globe."
      - "Move the globe around the lamp without letting it spin."
    answer: "Spin the globe on its axis while keeping the lamp in place."
    topic: "Earth, Weather & Space"
    explanation: "Spinning the globe moves the marked town into and out of the lamp's light. This models Earth's rotation and the day-and-night cycle."
  - question: "Two minerals have the same color. One scratches quartz and the other is scratched by calcite. What does this show?"
    choices:
      - "Minerals of the same color must have the same hardness."
      - "The softer mineral must be larger."
      - "Color alone is not enough to determine their hardness."
      - "The harder mineral must be heavier."
    answer: "Color alone is not enough to determine their hardness."
    topic: "Minerals & Hardness"
    explanation: "Scratch tests compare hardness more directly than color does. Two minerals can look alike yet resist scratching very differently."
  - question: "In a food web, grass is eaten by rabbits and grasshoppers, and both are eaten by different predators. Why is a web more useful than a single chain for this example?"
    choices:
      - "It proves every animal eats only one food."
      - "It shows only the physical sizes of organisms."
      - "It removes the need for producers."
      - "It shows multiple connected pathways for energy transfer."
    answer: "It shows multiple connected pathways for energy transfer."
    topic: "Ecosystems & Relationships"
    explanation: "Several animals eat grass, and each can feed other animals. A web shows these connected routes that one chain would leave out."
clincher:
  - question: "Two groups of similar seedlings get the same water and minerals. Group A gets light; Group B stays in the dark. Group A grows better. Which new test would best check if light caused this?"
    choices:
      - "Repeat with new seedlings, changing only how much light they get."
      - "Give Group A more water and more minerals."
      - "Use different kinds of plants and different soils."
      - "Compare a watered plant with a dry rock."
    answer: "Repeat with new seedlings, changing only how much light they get."
    topic: "Plants & Growth"
    explanation: "A fair test changes only one factor. Keeping water, minerals, and plant type similar helps reveal the effect of changing light."
  - question: "A plant's xylem is blocked, but its phloem still works. The soil is wet and the day is sunny. What will most likely happen first?"
    choices:
      - "Leaves receive more water because phloem becomes xylem."
      - "Leaves may wilt because water delivery is reduced."
      - "Sugar production must increase without water."
      - "Roots can no longer contact the soil."
    answer: "Leaves may wilt because water delivery is reduced."
    topic: "Plants & Growth"
    explanation: "Xylem carries water to leaves. Blocking it can make leaves lose water faster than they receive it, even when the soil is wet."
  - question: "A ring of phloem is removed from a stem, but most xylem is left uncut. Which result shows the different jobs of these tissues?"
    choices:
      - "Neither water nor sugar can move through any tissue."
      - "Roots receive more sugar because xylem transports it."
      - "Water still reaches leaves, but less leaf-made sugar reaches roots below the ring."
      - "Leaves stop receiving sunlight immediately."
    answer: "Water still reaches leaves, but less leaf-made sugar reaches roots below the ring."
    topic: "Plants & Growth"
    explanation: "Xylem can still carry water upward, but the cut phloem cannot carry as much leaf-made sugar to roots below the ring."
  - question: "A class says extra minerals made seedlings grow faster. But those seedlings also got more light. What is the best conclusion?"
    choices:
      - "The minerals are definitely the only cause."
      - "Light cannot influence growth when minerals are present."
      - "Neither water nor soil needs to be controlled."
      - "We cannot tell if minerals caused the change because the light also changed."
    answer: "We cannot tell if minerals caused the change because the light also changed."
    topic: "Plants & Growth"
    explanation: "Both light and minerals changed, and either can affect growth. A test that changes only minerals would better show their effect."
  - question: "A spray kills many caterpillars. Several weeks later, fewer adult butterflies appear. What best explains this change?"
    choices:
      - "Fewer larvae survive to become pupae and then adults."
      - "Adults must change back into caterpillars."
      - "Pupae create eggs without adults."
      - "Butterflies begin life as unrelated flying animals."
    answer: "Fewer larvae survive to become pupae and then adults."
    topic: "Animals & Life Cycles"
    explanation: "Caterpillars must survive to become pupae and then adult butterflies. Killing many caterpillars can reduce the number reaching later stages."
  - question: "An animal has feathers and lays eggs, but cannot fly. A learner says it is a reptile because it cannot fly. Which answer corrects the mistake?"
    choices:
      - "Egg laying alone proves it is a reptile."
      - "Feathers identify it as a bird; flight is not required for that class."
      - "An animal that cannot fly must be a mammal."
      - "Habitat always determines animal class."
    answer: "Feathers identify it as a bird; flight is not required for that class."
    topic: "Animals & Life Cycles"
    explanation: "Feathers are a defining bird trait. Birds such as penguins cannot fly, so lack of flight does not make an animal a reptile."
  - question: "A dolphin and a shark have similar body shapes. Only the dolphin has lungs and feeds milk to its young. What do these clues tell us about their animal groups?"
    choices:
      - "All animals with this swimming shape are mammals."
      - "The shark must produce milk because it swims."
      - "Animals can have similar shapes for swimming but belong to different groups."
      - "Body size alone is a better clue than having lungs."
    answer: "Animals can have similar shapes for swimming but belong to different groups."
    topic: "Animals & Life Cycles"
    explanation: "Similar shapes help both animals swim, but milk production identifies the dolphin as a mammal. A shark belongs to the fish group."
  - question: "Study the chain: Grass → Grasshopper → Frog → Hawk. A disease kills many frogs. If other conditions stay the same, which change is most likely soon after?"
    choices:
      - "Grasshoppers must decrease, and hawks gain more food."
      - "Grass produces less sunlight for hawks."
      - "Hawks begin receiving energy directly from grass."
      - "Grasshoppers may increase, and hawks may have less food."
    answer: "Grasshoppers may increase, and hawks may have less food."
    topic: "Ecosystems & Relationships"
    explanation: "Fewer frogs may eat fewer grasshoppers, allowing more to survive. Hawks also lose some of their frog food."
  - question: "In Web A, a fox eats only rabbits. In Web B, a fox eats rabbits and mice. Rabbit numbers drop in both webs, but there are still many mice. Which fox has a better chance of finding food?"
    choices:
      - "The fox in Web B can still eat mice."
      - "The fox in Web A no longer needs energy."
      - "Both foxes must be affected in exactly the same way."
      - "Food webs stop every change in animal numbers."
    answer: "The fox in Web B can still eat mice."
    topic: "Ecosystems & Relationships"
    explanation: "The fox in Web B can switch to mice when rabbits become scarce. The fox in Web A has no other food source shown."
  - question: "A predator disappears. More plant-eating animals survive, and fewer young plants remain. What best connects these changes?"
    choices:
      - "The predator had been producing sunlight for plants."
      - "Fewer animals are hunted, so more survive and eat the young plants."
      - "More plant-eating animals always cause more plant growth."
      - "Plants are now hunting the animals."
    answer: "Fewer animals are hunted, so more survive and eat the young plants."
    topic: "Ecosystems & Relationships"
    explanation: "The predator had limited the plant-eating animals. When more survive, they can eat more young plants, reducing plant numbers."
  - question: "A green insect hides well on leaves but stands out on brown bark. Predators avoid a harmless fly that looks like a wasp, even on plain surfaces. Which explanation fits both?"
    choices:
      - "Both effects require hibernation."
      - "The fly uses camouflage only, while the insect uses parasitism."
      - "The insect benefits from camouflage; the fly benefits from mimicry."
      - "Both organisms make their own food from sunlight."
    answer: "The insect benefits from camouflage; the fly benefits from mimicry."
    topic: "Ecosystems & Relationships"
    explanation: "The green insect matches its background, so it uses camouflage. The fly resembles a feared animal, so it uses mimicry."
  - question: "Bees get nectar and pollinate flowers. Ticks take blood and harm deer. Orchids grow on trees without changing the trees' health. Which sequence correctly classifies the three relationships?"
    choices:
      - "Commensalism → Mutualism → Parasitism"
      - "Parasitism → Competition → Mutualism"
      - "Competition → Commensalism → Parasitism"
      - "Mutualism → Parasitism → Commensalism"
    answer: "Mutualism → Parasitism → Commensalism"
    topic: "Ecosystems & Relationships"
    explanation: "Bees and flowers both benefit: mutualism. Ticks benefit and harm deer: parasitism. Orchids benefit while trees are unaffected: commensalism."
  - question: "Two kinds of birds fight over too few nesting holes. Adding more safe holes reduces fighting, while the food supply stays the same. What does this show?"
    choices:
      - "Nesting sites were a resource involved in competition."
      - "Both species were necessarily parasites."
      - "Food was proven to be the only limiting resource."
      - "The birds no longer need a habitat."
    answer: "Nesting sites were a resource involved in competition."
    topic: "Ecosystems & Relationships"
    explanation: "Only the number of nesting holes changed, and fighting decreased. This supports nesting space being a resource the birds were competing for."
  - question: "A nephron filters blood normally, but its tiny tubes return too little water to the blood. What is most likely to happen?"
    choices:
      - "No fluid enters the nephron at all."
      - "More water is lost in urine, so the body may lose too much water."
      - "The bladder begins digesting food."
      - "All waste stays in blood because filtering has stopped."
    answer: "More water is lost in urine, so the body may lose too much water."
    topic: "Kidneys & Digestion"
    explanation: "Filtering still occurs, but too little water is returned to blood. More of that water leaves in urine instead of being kept by the body."
  - question: "A damaged kidney filter lets large proteins pass from blood into urine. Which job is the filter failing to do?"
    choices:
      - "Moving food through the esophagus"
      - "Reflecting light into the eyes"
      - "Keeping large useful proteins in the blood during filtering"
      - "Carrying urine out of the bladder"
    answer: "Keeping large useful proteins in the blood during filtering"
    topic: "Kidneys & Digestion"
    explanation: "Healthy kidney filters keep blood cells and most large proteins in blood. Large proteins entering urine can show damage to that barrier."
  - question: "A hiker has lost too much water. The kidneys return more water to the blood but still remove waste. How will the urine most likely change?"
    choices:
      - "More urine, with less waste in each amount of liquid"
      - "Urine made entirely of undigested food"
      - "No waste removal because all filtering stops"
      - "Less urine, with more waste in each amount of liquid"
    answer: "Less urine, with more waste in each amount of liquid"
    topic: "Kidneys & Digestion"
    explanation: "Returning more water to blood leaves less water for urine. Waste is carried in a smaller amount of liquid, so the urine is more concentrated."
  - question: "A nephron still filters the same amount of fluid, but returns less water to the blood. How will the water leaving in urine change?"
    choices:
      - "More water will leave in urine."
      - "Less water will leave in urine."
      - "The water leaving must stay the same."
      - "Urine will turn into blood."
    answer: "More water will leave in urine."
    topic: "Kidneys & Digestion"
    explanation: "If less filtered water is taken back, more remains to leave as urine. Reabsorption helps the body keep needed water."
  - question: "Kidneys return water from filtered fluid to the blood. The large intestine absorbs water from undigested food. How are these jobs alike and different?"
    choices:
      - "Both filter the same blood through nephrons."
      - "Both save water for the body, but they take it from different materials."
      - "Both make urine directly from food in the intestine."
      - "Neither helps keep the right amount of water in the body."
    answer: "Both save water for the body, but they take it from different materials."
    topic: "Kidneys & Digestion"
    explanation: "Both jobs help save water, but kidneys act on fluid filtered from blood while the large intestine acts on material left after digestion."
  - question: "Meal A has beans and rice. Meal B has the same amounts plus guava. Why might the body absorb more iron from Meal B?"
    choices:
      - "Guava converts all calcium into iron."
      - "Rice prevents all nutrient absorption."
      - "Guava's vitamin C helps the body absorb iron from the beans."
      - "Adding fruit changes iron into a vitamin."
    answer: "Guava's vitamin C helps the body absorb iron from the beans."
    topic: "Vitamins & Minerals"
    explanation: "The amount of beans is unchanged, but guava adds vitamin C. Vitamin C helps absorb the iron in plant foods such as beans."
  - question: "Two meals have the same amount of calcium, but only one has a good vitamin D source. Why might that meal help the body use calcium better?"
    choices:
      - "Vitamin D is a mineral that replaces calcium."
      - "All calcium is absorbed equally regardless of vitamin D status."
      - "Bones require vitamins but no minerals."
      - "Vitamin D helps the body absorb calcium, so both nutrients matter."
    answer: "Vitamin D helps the body absorb calcium, so both nutrients matter."
    topic: "Vitamins & Minerals"
    explanation: "The meals have equal calcium, but vitamin D helps the intestine absorb it. Nutrients can work together rather than acting alone."
  - question: "A child has trouble seeing in dim light, and wounds heal slowly. Which answer explains nutrient roles without assuming we know the cause?"
    choices:
      - "Vitamin A helps vision; vitamin C and zinc help repair. A health worker should check the cause."
      - "Both signs prove the child needs only iodine."
      - "Eating carrots will surely make every problem disappear."
      - "Every vitamin has exactly the same job."
    answer: "Vitamin A helps vision; vitamin C and zinc help repair. A health worker should check the cause."
    topic: "Vitamins & Minerals"
    explanation: "These nutrients support different jobs, but the symptoms do not prove a single cause. A health worker should assess the child rather than guessing."
  - question: "A food label lists iron, iodine, calcium, and zinc. A learner says this proves the food has all needed vitamins. What is wrong with this idea?"
    choices:
      - "Every mineral automatically contains all vitamins."
      - "Those are minerals; their presence does not establish vitamin content."
      - "Iodine is another name for vitamin A."
      - "Only the color of the food determines its vitamins."
    answer: "Those are minerals; their presence does not establish vitamin content."
    topic: "Vitamins & Minerals"
    explanation: "Iron, iodine, calcium, and zinc are minerals, not vitamins. Listing them gives no proof that all essential vitamins are also present."
  - question: "A learner says the body always absorbs all the calcium in a meal. Which fact shows why this is wrong?"
    choices:
      - "The body absorbs no calcium from food."
      - "Calcium is made only by sunlight."
      - "The body absorbs only part of the calcium eaten."
      - "Calcium and vitamin D are the same nutrient."
    answer: "The body absorbs only part of the calcium eaten."
    topic: "Vitamins & Minerals"
    explanation: "Not every part of a meal is absorbed. Calcium absorption can depend on the food source, vitamin D, and the body's needs."
  - question: "Two cells get the same nutrients and oxygen. Cell A has healthy mitochondria; Cell B has damaged mitochondria. Which result shows the mitochondria's job?"
    choices:
      - "Cell B becomes a plant because it has less ATP."
      - "Cell A stops all chemical reactions."
      - "Both cells must produce identical ATP amounts."
      - "Cell A makes more ATP, the energy supply cells use, than Cell B."
    answer: "Cell A makes more ATP, the energy supply cells use, than Cell B."
    topic: "Cells & Energy"
    explanation: "Mitochondria help make ATP using nutrients and oxygen. More ATP from the healthy cell supports their role in supplying usable energy."
  - question: "A leaf makes sugar in its chloroplasts. A growing root uses that sugar for energy. Which sequence shows how the sugar is made, moved, and used?"
    choices:
      - "Photosynthesis makes sugar → phloem carries it → cellular respiration releases energy."
      - "Cellular respiration makes sunlight → xylem carries it → roots reflect it."
      - "Chloroplasts filter blood → roots absorb ATP from sunlight."
      - "Photosynthesis and cellular respiration do exactly the same job."
    answer: "Photosynthesis makes sugar → phloem carries it → cellular respiration releases energy."
    topic: "Cells & Energy"
    explanation: "Chloroplasts make sugar through photosynthesis. Phloem carries it to roots, where cellular respiration releases energy the root cells can use."
  - question: "A learner says only animals carry out cellular respiration because plants make food through photosynthesis. Which fact corrects this idea?"
    choices:
      - "Roots receive sunlight through every soil particle."
      - "Plant cells also need usable energy and carry out cellular respiration."
      - "Plants obtain all their ATP by reflecting light."
      - "Leaves become nonliving whenever it is dark."
    answer: "Plant cells also need usable energy and carry out cellular respiration."
    topic: "Cells & Energy"
    explanation: "Making food and releasing its energy are different jobs. Plants carry out cellular respiration too, including in roots and during darkness."
  - question: "A hard bottle is filled to the top with water, sealed, and put in a freezer. Why can it crack even though no water was added?"
    choices:
      - "Freezing creates new oxygen atoms and adds more water."
      - "All water turns into compressed air."
      - "When water freezes, its molecules form a crystal pattern with more space between them."
      - "Ice takes up exactly the same space as the original water."
    answer: "When water freezes, its molecules form a crystal pattern with more space between them."
    topic: "Matter & Materials"
    explanation: "Freezing makes water molecules form a more open pattern, taking up extra space. In a full hard bottle, that expansion can crack the container."
  - question: "A pond freezes first at the surface while liquid water remains below. Which property of ordinary ice helps explain why the ice stays on top?"
    choices:
      - "It is denser than liquid water and must sink."
      - "It has no mass after freezing."
      - "It is made of a different chemical element."
      - "Its molecules are spaced farther apart, making it less dense than liquid water."
    answer: "Its molecules are spaced farther apart, making it less dense than liquid water."
    topic: "Matter & Materials"
    explanation: "Ice has less mass packed into the same space than liquid water. Its lower density lets the ice stay on top rather than sink."
  - question: "A flask keeps drinks warm using shiny walls and a gap with almost no air. How do the shiny walls and the gap slow different kinds of heat transfer?"
    choices:
      - "The gap slows conduction and convection; shiny walls reduce heat transfer by radiation."
      - "The empty gap stops radiation but improves convection."
      - "Shiny walls create heat, and the gap increases conduction."
      - "All three kinds of heat transfer need moving air in the gap."
    answer: "The gap slows conduction and convection; shiny walls reduce heat transfer by radiation."
    topic: "Matter & Materials"
    explanation: "The nearly empty gap has little matter for conduction or convection. Shiny walls also reduce energy transfer by thermal radiation."
  - question: "Sunlight travels through space and warms a pot. Warm water then moves around inside the pot. Which two types of heat transfer are shown?"
    choices:
      - "Conduction and radiation"
      - "Radiation and convection"
      - "Convection and conduction"
      - "Refraction and reflection"
    answer: "Radiation and convection"
    topic: "Matter & Materials"
    explanation: "Radiation can carry energy across space. Inside the pot, moving warm water carries heat by convection."
  - question: "Two cups have the same shape and equally hot water. One is metal; one is foam. The metal cup's outside warms faster. What does this show about the materials?"
    choices:
      - "Foam completely prevents every heat-transfer mechanism."
      - "Metal must produce its own heat."
      - "Metal conducts heat more readily than foam."
      - "The cups must contain different kinds of water."
    answer: "Metal conducts heat more readily than foam."
    topic: "Matter & Materials"
    explanation: "Metal passes heat through more easily than foam, so its outside warms faster. Foam slows transfer but does not stop all heat loss."
  - question: "Two samples of pure water boil at different temperatures, one at sea level and one on a high mountain. What is the strongest explanation?"
    choices:
      - "The mountain sample must have become cooking oil."
      - "Pure water always boils at the same temperature at any pressure."
      - "Boiling changes water into a mineral."
      - "Air pressure affects boiling temperature, and it is lower on a high mountain."
    answer: "Air pressure affects boiling temperature, and it is lower on a high mountain."
    topic: "Matter & Materials"
    explanation: "Air pressure affects when water boils. Lower air pressure on a high mountain lets water boil at a lower temperature than at sea level."
  - question: "An aquarium pump moves and uses electricity. A seed stays still but sprouts when it gets enough water, air, and warmth. Which fact helps us decide what is living?"
    choices:
      - "Moving is not enough to show life; the seed can grow into a plant."
      - "Electricity makes the pump a living organism."
      - "The still seed must be nonliving until it moves like an animal."
      - "Both objects belong to the same animal class."
    answer: "Moving is not enough to show life; the seed can grow into a plant."
    topic: "Matter & Materials"
    explanation: "A seed can grow and carry out life processes. A powered pump can move without being alive, so movement is not enough to decide."
  - question: "When seen from above, a fish looks closer to the water's surface than it really is. How does the path of light explain this?"
    choices:
      - "The fish produces light that pulls it toward the surface."
      - "Refraction changes the direction of light as it passes from water into air."
      - "Reflection always makes light travel without changing direction."
      - "Water physically shortens the fish's distance to the bottom."
    answer: "Refraction changes the direction of light as it passes from water into air."
    topic: "Light & Sound"
    explanation: "Light bends when it passes from water to air. The eyes trace the arriving light back in a straight line, making the fish appear nearer the surface."
  - question: "A mirror in a dark box is invisible until a lamp shines into the box. Which conclusion uses both observations?"
    choices:
      - "The mirror is a luminous source only when nobody sees it."
      - "The eyes send all necessary light into the dark box."
      - "Light must reach the mirror before it can reflect toward the eyes."
      - "Shiny objects always make their own light."
    answer: "Light must reach the mirror before it can reflect toward the eyes."
    topic: "Light & Sound"
    explanation: "The lamp supplies light that the mirror reflects into the eyes. The mirror cannot reflect useful visible light when none reaches it."
  - question: "A loud drum has a higher sound-level reading than a quiet whistle. A pupil says the drum must also have a higher pitch. What is the best correction?"
    choices:
      - "A louder sound always has a higher pitch."
      - "Only whistles have a pitch."
      - "Drums cannot produce sound waves."
      - "Sound level and pitch are different properties."
    answer: "Sound level and pitch are different properties."
    topic: "Light & Sound"
    explanation: "Sound level describes how strong a sound is. Pitch depends mainly on vibration frequency, so a loud drum can have a low pitch."
  - question: "A child hears equally loud noise for a short time in one place and a much longer time in another. What matters when comparing hearing risk?"
    choices:
      - "Both how loud the noise is and how long it lasts."
      - "Only the name of the place."
      - "Only whether the child likes the sound."
      - "Longer listening always makes loud noise safer."
    answer: "Both how loud the noise is and how long it lasts."
    topic: "Light & Sound"
    explanation: "Longer exposure to the same loud sound can increase hearing risk. Both sound level and listening time matter."
  - question: "A car moves quickly, slows in traffic, and waits at a crossing. Which statement best describes its average speed for the whole trip?"
    choices:
      - "It is always the fastest speed reached."
      - "It reflects the whole trip, including the waiting time."
      - "It ignores all slow parts of the trip."
      - "It depends only on the car's size."
    answer: "It reflects the whole trip, including the waiting time."
    topic: "Forces & Motion"
    explanation: "Average speed describes the whole journey. Slow travel and stops take time too, so the fastest part alone does not describe the trip."
  - question: "Cyclists take the same route at the same riding speed. One rests along the way; the other does not. How does the rest affect the whole-trip average speed?"
    choices:
      - "The cyclist who rests has a higher average speed."
      - "Resting cannot affect the whole-trip average."
      - "The cyclist who rests has a lower average speed."
      - "Both average speeds must equal their fastest speed."
    answer: "The cyclist who rests has a lower average speed."
    topic: "Forces & Motion"
    explanation: "The rest adds time without adding distance. The same route therefore takes longer for the resting cyclist."
  - question: "Car A completes a route without stopping. Car B travels at the same moving speed but stops for a long time. Why is Car A's whole-trip average speed higher?"
    choices:
      - "Car A must have traveled a shorter route."
      - "Car B's waiting time does not count."
      - "Their moving speeds prove their whole-trip averages are equal."
      - "Car A finishes the same route in less total time."
    answer: "Car A finishes the same route in less total time."
    topic: "Forces & Motion"
    explanation: "Stops affect the time for the whole journey. Even with equal moving speeds, the car that waits takes longer over the same route."
  - question: "A person falling with a parachute slows down just after opening it. Which explanation correctly describes the forces?"
    choices:
      - "Air resistance increases while gravity still acts downward."
      - "Gravity disappears as soon as the parachute opens."
      - "Both forces suddenly act downward and speed up the fall."
      - "The parachute replaces gravity with magnetism."
    answer: "Air resistance increases while gravity still acts downward."
    topic: "Forces & Motion"
    explanation: "Opening the parachute increases upward air resistance. Gravity still acts downward; the increased resistance makes the fall slow down."
  - question: "It is summer north of the Equator and winter south of it at the same time. Why does this show that being closer to the Sun is not the main cause of seasons?"
    choices:
      - "One hemisphere has stopped rotating."
      - "Both halves are about equally far from the Sun, but Earth's tilt gives them different sunlight and day lengths."
      - "The Sun becomes cold only on its southern side."
      - "The Moon removes all southern sunlight during winter."
    answer: "Both halves are about equally far from the Sun, but Earth's tilt gives them different sunlight and day lengths."
    topic: "Earth, Weather & Space"
    explanation: "Earth's distance from the Sun is nearly the same for both halves. Tilt, not that shared distance, explains their opposite seasons."
  - question: "A city near the Equator has little change in hours of daylight. A city far north has long summer days and short winter days. What explains both?"
    choices:
      - "The equatorial city has no rotation."
      - "The far-northern city completes extra revolutions each year."
      - "Earth's tilt changes day length more in places farther from the Equator."
      - "The Sun is always directly overhead at both cities."
    answer: "Earth's tilt changes day length more in places farther from the Equator."
    topic: "Earth, Weather & Space"
    explanation: "Earth's tilt changes sunlight and day length more far from the Equator. Near the Equator, day length changes much less through the year."
  - question: "A model Earth has no tilt. It still spins and moves around the Sun at a steady distance. Which pattern would still happen?"
    choices:
      - "Strong opposite seasons caused by tilt"
      - "Earth stops spinning once a year"
      - "Daylight everywhere all the time"
      - "Day and night as Earth spins"
    answer: "Day and night as Earth spins"
    topic: "Earth, Weather & Space"
    explanation: "Rotation still turns places into and out of sunlight. Without tilt, strong opposite seasons caused by tilt would disappear, but day and night remain."
  - question: "A space probe lists planets from nearest to farthest from the Sun: Mercury, Venus, Earth, Jupiter, Mars, Saturn. Which change fixes the order?"
    choices:
      - "Swap Jupiter and Mars."
      - "Swap Mercury and Venus."
      - "Swap Earth and Saturn."
      - "Swap Venus and Mars."
    answer: "Swap Jupiter and Mars."
    topic: "Earth, Weather & Space"
    explanation: "Mars is fourth from the Sun, and Jupiter is fifth. Swapping those two restores Mercury, Venus, Earth, Mars, Jupiter, Saturn."
  - question: "A planet has a reddish, rocky surface and lies between Earth and Jupiter. Which planet fits these clues?"
    choices:
      - "Venus"
      - "Mars"
      - "Saturn"
      - "Mercury"
    answer: "Mars"
    topic: "Earth, Weather & Space"
    explanation: "Mars has a reddish surface and is located beyond Earth but closer to the Sun than Jupiter."
  - question: "A balloon rises out of the layer where most weather happens and enters the next layer. Which layers has it moved between?"
    choices:
      - "Stratosphere to troposphere"
      - "Mesosphere to thermosphere"
      - "Troposphere to stratosphere"
      - "Thermosphere to exosphere"
    answer: "Troposphere to stratosphere"
    topic: "Earth, Weather & Space"
    explanation: "The troposphere is the lowest layer, where most weather occurs. The stratosphere is the next layer above it."
  - question: "Mineral A scratches B. B scratches C, but C cannot scratch B. If the tests were done correctly, what is their order of hardness?"
    choices:
      - "C is harder than B, and B is harder than A."
      - "All three must have identical hardness."
      - "Hardness can be ranked only from color."
      - "A is harder than B, and B is harder than C."
    answer: "A is harder than B, and B is harder than C."
    topic: "Minerals & Hardness"
    explanation: "A scratches B, so A is harder than B. B scratches C, so B is harder than C. The order is A, then B, then C."
  - question: "A mineral scratches calcite but is scratched by quartz. What do these tests tell us?"
    choices:
      - "It is harder than calcite but softer than quartz."
      - "It is softer than both minerals."
      - "It is harder than both minerals."
      - "It must have the same color as quartz."
    answer: "It is harder than calcite but softer than quartz."
    topic: "Minerals & Hardness"
    explanation: "The mineral can scratch the softer reference, but the harder reference scratches it. The tests place its hardness between the two."
  - question: "A train moves slowly on its outward trip and quickly on its return. A pupil calls the return speed its whole-trip average. Why is this wrong?"
    choices:
      - "The fastest part always decides the average."
      - "The average must describe both parts of the journey."
      - "The slower trip does not count as motion."
      - "Direction alone decides average speed."
    answer: "The average must describe both parts of the journey."
    topic: "Forces & Motion"
    explanation: "The whole-trip average includes travel in both directions. Using only the fast return leaves out the slower outward journey."
