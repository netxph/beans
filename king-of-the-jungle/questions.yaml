easy:
  - question: "Which sense organ is used for hearing sounds in our environment?"
    choices:
      - "Eyes"
      - "Ears"
      - "Nose"
      - "Tongue"
    answer: "Ears"
    topic: "Living Things"
    explanation: "Ears are the sense organs responsible for detecting and hearing sounds."
  - question: "Which sense organ helps us see colors, shapes, and sizes of objects?"
    choices:
      - "Eyes"
      - "Ears"
      - "Skin"
      - "Nose"
    answer: "Eyes"
    topic: "Living Things"
    explanation: "Eyes are the sense organs of sight that allow us to observe our surroundings."
  - question: "Which sense organ allows us to smell sweet flowers and perfume?"
    choices:
      - "Nose"
      - "Tongue"
      - "Skin"
      - "Ears"
    answer: "Nose"
    topic: "Living Things"
    explanation: "The nose contains olfactory receptors that detect scents and odors."
  - question: "Which sense organ covers our whole body and helps us feel heat, cold, and pain?"
    choices:
      - "Skin"
      - "Tongue"
      - "Eyes"
      - "Nose"
    answer: "Skin"
    topic: "Living Things"
    explanation: "Skin is the largest sense organ and provides the sense of touch."
  - question: "Which organ in our head controls our thoughts, memories, and body movements?"
    choices:
      - "Brain"
      - "Lungs"
      - "Stomach"
      - "Heart"
    answer: "Brain"
    topic: "Living Things"
    explanation: "The brain is the control center of the nervous system and the entire body."
  - question: "Which group of foods gives our body energy to run, jump, and play all day?"
    choices:
      - "Go foods"
      - "Grow foods"
      - "Glow foods"
      - "Junk foods"
    answer: "Go foods"
    topic: "Living Things"
    explanation: "Go foods are rich in carbohydrates and fats, providing energy for active movement."
  - question: "Which group of foods is rich in protein and helps build strong muscles and bones?"
    choices:
      - "Grow foods"
      - "Go foods"
      - "Glow foods"
      - "Sweet foods"
    answer: "Grow foods"
    topic: "Living Things"
    explanation: "Grow foods provide proteins essential for growth, tissue repair, and muscle building."
  - question: "Which group of foods is rich in vitamins and minerals that keep our skin glowing and prevent illness?"
    choices:
      - "Glow foods"
      - "Go foods"
      - "Grow foods"
      - "Fast foods"
    answer: "Glow foods"
    topic: "Living Things"
    explanation: "Glow foods like fruits and vegetables supply vitamins and minerals that protect against illness."
  - question: "What type of body covering protects fish as they swim in water?"
    choices:
      - "Scales"
      - "Feathers"
      - "Fur"
      - "Shell"
    answer: "Scales"
    topic: "Living Things"
    explanation: "Most fish have smooth, overlapping scales that protect their bodies in water."
  - question: "What do we call animals that eat only plants for food?"
    choices:
      - "Herbivores"
      - "Carnivores"
      - "Omnivores"
      - "Predators"
    answer: "Herbivores"
    topic: "Living Things"
    explanation: "Herbivores are animals that feed exclusively on plants, leaves, and fruits."
  - question: "What is the young, worm-like feeding stage of a butterfly called?"
    choices:
      - "Caterpillar"
      - "Pupa"
      - "Chrysalis"
      - "Adult"
    answer: "Caterpillar"
    topic: "Living Things"
    explanation: "The caterpillar is the larval stage of a butterfly that feeds heavily on leaves."
  - question: "What is the young swimming stage of a frog called when it hatches from an egg?"
    choices:
      - "Tadpole"
      - "Pupa"
      - "Caterpillar"
      - "Toadlet"
    answer: "Tadpole"
    topic: "Living Things"
    explanation: "A tadpole hatches from a frog egg, has a tail, and breathes through gills in water."
  - question: "Which plant part absorbs water and nutrients from the soil and anchors the plant firmly?"
    choices:
      - "Roots"
      - "Leaves"
      - "Flowers"
      - "Fruits"
    answer: "Roots"
    topic: "Living Things"
    explanation: "Roots hold the plant in the soil and absorb water and minerals needed for growth."
  - question: "Which part of a plant is often colorful and attracts insects for pollination?"
    choices:
      - "Flower"
      - "Root"
      - "Stem"
      - "Seed"
    answer: "Flower"
    topic: "Living Things"
    explanation: "Flowers often have brightly colored petals that attract bees and butterflies."
  - question: "What natural source provides light and warmth that plants need to make their food?"
    choices:
      - "Sunlight"
      - "Moonlight"
      - "Wind"
      - "Soil"
    answer: "Sunlight"
    topic: "Living Things"
    explanation: "Sunlight provides the light energy plants capture during photosynthesis."
  - question: "Which state of matter has a definite shape and a definite volume?"
    choices:
      - "Solid"
      - "Liquid"
      - "Gas"
      - "Plasma"
    answer: "Solid"
    topic: "Matter"
    explanation: "Solids maintain a fixed shape and volume because their particles are tightly packed."
  - question: "What state of matter takes the shape of its container but has a fixed volume?"
    choices:
      - "Liquid"
      - "Solid"
      - "Gas"
      - "Air"
    answer: "Liquid"
    topic: "Matter"
    explanation: "Liquids have a definite volume but flow to take the shape of whatever holds them."
  - question: "Which state of matter spreads out freely to fill all available space in a closed container?"
    choices:
      - "Gas"
      - "Solid"
      - "Liquid"
      - "Ice"
    answer: "Gas"
    topic: "Matter"
    explanation: "Gases have no fixed shape or volume and spread out to fill their container completely."
  - question: "Which of the following is an example of a solid object?"
    choices:
      - "Wooden block"
      - "Milk"
      - "Water vapor"
      - "Orange juice"
    answer: "Wooden block"
    topic: "Matter"
    explanation: "A wooden block has a definite shape and volume, which are characteristics of a solid."
  - question: "What state of matter is the helium gas used to fill floating party balloons?"
    choices:
      - "Gas"
      - "Liquid"
      - "Solid"
      - "Powder"
    answer: "Gas"
    topic: "Matter"
    explanation: "Helium is a light gas that expands to fill the interior of a balloon."
  - question: "Which word describes how the surface of sandpaper feels when you touch it?"
    choices:
      - "Rough"
      - "Smooth"
      - "Wet"
      - "Sticky"
    answer: "Rough"
    topic: "Matter"
    explanation: "Sandpaper has a coarse, rough texture caused by tiny abrasive particles."
  - question: "Which material allows almost all light to pass through so you can see clearly through it?"
    choices:
      - "Clear glass"
      - "Wooden board"
      - "Cardboard box"
      - "Iron plate"
    answer: "Clear glass"
    topic: "Matter"
    explanation: "Clear glass is transparent, allowing light to travel through without scattering."
  - question: "What happens to a heavy iron anchor when it is dropped into deep water?"
    choices:
      - "It sinks to the bottom"
      - "It floats on the surface"
      - "It dissolves completely"
      - "It turns into gas"
    answer: "It sinks to the bottom"
    topic: "Matter"
    explanation: "An iron anchor is denser than water and sinks straight to the bottom."
  - question: "What property describes an object that stays on top of water instead of going down?"
    choices:
      - "Floating"
      - "Sinking"
      - "Melting"
      - "Freezing"
    answer: "Floating"
    topic: "Matter"
    explanation: "Floating is the ability of an object to rest on or near the surface of a liquid."
  - question: "Which material is opaque, meaning light cannot pass through it at all?"
    choices:
      - "Thick metal sheet"
      - "Clear plastic wrap"
      - "Window glass"
      - "Clean water"
    answer: "Thick metal sheet"
    topic: "Matter"
    explanation: "A thick metal sheet blocks light completely, casting a dark shadow."
  - question: "Which sense helps us tell whether an apple is red or green?"
    choices:
      - "Sight"
      - "Hearing"
      - "Taste"
      - "Smell"
    answer: "Sight"
    topic: "Matter"
    explanation: "The eyes detect color through the sense of sight."
  - question: "What is a basic force that moves an object away from you?"
    choices:
      - "Push"
      - "Pull"
      - "Friction"
      - "Gravity"
    answer: "Push"
    topic: "Force, Motion, and Energy"
    explanation: "A push is an applied force directed away from the person or object exerting it."
  - question: "What type of force are you using when you bring a wagon closer to yourself?"
    choices:
      - "Pull"
      - "Push"
      - "Bounce"
      - "Twist"
    answer: "Pull"
    topic: "Force, Motion, and Energy"
    explanation: "A pull is a force that brings an object closer to the source of the force."
  - question: "What can a push or a pull do to a moving toy car?"
    choices:
      - "Change its speed or direction"
      - "Change its color"
      - "Make it disappear"
      - "Turn it into water"
    answer: "Change its speed or direction"
    topic: "Force, Motion, and Energy"
    explanation: "Applying a force to a moving object can speed it up, slow it down, or change its direction."
  - question: "What do we call the change in position of an object over time?"
    choices:
      - "Motion"
      - "Rest"
      - "Weight"
      - "Volume"
    answer: "Motion"
    topic: "Force, Motion, and Energy"
    explanation: "Motion occurs whenever an object moves from one position to another."
  - question: "What must you apply to a resting soccer ball to make it roll across the grass?"
    choices:
      - "A force"
      - "A sound"
      - "A shadow"
      - "A mirror"
    answer: "A force"
    topic: "Force, Motion, and Energy"
    explanation: "An object at rest requires a force, such as a kick (push), to start moving."
  - question: "What is the primary natural source of heat and light for the entire Earth?"
    choices:
      - "The Sun"
      - "The Moon"
      - "Campfires"
      - "Electric lamps"
    answer: "The Sun"
    topic: "Force, Motion, and Energy"
    explanation: "The Sun is Earth's main natural source of radiant light and thermal energy."
  - question: "In what path does light travel through empty space or clear air?"
    choices:
      - "In straight lines"
      - "In wavy circles"
      - "In zigzag loops"
      - "In curved spirals"
    answer: "In straight lines"
    topic: "Force, Motion, and Energy"
    explanation: "Light rays travel in straight lines until they hit a surface or pass into a different medium."
  - question: "What form of energy travels through the air as vibrations that we hear with our ears?"
    choices:
      - "Sound"
      - "Magnetism"
      - "Electricity"
      - "Light"
    answer: "Sound"
    topic: "Force, Motion, and Energy"
    explanation: "Sound is produced by vibrating objects and travels as waves through air, liquids, or solids."
  - question: "What happens when light hits a clean, shiny glass mirror?"
    choices:
      - "It bounces off"
      - "It gets absorbed completely"
      - "It turns into sound"
      - "It stops forever"
    answer: "It bounces off"
    topic: "Force, Motion, and Energy"
    explanation: "Light reflects (bounces off) smooth, shiny surfaces like mirrors."
  - question: "Which form of energy makes water in a kettle boil and turn into steam?"
    choices:
      - "Heat"
      - "Sound"
      - "Wind"
      - "Magnetism"
    answer: "Heat"
    topic: "Force, Motion, and Energy"
    explanation: "Thermal energy (heat) raises water's temperature until it boils."
  - question: "Which instrument produces sound when you strike its stretched surface with a stick?"
    choices:
      - "Drum"
      - "Flashlight"
      - "Mirror"
      - "Thermometer"
    answer: "Drum"
    topic: "Force, Motion, and Energy"
    explanation: "Hitting a drum head makes it vibrate, creating audible sound waves."
  - question: "What dark area forms on the ground when an opaque object blocks rays of light?"
    choices:
      - "A shadow"
      - "A rainbow"
      - "A puddle"
      - "A flame"
    answer: "A shadow"
    topic: "Force, Motion, and Energy"
    explanation: "A shadow is created on a surface when light is blocked by an opaque object."
  - question: "What landform is very high and rocky with steep slopes and a pointed peak?"
    choices:
      - "Mountain"
      - "Plain"
      - "Valley"
      - "Beach"
    answer: "Mountain"
    topic: "Earth and Space"
    explanation: "A mountain is a high, steep landform that rises significantly above surrounding land."
  - question: "What type of landform is wide, flat, and ideal for growing crops like rice and corn?"
    choices:
      - "Plain"
      - "Mountain"
      - "Volcano"
      - "Canyon"
    answer: "Plain"
    topic: "Earth and Space"
    explanation: "Plains are broad, flat land areas well-suited for farming and settlements."
  - question: "What do we call the low land situated between hills or mountains?"
    choices:
      - "Valley"
      - "Plateau"
      - "Volcano"
      - "Island"
    answer: "Valley"
    topic: "Earth and Space"
    explanation: "A valley is a low area of land between hills or mountains, often containing a river."
  - question: "Which of the following is the largest body of salt water on Earth?"
    choices:
      - "Ocean"
      - "River"
      - "Pond"
      - "Creek"
    answer: "Ocean"
    topic: "Earth and Space"
    explanation: "Oceans are vast bodies of salt water covering more than 70% of Earth's surface."
  - question: "What is a large body of fresh water surrounded completely by land?"
    choices:
      - "Lake"
      - "Ocean"
      - "Sea"
      - "Waterfall"
    answer: "Lake"
    topic: "Earth and Space"
    explanation: "A lake is a still body of water completely surrounded by land."
  - question: "What weather condition occurs when dark clouds gather and water drops fall from the sky?"
    choices:
      - "Rainy"
      - "Sunny"
      - "Windy"
      - "Foggy"
    answer: "Rainy"
    topic: "Earth and Space"
    explanation: "Rainy weather features falling precipitation from saturated clouds."
  - question: "Which weather instrument is used to show the direction from which the wind is blowing?"
    choices:
      - "Wind vane"
      - "Rain gauge"
      - "Thermometer"
      - "Barometer"
    answer: "Wind vane"
    topic: "Earth and Space"
    explanation: "A wind vane rotates to point in the direction the wind is coming from."
  - question: "Which instrument collects and measures the amount of liquid precipitation that has fallen?"
    choices:
      - "Rain gauge"
      - "Wind vane"
      - "Ruler"
      - "Compass"
    answer: "Rain gauge"
    topic: "Earth and Space"
    explanation: "A rain gauge is an open container calibrated to measure rainfall depth."
  - question: "Which instrument is used to measure how hot or cold the air is during the day?"
    choices:
      - "Thermometer"
      - "Wind vane"
      - "Rain gauge"
      - "Anemometer"
    answer: "Thermometer"
    topic: "Earth and Space"
    explanation: "A thermometer measures temperature in degrees Celsius or Fahrenheit."
  - question: "What is the name of the planet where humans, animals, and plants live?"
    choices:
      - "Earth"
      - "Mars"
      - "Venus"
      - "Jupiter"
    answer: "Earth"
    topic: "Earth and Space"
    explanation: "Earth is the third planet from the Sun and the only known planet that supports life."
  - question: "Why does the Moon shine brightly in the night sky?"
    choices:
      - "It reflects light from the Sun"
      - "It produces its own light like a lamp"
      - "It is covered with glowing fire"
      - "It absorbs light from streetlights"
    answer: "It reflects light from the Sun"
    topic: "Earth and Space"
    explanation: "The Moon does not generate its own light; it reflects sunlight toward Earth."
  - question: "What are the tiny points of light that twinkle in the night sky and are actually huge, hot balls of gas?"
    choices:
      - "Stars"
      - "Comets"
      - "Clouds"
      - "Airplanes"
    answer: "Stars"
    topic: "Earth and Space"
    explanation: "Stars are distant spheres of hot, glowing gas that emit their own light."
average:
  - question: "Which pair of spongy internal organs in our chest expands when we inhale oxygen?"
    choices:
      - "Lungs"
      - "Kidneys"
      - "Intestines"
      - "Stomach"
    answer: "Lungs"
    topic: "Living Things"
    explanation: "The lungs take in oxygen during inhalation and release carbon dioxide during exhalation."
  - question: "What part of the tongue contains specialized receptors that detect sweet, salty, sour, and bitter tastes?"
    choices:
      - "Taste buds"
      - "Saliva glands"
      - "Teeth"
      - "Lips"
    answer: "Taste buds"
    topic: "Living Things"
    explanation: "Taste buds are sensory structures on the tongue that send taste signals to the brain."
  - question: "Which hard internal framework protects vital organs like the brain, heart, and lungs from injury?"
    choices:
      - "Skeletal system"
      - "Muscular system"
      - "Digestive system"
      - "Skin layers"
    answer: "Skeletal system"
    topic: "Living Things"
    explanation: "Bones such as the skull and rib cage protect delicate internal organs from trauma."
  - question: "Which basic hygiene habit is most effective at removing germs and preventing communicable diseases before eating?"
    choices:
      - "Washing hands with soap and water"
      - "Rinsing hands with water only"
      - "Wiping hands on clean clothes"
      - "Applying hand lotion"
    answer: "Washing hands with soap and water"
    topic: "Living Things"
    explanation: "Handwashing with soap breaks down oils and dirt that carry disease-causing germs."
  - question: "Which internal organ acts like a muscular pump that continuously pushes blood through our blood vessels?"
    choices:
      - "Heart"
      - "Lungs"
      - "Brain"
      - "Liver"
    answer: "Heart"
    topic: "Living Things"
    explanation: "The heart pumps oxygenated and deoxygenated blood throughout the circulatory system."
  - question: "Which breakfast food item belongs to the 'Grow foods' group because it helps repair body tissues?"
    choices:
      - "Boiled egg"
      - "Steamed white rice"
      - "Ripe banana"
      - "Sliced cucumber"
    answer: "Boiled egg"
    topic: "Living Things"
    explanation: "Eggs are high in protein, placing them firmly in the Grow foods category."
  - question: "Cassava, bread, and sweet potatoes all supply long-lasting energy. Which food group do they belong to?"
    choices:
      - "Go foods"
      - "Grow foods"
      - "Glow foods"
      - "Junk foods"
    answer: "Go foods"
    topic: "Living Things"
    explanation: "Cassava, bread, and tubers provide carbohydrates, categorizing them as Go foods."
  - question: "Spinach, carrots, and oranges help keep our eyes bright and immune system strong. Which food category are they in?"
    choices:
      - "Glow foods"
      - "Go foods"
      - "Grow foods"
      - "Sweet foods"
    answer: "Glow foods"
    topic: "Living Things"
    explanation: "Fruits and leafy vegetables contain vitamins and minerals, classifying them as Glow foods."
  - question: "What is the third stage in the complete life cycle of a butterfly, where it rests inside a chrysalis?"
    choices:
      - "Pupa"
      - "Egg"
      - "Larva"
      - "Adult"
    answer: "Pupa"
    topic: "Living Things"
    explanation: "The butterfly life cycle sequence is egg, larva (caterpillar), pupa (chrysalis), and adult."
  - question: "What body part do adult frogs use to breathe when they are swimming underwater?"
    choices:
      - "Moist skin"
      - "Gills"
      - "Lungs"
      - "Flippers"
    answer: "Moist skin"
    topic: "Living Things"
    explanation: "Adult frogs can absorb dissolved oxygen directly through their thin, moist skin while underwater."
  - question: "A brown bear eats berries and honey, but also catches salmon and small rodents. How is the bear classified by diet?"
    choices:
      - "Omnivore"
      - "Herbivore"
      - "Carnivore"
      - "Decomposer"
    answer: "Omnivore"
    topic: "Living Things"
    explanation: "Omnivores consume both plant matter and animal meat."
  - question: "Birds have hollow bones and a specialized body covering that keeps them warm and aids in flight. What is this covering?"
    choices:
      - "Feathers"
      - "Fur"
      - "Scales"
      - "Dry skin"
    answer: "Feathers"
    topic: "Living Things"
    explanation: "Feathers provide aerodynamic lift for flying and thermal insulation to keep birds warm."
  - question: "Which animal group has dry scaly skin, lays eggs on land, and includes snakes, lizards, and turtles?"
    choices:
      - "Reptiles"
      - "Amphibians"
      - "Mammals"
      - "Fish"
    answer: "Reptiles"
    topic: "Living Things"
    explanation: "Reptiles are cold-blooded vertebrates characterized by dry, scaly skin and shelled eggs laid on land."
  - question: "Which part of a plant acts as the 'food factory' by capturing sunlight and carbon dioxide to make sugar?"
    choices:
      - "Leaves"
      - "Roots"
      - "Stems"
      - "Bark"
    answer: "Leaves"
    topic: "Living Things"
    explanation: "Leaves contain green chlorophyll that absorbs sunlight to perform photosynthesis."
  - question: "What is the primary function of a plant's stem in helping the leaves and flowers grow?"
    choices:
      - "Transporting water and nutrients upward"
      - "Producing pollen and nectar"
      - "Absorbing sunlight beneath the soil"
      - "Creating seeds for reproduction"
    answer: "Transporting water and nutrients upward"
    topic: "Living Things"
    explanation: "The stem supports leaves and branches and carries fluids between the roots and leaves."
  - question: "If a healthy green potted plant is placed inside a dark closet and given water daily for two weeks, what will happen to its leaves?"
    choices:
      - "They will turn pale yellow and weaken"
      - "They will turn darker green and grow faster"
      - "They will produce sweet fruit"
      - "They will develop colorful flowers"
    answer: "They will turn pale yellow and weaken"
    topic: "Living Things"
    explanation: "Without sunlight, plants cannot produce chlorophyll or food, causing leaves to turn pale and wither."
  - question: "An ice cube left on a kitchen counter absorbs heat and gradually turns into liquid water. What is this process called?"
    choices:
      - "Melting"
      - "Freezing"
      - "Evaporation"
      - "Condensation"
    answer: "Melting"
    topic: "Matter"
    explanation: "Melting occurs when a solid gains heat energy and changes into a liquid."
  - question: "When liquid water in an ice tray is placed into a freezer, it turns into solid ice cubes. What is this change called?"
    choices:
      - "Freezing"
      - "Boiling"
      - "Melting"
      - "Dissolving"
    answer: "Freezing"
    topic: "Matter"
    explanation: "Freezing is the physical phase change where a liquid loses heat and solidifies."
  - question: "Which property correctly differentiates a cup of milk from a metal coin?"
    choices:
      - "Milk flows and changes shape, while the coin keeps its shape"
      - "The coin has no definite volume"
      - "Milk has a fixed shape"
      - "Both have no definite shape"
    answer: "Milk flows and changes shape, while the coin keeps its shape"
    topic: "Matter"
    explanation: "Milk is a liquid that flows to fit its container, whereas a coin is a rigid solid."
  - question: "Why does air pumped into a bicycle tire inflate it evenly in all directions?"
    choices:
      - "Gas particles spread out and push against all inner walls"
      - "Gas particles sink to the bottom like pebbles"
      - "Gas particles freeze into a ring"
      - "Gas particles attach only to the valve"
    answer: "Gas particles spread out and push against all inner walls"
    topic: "Matter"
    explanation: "Gas particles move freely at high speeds, exerting pressure uniformly on the tire walls."
  - question: "Which of the following describes a gas at room temperature?"
    choices:
      - "It has no fixed shape and no fixed volume"
      - "It has a fixed shape and fixed volume"
      - "It has a fixed volume but changes shape"
      - "It cannot be compressed into a smaller space"
    answer: "It has no fixed shape and no fixed volume"
    topic: "Matter"
    explanation: "Gases lack both a definite shape and a definite volume, expanding to fill any space."
  - question: "A plastic toy duck rests on the surface of bathwater while a metal key sinks. Why does the duck stay on top?"
    choices:
      - "The plastic duck is less dense than water"
      - "The bathwater pulls the key upward"
      - "Plastic is always heavier than metal"
      - "The key contains trapped air bubbles"
    answer: "The plastic duck is less dense than water"
    topic: "Matter"
    explanation: "Objects float if their overall density is less than the density of the surrounding liquid."
  - question: "Frosted bathroom window glass lets some light in, but you cannot see distinct shapes through it. How is this glass classified?"
    choices:
      - "Translucent"
      - "Transparent"
      - "Opaque"
      - "Reflective"
    answer: "Translucent"
    topic: "Matter"
    explanation: "Translucent materials allow some light to pass through, but scatter it so objects cannot be clearly seen."
  - question: "A solid steel ball and a hollow rubber ball of the same size are held in each hand. What property makes the steel ball feel much heavier?"
    choices:
      - "Mass"
      - "Color"
      - "Transparency"
      - "Texture"
    answer: "Mass"
    topic: "Matter"
    explanation: "The steel ball contains much more matter (mass), resulting in a greater gravitational pull (weight)."
  - question: "When a teaspoon of white sugar is stirred thoroughly into warm water, the white granules disappear. What happened to the sugar?"
    choices:
      - "It dissolved into the water"
      - "It melted into a gas"
      - "It sank and turned into stone"
      - "It evaporated into the air"
    answer: "It dissolved into the water"
    topic: "Matter"
    explanation: "Sugar dissolves in water to form a clear liquid solution."
