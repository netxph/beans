clincher:
  - question: "Water starts as ice, melts, and then evaporates. What is the correct order of states?"
    choices:
      - "Solid, liquid, gas"
      - "Gas, solid, liquid"
      - "Liquid, gas, solid"
      - "Solid, gas, liquid"
    answer: "Solid, liquid, gas"
    topic: "Matter"
    explanation: "Melting changes solid ice to liquid water, and evaporation changes liquid water to gas."
  - question: "Water vapor forms droplets on a cold lid, and those droplets later freeze. Which two changes occurred in order?"
    choices:
      - "Condensation, then freezing"
      - "Melting, then evaporation"
      - "Freezing, then melting"
      - "Evaporation, then condensation"
    answer: "Condensation, then freezing"
    topic: "Matter"
    explanation: "Gas becomes liquid by condensation; liquid then becomes solid by freezing."
  - question: "Ice melts in one dish while water freezes in another. How do the two changes compare?"
    choices:
      - "They go in opposite directions between solid and liquid"
      - "Both change gas into liquid"
      - "Both change solid into gas"
      - "Both remove all matter"
    answer: "They go in opposite directions between solid and liquid"
    topic: "Matter"
    explanation: "Melting is solid to liquid, while freezing is liquid to solid."
  - question: "A student says an empty-looking closed bottle has no matter because nothing is visible. Which is the best reply?"
    choices:
      - "It contains air, which has mass and takes up space"
      - "Only visible objects are matter"
      - "All matter must be solid"
      - "Air is light energy"
    answer: "It contains air, which has mass and takes up space"
    topic: "Matter"
    explanation: "Matter need not be visible; air inside the bottle has mass and occupies space."
  - question: "A stone, water, and air are put in separate containers. Which comparison is correct?"
    choices:
      - "The stone keeps its shape, water fits its container, and air fills its container"
      - "All three keep a fixed shape"
      - "Water and air are not matter"
      - "The stone and air are liquids"
    answer: "The stone keeps its shape, water fits its container, and air fills its container"
    topic: "Matter"
    explanation: "Solids keep their shape, liquids take the container's shape, and gases fill available space."
  - question: "A cold glass forms outside droplets while a wet cloth dries nearby. Which processes explain the observations?"
    choices:
      - "Condensation on the glass and evaporation from the cloth"
      - "Melting on the glass and freezing in the cloth"
      - "Freezing on both objects"
      - "Evaporation on the glass and condensation in the cloth"
    answer: "Condensation on the glass and evaporation from the cloth"
    topic: "Matter"
    explanation: "Vapor condenses on the cold glass, while liquid water evaporates from the cloth."
  - question: "A student sorts air with light because both can be hard to see. Why should air be moved to the matter group?"
    choices:
      - "Air has mass and occupies space, while light is energy"
      - "Air is always visible"
      - "Light has a fixed solid shape"
      - "Anything invisible must be a gas"
    answer: "Air has mass and occupies space, while light is energy"
    topic: "Matter"
    explanation: "Mass and occupied space define matter, not visibility; light is energy."
  - question: "A cup of water is poured into a bowl and then frozen. Which sequence is correct?"
    choices:
      - "The liquid first changes shape, then changes into a solid"
      - "It becomes gas as soon as it is poured"
      - "It stays liquid after freezing"
      - "It stops occupying space when frozen"
    answer: "The liquid first changes shape, then changes into a solid"
    topic: "Matter"
    explanation: "Pouring changes a liquid's shape; freezing then changes its state to solid."
  - question: "A puddle dries, but droplets appear on the outside of a nearby cold bottle. Which statement is best?"
    choices:
      - "Water can change between liquid and gas in both directions"
      - "Water is being created from nothing"
      - "All droplets come through the bottle wall"
      - "Both observations show freezing"
    answer: "Water can change between liquid and gas in both directions"
    topic: "Matter"
    explanation: "Evaporation changes liquid to gas, while condensation changes gas to liquid."
  - question: "Three jars contain a pencil, milk, and air. Which jar has matter with no fixed shape or volume of its own?"
    choices:
      - "The jar containing air"
      - "Only the jar containing the pencil"
      - "Only the jar containing milk"
      - "None of the jars"
    answer: "The jar containing air"
    topic: "Matter"
    explanation: "Air is a gas, so it has neither a fixed shape nor a fixed volume of its own."
  - question: "A ball is pushed, caught, and squeezed. Which three effects of force are shown?"
    choices:
      - "Starting motion, stopping motion, changing shape"
      - "Growing, breathing, reproducing"
      - "Melting, freezing, evaporating"
      - "Changing color, taste, and smell"
    answer: "Starting motion, stopping motion, changing shape"
    topic: "Force, Motion, and Energy"
    explanation: "Pushes and pulls can move an object, stop it, or change its shape."
  - question: "A cart is pushed away while a wagon is drawn toward a child. How should the forces be described?"
    choices:
      - "A push on the cart and a pull on the wagon"
      - "A pull on both"
      - "A push on both"
      - "No force on either"
    answer: "A push on the cart and a pull on the wagon"
    topic: "Force, Motion, and Energy"
    explanation: "A push acts away from the person, and a pull draws an object toward the person."
  - question: "A rolling ball is pushed from the side, then stopped by a hand. Which changes happened in order?"
    choices:
      - "Direction changed, then motion stopped"
      - "Color changed, then the ball grew"
      - "Shape became gas, then liquid"
      - "The ball became living, then nonliving"
    answer: "Direction changed, then motion stopped"
    topic: "Force, Motion, and Energy"
    explanation: "A sideward force can turn a moving ball, and another force can stop it."
  - question: "A magnet attracts an iron nail but not wood or rubber. Which rule best predicts what happens with another iron nail?"
    choices:
      - "It will also tend to be attracted because it is iron"
      - "Only the first nail can ever be attracted"
      - "All wooden objects will now be attracted"
      - "The magnet attracts every material equally"
    answer: "It will also tend to be attracted because it is iron"
    topic: "Force, Motion, and Energy"
    explanation: "Iron is magnetic, so another iron nail is expected to be attracted too."
  - question: "A north pole repels the nearby end of another magnet. What is that nearby pole, and why?"
    choices:
      - "North, because like poles repel"
      - "South, because opposite poles repel"
      - "South, because like poles attract"
      - "Neither, because magnets have no poles"
    answer: "North, because like poles repel"
    topic: "Force, Motion, and Energy"
    explanation: "A north pole repels another north pole; opposite poles attract."
  - question: "The north pole of one magnet faces the south pole of another. One magnet is then turned so the two north poles face. What changes?"
    choices:
      - "Attraction becomes repulsion"
      - "Repulsion becomes attraction"
      - "Both magnets become plastic"
      - "Neither arrangement produces a magnetic force"
    answer: "Attraction becomes repulsion"
    topic: "Force, Motion, and Energy"
    explanation: "Opposite poles attract, but like poles repel."
  - question: "A drum and a guitar both make sounds, although they look different. What do their sound-producing parts have in common?"
    choices:
      - "They vibrate"
      - "They are both liquids"
      - "They make their own sunlight"
      - "They must both be magnetic"
    answer: "They vibrate"
    topic: "Force, Motion, and Energy"
    explanation: "Sound is produced by vibrations, whether from a drum skin or a guitar string."
  - question: "A child sees an exposed wire near a puddle. Which plan best follows both electrical safety rules?"
