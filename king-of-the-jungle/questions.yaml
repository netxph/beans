easy:
  - question: "Which laboratory apparatus is mainly used to measure temperature?"
    choices:
      - "Beaker"
      - "Thermometer"
      - "Funnel"
      - "Balance"
    answer: "Thermometer"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 1: A thermometer measures temperature."
  - question: "A scientist wants to add a liquid one drop at a time. Which apparatus should be used?"
    choices:
      - "Dropper"
      - "Balance"
      - "Funnel"
      - "Microscope"
    answer: "Dropper"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 3: A dropper releases small amounts of liquid one drop at a time."
  - question: "What is the main purpose of a laboratory warning sign?"
    choices:
      - "To decorate the laboratory"
      - "To tell us about a possible danger"
      - "To show where experiments begin"
      - "To tell us the name of the scientist"
    answer: "To tell us about a possible danger"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 9: Warning signs identify hazards so people can take appropriate precautions."
  - question: "A container has a 🔥 Flammable sign. What does the sign mean?"
    choices:
      - "The material can catch fire easily."
      - "The material is safe to heat."
      - "The material must be frozen."
      - "The material can be eaten safely."
    answer: "The material can catch fire easily."
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 10: Flammable materials can ignite easily and should be kept away from ignition sources."
  - question: "You see a 🥽 Wear Safety Goggles sign before an experiment. What should you do?"
    choices:
      - "Cover your ears."
      - "Wash the goggles with chemicals."
      - "Put on safety goggles to protect your eyes."
      - "Stay away from all laboratory equipment."
    answer: "Put on safety goggles to protect your eyes."
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 11: Safety goggles help protect the eyes from splashes and particles."
  - question: "Which is an example of a chemical change?"
    choices:
      - "Cutting paper into pieces"
      - "Melting an ice cube"
      - "Rusting an iron nail"
      - "Freezing water"
    answer: "Rusting an iron nail"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 15: Rusting produces new substances, making it a chemical change."
  - question: "Which change does NOT form a new substance?"
    choices:
      - "An egg cooking"
      - "An iron nail rusting"
      - "An apple turning brown"
      - "An ice cube melting"
    answer: "An ice cube melting"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 17: Melting changes water's physical state without producing a new substance."
  - question: "What is an element?"
    choices:
      - "A pure substance made of one kind of atom"
      - "A mixture of many different materials"
      - "Anything that can be changed into water"
      - "A substance that is always a solid"
    answer: "A pure substance made of one kind of atom"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 20: An element contains only one kind of atom."
  - question: "What is the Periodic Table?"
    choices:
      - "A chart showing only metals"
      - "A chart that organizes the elements"
      - "A list of liquids and gases"
      - "A table showing only chemicals found in laboratories"
    answer: "A chart that organizes the elements"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 21: The Periodic Table organizes chemical elements by atomic number and recurring properties."
  - question: "Which of the following is a metal?"
    choices:
      - "Oxygen"
      - "Carbon"
      - "Copper"
      - "Nitrogen"
    answer: "Copper"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 23: Copper is a metal; oxygen, carbon, and nitrogen are nonmetals."
  - question: "Scientists use H2O as the chemical formula for a substance we use every day for drinking, washing, and cooking. What does H2O represent?"
    choices:
      - "Oxygen"
      - "Water"
      - "Carbon dioxide"
      - "Salt"
    answer: "Water"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 30: H2O is the chemical formula for water."
  - question: "Which layer of Earth's atmosphere contains most of the air we breathe and is where most weather conditions occur?"
    choices:
      - "Stratosphere"
      - "Mesosphere"
      - "Troposphere"
      - "Thermosphere"
    answer: "Troposphere"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 5: The troposphere contains most atmospheric air and almost all weather."
  - question: "Which layer is the thin, outermost part of Earth where people live?"
    choices:
      - "Mantle"
      - "Crust"
      - "Outer core"
      - "Inner core"
    answer: "Crust"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 12: The crust is Earth's thin outermost solid layer."
  - question: "Which ocean is surrounded by the Ring of Fire, where many volcanoes and earthquakes occur?"
    choices:
      - "Atlantic Ocean"
      - "Indian Ocean"
      - "Pacific Ocean"
      - "Arctic Ocean"
    answer: "Pacific Ocean"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 15: The Pacific Ocean is bordered by the tectonically active Ring of Fire."
  - question: "Which country is located along the Pacific Ring of Fire?"
    choices:
      - "Philippines"
      - "Egypt"
      - "Brazil"
      - "Saudi Arabia"
    answer: "Philippines"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 16: The Philippines lies along the Pacific Ring of Fire."
  - question: "Which statement best describes a disaster?"
    choices:
      - "An event that always occurs without warning"
      - "An event that causes serious harm and disrupts people's lives"
      - "A natural event that changes the appearance of Earth's surface"
      - "A sudden change in weather that lasts for several hours"
    answer: "An event that causes serious harm and disrupts people's lives"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 17: A disaster seriously harms a community and disrupts people's lives."
  - question: "Which statement best describes a food chain?"
    choices:
      - "It shows one pathway of feeding relationships among organisms."
      - "It shows all the organisms living in one habitat."
      - "It groups organisms according to their body parts."
      - "It shows several feeding pathways joined together."
    answer: "It shows one pathway of feeding relationships among organisms."
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 4: A food chain represents a single pathway of energy transfer through feeding relationships."
  - question: "Which stage comes first in the life cycle of a butterfly?"
    choices:
      - "Caterpillar"
      - "Egg"
      - "Chrysalis"
      - "Adult butterfly"
    answer: "Egg"
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 9: A butterfly's life cycle begins with an egg."
  - question: "What happens during the caterpillar stage?"
    choices:
      - "It lays eggs."
      - "It flies from flower to flower."
      - "It eats and grows."
      - "It stays inside a chrysalis."
    answer: "It eats and grows."
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 10: The caterpillar is the feeding and growing larval stage."
  - question: "Which animal is a mammal?"
    choices:
      - "Frog"
      - "Dolphin"
      - "Eagle"
      - "Snake"
    answer: "Dolphin"
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 19: Dolphins are mammals that breathe air and nurse their young with milk."
  - question: "Which body covering belongs to birds?"
    choices:
      - "Fur"
      - "Moist skin"
      - "Feathers"
      - "Dry scales"
    answer: "Feathers"
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 20: Feathers are the characteristic body covering of birds."
  - question: "Which animal belongs to the reptile group?"
    choices:
      - "Turtle"
      - "Cat"
      - "Duck"
      - "Tuna"
    answer: "Turtle"
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 21: Turtles belong to the reptile group."
  - question: "Which vitamin is known as the “Vision Vitamin”?"
    choices:
      - "Vitamin A"
      - "Vitamin C"
      - "Vitamin D"
      - "Vitamin K"
    answer: "Vitamin A"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 1: Vitamin A supports normal vision, including vision in dim light."
  - question: "Which vitamin helps the body absorb calcium?"
    choices:
      - "Vitamin A"
      - "Vitamin C"
      - "Vitamin D"
      - "Vitamin E"
    answer: "Vitamin D"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 2: Vitamin D helps the body absorb calcium."
  - question: "Which vitamin helps blood clot normally?"
    choices:
      - "Vitamin B12"
      - "Vitamin C"
      - "Vitamin D"
      - "Vitamin K"
    answer: "Vitamin K"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 3: Vitamin K is needed for normal blood clotting."
  - question: "Which mineral is especially important for strong bones and teeth?"
    choices:
      - "Iron"
      - "Calcium"
      - "Iodine"
      - "Sodium"
    answer: "Calcium"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 4: Calcium is a major mineral in bones and teeth."
  - question: "What does the Mohs scale measure?"
    choices:
      - "Color of minerals"
      - "Hardness of minerals"
      - "Weight of minerals"
      - "Size of minerals"
    answer: "Hardness of minerals"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 12: The Mohs scale ranks minerals by scratch hardness."
  - question: "Which is the softest mineral on the Mohs scale?"
    choices:
      - "Quartz"
      - "Diamond"
      - "Talc"
      - "Topaz"
    answer: "Talc"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 13: Talc has a Mohs hardness of 1, the lowest on the scale."
  - question: "Which is the hardest mineral on the Mohs scale?"
    choices:
      - "Diamond"
      - "Gypsum"
      - "Calcite"
      - "Apatite"
    answer: "Diamond"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 14: Diamond has a Mohs hardness of 10, the highest on the scale."
  - question: "What is Earth’s rotation?"
    choices:
      - "Earth spinning on its axis"
      - "Earth moving around the Sun"
      - "The Moon moving around Earth"
      - "The Sun moving around Earth"
    answer: "Earth spinning on its axis"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 16: Rotation is Earth's spinning motion about its axis."
  - question: "About how long does Earth take to make one complete rotation?"
    choices:
      - "12 hours"
      - "24 hours"
      - "7 days"
      - "365 days"
    answer: "24 hours"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 17: One rotation relative to the Sun takes about 24 hours."
  - question: "What is Earth’s revolution?"
    choices:
      - "Earth spinning on its axis"
      - "Earth moving around the Sun"
      - "The Sun spinning around Earth"
      - "Earth moving around the Moon"
    answer: "Earth moving around the Sun"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 18: Revolution is Earth's orbital motion around the Sun."
  - question: "Which list shows the first four planets in the correct order from the Sun?"
    choices:
      - "Mercury, Venus, Earth, Mars"
      - "Venus, Mercury, Mars, Earth"
      - "Mercury, Earth, Venus, Mars"
      - "Mars, Earth, Venus, Mercury"
    answer: "Mercury, Venus, Earth, Mars"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 22: The four planets nearest the Sun are Mercury, Venus, Earth, and Mars, in that order."
  - question: "What does a decibel (dB) measure?"
    choices:
      - "How fast a sound travels"
      - "How loud a sound is"
      - "How long a sound lasts"
      - "How far away a sound is"
    answer: "How loud a sound is"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 27: Decibels express sound level; higher sound levels generally sound louder under comparable conditions."
  - question: "Which material is a good conductor of heat?"
    choices:
      - "Wood"
      - "Plastic"
      - "Copper"
      - "Rubber"
    answer: "Copper"
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 1: Copper conducts heat well; wood, plastic, and rubber are comparatively poor heat conductors."
  - question: "At what temperature does pure water freeze under normal conditions?"
    choices:
      - "0°C"
      - "25°C"
      - "50°C"
      - "100°C"
    answer: "0°C"
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 7: Pure water freezes at about 0°C under normal atmospheric pressure."
  - question: "Which statement correctly describes melting?"
    choices:
      - "A liquid loses heat and becomes a solid."
      - "A solid gains heat and becomes a liquid."
      - "A liquid gains heat and becomes a solid."
      - "A gas loses heat and becomes hotter."
    answer: "A solid gains heat and becomes a liquid."
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 8: Melting happens when a solid absorbs enough heat to become a liquid."
  - question: "What is a source of light?"
    choices:
      - "An object that only stores heat"
      - "An object that produces its own light"
      - "Any object that can be seen"
      - "Any object that reflects sound"
    answer: "An object that produces its own light"
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 12: A source of light emits its own light rather than merely reflecting light."
  - question: "A firefly produces light through bioluminescence. What does bioluminescence mean?"
    choices:
      - "Light reflected by a shiny surface"
      - "Light produced by a living organism"
      - "Light produced only by electricity"
      - "Light coming from the Sun"
    answer: "Light produced by a living organism"
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 13: Bioluminescence is light produced by chemical reactions in living organisms."
  - question: "Which is a natural source of light?"
    choices:
      - "Mirror"
      - "Flashlight"
      - "Lightning"
      - "Streetlight"
    answer: "Lightning"
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 14: Lightning occurs naturally and emits light."
  - question: "Which object does NOT produce its own light?"
    choices:
      - "Star"
      - "Moon"
      - "Candle flame"
      - "Light bulb"
    answer: "Moon"
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 15: The Moon is visible mainly because it reflects sunlight, not because it produces visible light itself."
  - question: "What does the word force mean in science?"
    choices:
      - "A push or pull that can affect an object"
      - "The amount of space inside an object"
      - "The color and shape of an object"
      - "The heat stored inside an object"
    answer: "A push or pull that can affect an object"
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 20: A force is a push or pull that can change an object's motion or shape."
average:
  - question: "Which apparatus is best for measuring the volume of a liquid accurately?"
    choices:
      - "Test tube"
      - "Beaker"
      - "Graduated cylinder"
      - "Mortar and pestle"
    answer: "Graduated cylinder"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 2: A graduated cylinder is designed to measure liquid volume more accurately than a beaker."
  - question: "What usually helps an iron nail rust?"
    choices:
      - "Oxygen and water"
      - "Sugar and sunlight"
      - "Oil and plastic"
      - "Salt and sugar"
    answer: "Oxygen and water"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 16: Iron rusts when it reacts with oxygen in the presence of water."
  - question: "Which statement best describes a metal?"
    choices:
      - "It must always be a gas."
      - "It cannot conduct heat."
      - "It is often a good conductor of heat and electricity."
      - "It is always soft and easily broken."
    answer: "It is often a good conductor of heat and electricity."
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 22: Metals generally conduct heat and electricity well."
  - question: "Which element is a nonmetal and a gas that humans need for breathing?"
    choices:
      - "Oxygen"
      - "Aluminum"
      - "Copper"
      - "Gold"
    answer: "Oxygen"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 24: Oxygen is a gaseous nonmetal needed for human respiration."
  - question: "Which pair contains two noble gases?"
    choices:
      - "Oxygen and nitrogen"
      - "Helium and neon"
      - "Carbon and sulfur"
      - "Iron and copper"
    answer: "Helium and neon"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 25: Helium and neon are both noble gases."
  - question: "Ella notices that a soft-drink can is light but strong enough to hold a drink. Which metal is commonly used to make such cans?"
    choices:
      - "Aluminum"
      - "Oxygen"
      - "Carbon"
      - "Neon"
    answer: "Aluminum"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 26: Aluminum is lightweight and commonly used for drink cans."
  - question: "Carlo sees a balloon filled with a gas that is lighter than air. Which element could be inside the balloon?"
    choices:
      - "Iron"
      - "Copper"
      - "Helium"
      - "Carbon"
    answer: "Helium"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 27: Helium is a gas less dense than air, so helium-filled balloons can rise."
  - question: "A food maker adds a substance to a jar of food. The substance helps slow spoilage, so the food can stay good for a longer time. What word best describes the job of the substance?"
    choices:
      - "Sweetener"
      - "Preservative"
      - "Thickener"
      - "Coloring"
    answer: "Preservative"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 28: A preservative slows spoilage and helps food last longer."
  - question: "Lia forgot a container of food for several days. Later, she noticed an unpleasant smell, a change in appearance, and signs that the food was no longer good to eat. Which term best describes what happened?"
    choices:
      - "Preservation"
      - "Flavoring"
      - "Spoilage"
      - "Freezing"
    answer: "Spoilage"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 29: Unpleasant odors and changes that make food unsafe are signs of spoilage."
  - question: "Which of the following directly causes wind?"
    choices:
      - "Earth’s rotation"
      - "gravitational pull of the Moon"
      - "uneven heating from the Sun"
      - "gaseous emissions from volcanoes"
    answer: "uneven heating from the Sun"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 1: Uneven solar heating creates temperature and pressure differences that drive air movement."
  - question: "Because it contains strong updrafts, which of these cloud types produces the most hail?"
    choices:
      - "stratus"
      - "cirrus"
      - "altocumulus"
      - "cumulonimbus"
    answer: "cumulonimbus"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 2: Cumulonimbus clouds have strong updrafts that keep ice particles aloft long enough to grow into hail."
  - question: "Which of these is not like the others?"
    choices:
      - "tsunami"
      - "hurricane"
      - "typhoon"
      - "cyclone"
    answer: "tsunami"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 3: A tsunami is a series of water waves; hurricanes, typhoons, and cyclones are tropical storms."
  - question: "What term is frequently used to describe lightning that is so far away that observers cannot hear the thunder?"
    choices:
      - "reverse lightning"
      - "heat lightning"
      - "ball lightning"
      - "white lightning"
    answer: "heat lightning"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 4: Heat lightning is distant lightning whose thunder cannot be heard by the observer."
  - question: "A scientist wants to study the ozone layer, which helps protect Earth from harmful ultraviolet (UV) rays. Which layer of the atmosphere should the scientist investigate?"
    choices:
      - "Thermosphere"
      - "Stratosphere"
      - "Exosphere"
      - "Mesosphere"
    answer: "Stratosphere"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 6: Most atmospheric ozone is in the stratosphere, where it absorbs harmful UV radiation."
  - question: "Which layer is liquid and helps create Earth’s magnetic field?"
    choices:
      - "Mantle"
      - "Crust"
      - "Inner core"
      - "Outer core"
    answer: "Outer core"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 13: The liquid outer core's moving electrically conductive metal helps generate Earth's magnetic field."
  - question: "Which group consists entirely of disasters that can result from natural processes?"
    choices:
      - "Typhoon, chemical spill, earthquake"
      - "Forest fire caused by arson, tsunami, flood"
      - "Industrial explosion, landslide, volcanic eruption"
      - "Earthquake, volcanic eruption, tsunami"
    answer: "Earthquake, volcanic eruption, tsunami"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 18: Earthquakes, volcanic eruptions, and tsunamis can all arise from natural processes."
  - question: "Which disaster is most directly associated with the sudden movement of Earth's tectonic plates?"
    choices:
      - "Typhoon"
      - "Oil spill"
      - "Earthquake"
      - "Industrial fire"
    answer: "Earthquake"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 19: Sudden movement along faults associated with tectonic plates releases energy as an earthquake."
  - question: "During a volcanic eruption, melted rock travels upward through a passage inside the volcano before reaching the surface. Which part of the volcano serves as the main passage for the rising magma?"
    choices:
      - "Crater"
      - "Magma chamber"
      - "Volcanic cone"
      - "Main vent"
    answer: "Main vent"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 24: The main vent is the principal passage through which magma rises toward the surface."
  - question: "Which statement best describes renewable energy?"
    choices:
      - "Energy produced only by machines that do not require fuel."
      - "Energy stored underground that takes millions of years to develop."
      - "Energy that can be used continuously without affecting the environment."
      - "Energy obtained from natural sources that can be replenished within a relatively short time."
    answer: "Energy obtained from natural sources that can be replenished within a relatively short time."
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 28: Renewable energy comes from sources replenished on relatively short timescales."
  - question: "Which group contains only nonrenewable energy sources?"
    choices:
      - "Coal, geothermal energy, and uranium"
      - "Natural gas, hydropower, and petroleum"
      - "Uranium, wind energy, and coal"
      - "Petroleum, coal, and natural gas"
    answer: "Petroleum, coal, and natural gas"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 29: Petroleum, coal, and natural gas are fossil fuels that are not replenished on human timescales."
  - question: "Why is a food web more complex than a food chain?"
    choices:
      - "It shows several connected feeding relationships."
      - "It shows organisms arranged from smallest to largest."
      - "It shows only organisms that live in the same place."
      - "It shows one organism eating only one kind of food."
    answer: "It shows several connected feeding relationships."
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 7: A food web combines multiple interconnected feeding pathways."
  - question: "Which sequence shows the correct order of the butterfly life cycle?"
    choices:
      - "Egg → Caterpillar → Chrysalis → Butterfly"
      - "Egg → Chrysalis → Caterpillar → Butterfly"
      - "Caterpillar → Egg → Butterfly → Chrysalis"
      - "Butterfly → Chrysalis → Egg → Caterpillar"
    answer: "Egg → Caterpillar → Chrysalis → Butterfly"
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 11: A butterfly develops from an egg into a caterpillar, then a chrysalis, and finally an adult."
  - question: "Aquarium picture labels: Sunlight, Fish, Green plants, Castle, Air pump, Rock, Snail, Gravel.\nWhich pair is different from the others because both members are nonliving?"
    choices:
      - "Fish and snail"
      - "Plant and fish"
      - "Rock and gravel"
      - "Snail and plant"
    answer: "Rock and gravel"
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 15: Rock and gravel are both nonliving; every other pair contains living organisms."
  - question: "A frog can live in water and on land during its life cycle. To which group does it belong?"
    choices:
      - "Mammals"
      - "Birds"
      - "Amphibians"
      - "Reptiles"
    answer: "Amphibians"
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 22: Frogs are amphibians with life stages associated with water and land."
  - question: "Which animal pair best shows a predator–prey relationship?"
    choices:
      - "Bee and flower"
      - "Owl and mouse"
      - "Butterfly and flower"
      - "Two rabbits eating grass"
    answer: "Owl and mouse"
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 26: Owls hunt and eat mice, making this a predator–prey pair."
  - question: "A doctor explains that an organ keeps the right amount of water in the body while also removing wastes. Which glossary word best identifies the organ being described?"
    choices:
      - "Ureter"
      - "Kidney"
      - "Cortex"
      - "Nephron"
    answer: "Kidney"
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 27: The kidneys remove wastes and help regulate the body's water balance."
  - question: "Nephrons remove unwanted materials from the blood while allowing useful water and nutrients to return to the body. Which word best explains what the nephrons are doing to the blood?"
    choices:
      - "Filtering"
      - "Growing"
      - "Digesting"
      - "Breathing"
    answer: "Filtering"
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 30: Nephrons filter blood and then return useful substances while wastes are excreted."
  - question: "Which mineral is needed to make hemoglobin, which carries oxygen in the blood?"
    choices:
      - "Iron"
      - "Zinc"
      - "Calcium"
      - "Iodine"
    answer: "Iron"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 5: Iron is part of hemoglobin, the protein that carries oxygen in blood."
  - question: "Which mineral is needed to make thyroid hormones?"
    choices:
      - "Potassium"
      - "Magnesium"
      - "Iodine"
      - "Calcium"
    answer: "Iodine"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 6: Iodine is needed to produce thyroid hormones."
  - question: "A mystery nutrient has these clues: It is a mineral. It helps carry oxygen in the blood. Meat, beans, and leafy greens can provide it. What is the mystery nutrient?"
    choices:
      - "Calcium"
      - "Iron"
      - "Iodine"
      - "Potassium"
    answer: "Iron"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 10: Iron is the mineral used in hemoglobin and can be obtained from meat, beans, and leafy greens."
  - question: "Which statement correctly compares Earth and Mars?"
    choices:
      - "Earth and Mars have the same number of moons."
      - "Earth has two moons, while Mars has one."
      - "Mars has one more moon than Earth."
      - "Neither Earth nor Mars has a moon."
    answer: "Mars has one more moon than Earth."
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 23: Earth has one natural moon and Mars has two, so Mars has one more."
  - question: "A spacecraft travels away from the Sun. It passes Jupiter and then reaches a planet famous for its large rings. Which planet has it reached?"
    choices:
      - "Mars"
      - "Saturn"
      - "Uranus"
      - "Neptune"
    answer: "Saturn"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 24: Saturn lies beyond Jupiter and is known for its prominent ring system."
  - question: "Which is a non-contact force?"
    choices:
      - "Friction"
      - "Spring force"
      - "Gravity"
      - "Water resistance"
    answer: "Gravity"
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 21: Gravity acts between objects without requiring physical contact."
  - question: "Which situation shows friction?"
    choices:
      - "A magnet attracting a paper clip"
      - "Bicycle brakes rubbing against a wheel"
      - "An apple falling from a tree"
      - "A charged balloon attracting tiny pieces of paper"
    answer: "Bicycle brakes rubbing against a wheel"
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 22: Bicycle brakes exert friction by rubbing against a moving wheel or braking surface."
difficult:
  - question: "Mia wants to measure exactly 25 mL of water and then pour it into a container. Which apparatus should she use to measure the water?"
    choices:
      - "Beaker"
      - "Graduated cylinder"
      - "Test tube"
      - "Mortar and pestle"
    answer: "Graduated cylinder"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 4: Use the graduated cylinder's scale to measure 25 mL before pouring."
  - question: "Leo finds a tiny object that he cannot see clearly with his eyes. He needs to observe details that are too small to see clearly with the unaided eye. Which apparatus is most suitable?"
    choices:
      - "Microscope"
      - "Thermometer"
      - "Balance"
      - "Funnel"
    answer: "Microscope"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 5: A microscope magnifies details too small to see clearly with the unaided eye."
  - question: "Leo sees an ⚡ Electrical Hazard sign near a piece of equipment. His hands are wet. What is the safest action?"
    choices:
      - "Touch the equipment quickly."
      - "Dry his hands and wait for the teacher's instructions."
      - "Pour more water near the equipment."
      - "Ask a friend to touch it instead."
    answer: "Dry his hands and wait for the teacher's instructions."
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 12: Wet hands increase electrical risk; Leo should dry them and wait for the teacher's instructions."
  - question: "A bottle has a 🧪 Corrosive warning sign. A few drops accidentally spill on the laboratory table. What should Mia do first?"
    choices:
      - "Touch the liquid to find out what it is."
      - "Wipe it with her bare hands."
      - "Tell the teacher immediately."
      - "Smell the liquid closely."
    answer: "Tell the teacher immediately."
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 13: Report a corrosive spill immediately so the teacher can arrange safe cleanup."
  - question: "Mia mixes vinegar and baking soda. The mixture quickly begins to fizz. What is the best explanation for the bubbles?"
    choices:
      - "Carbon dioxide gas is being produced."
      - "The vinegar is freezing."
      - "The baking soda is turning into oxygen."
      - "Air is changing into water."
    answer: "Carbon dioxide gas is being produced."
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 18: Vinegar reacts with baking soda to release carbon dioxide gas, causing fizzing."
  - question: "During a science activity, four students describe events occurring in different atmospheric layers.\nStudent — Observation\nAna — A meteor burns up as it enters Earth's atmosphere.\nBen — A thunderstorm produces lightning and heavy rain.\nCarlo — An aurora produces colorful lights in the sky.\nDana — A satellite orbits Earth high above most of the atmosphere.\nWhich student describes an event that mainly occurs in the mesosphere?"
    choices:
      - "Ben"
      - "Carlo"
      - "Dana"
      - "Ana"
    answer: "Ana"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 7: Ana describes a meteor burning up, which usually happens in the mesosphere."
  - question: "Imagine that Earth's atmosphere suddenly lost most of its ozone layer. Which consequence would most likely occur?"
    choices:
      - "More harmful ultraviolet radiation would reach Earth's surface."
      - "All satellites would immediately stop orbiting Earth."
      - "Rain clouds would no longer form in the troposphere."
      - "Meteors would stop entering Earth's atmosphere."
    answer: "More harmful ultraviolet radiation would reach Earth's surface."
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 8: Without much of the protective ozone layer, more harmful UV radiation would reach the surface."
  - question: "During a morning observation, Mia notices thin, white, feather-like clouds high in the sky. Her teacher explains that these clouds are mostly made of ice crystals. Which type of cloud did Mia most likely observe?"
    choices:
      - "Altocumulus"
      - "Cirrus"
      - "Stratus"
      - "Cumulus"
    answer: "Cirrus"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 10: Cirrus clouds are high, thin, feather-like clouds composed mainly of ice crystals."
  - question: "A volcano erupts and lava reaches Earth’s surface. From which major layer did the melted rock most likely come?"
    choices:
      - "Mantle"
      - "Crust"
      - "Outer core"
      - "Inner core"
    answer: "Mantle"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 14: Much volcanic magma originates from partial melting in the mantle; it can collect in crustal chambers before eruption."
  - question: "A community near a mountain experienced several days of heavy rainfall. Soon afterward, rocks and soil suddenly moved downhill, damaging houses and blocking roads. Which event most likely occurred?"
    choices:
      - "An earthquake caused the mountain to collapse."
      - "A landslide occurred after the soil became saturated with water."
      - "A volcanic eruption caused rocks and soil to move downhill."
      - "A tsunami pushed soil and rocks away from the mountain."
    answer: "A landslide occurred after the soil became saturated with water."
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 20: Heavy rain can saturate and destabilize a slope, causing soil and rock to slide downhill."
  - question: "A forest experiences two separate fires. Fire A: Lightning strikes a dry tree and starts a fire. Fire B: A person leaves a campfire unattended, causing nearby plants to burn. Which statement best explains the difference between these events?"
    choices:
      - "Both fires are human-made because trees are involved."
      - "Fire A has a natural cause, while Fire B has a human cause."
      - "Fire A is human-made because lightning produces heat."
      - "Both fires have natural causes because dry plants can burn."
    answer: "Fire A has a natural cause, while Fire B has a human cause."
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 23: Lightning is a natural ignition source; an unattended campfire results from human activity."
  - question: "A school plans to install a renewable energy system. The school is located in an area that receives strong sunlight throughout most of the year but experiences very little wind. Which energy system would be most suitable for the school?"
    choices:
      - "Wind turbines that depend on moving air"
      - "A coal-powered generator for daily electricity"
      - "Solar panels that convert sunlight into electricity"
      - "A hydropower system that requires flowing water"
    answer: "Solar panels that convert sunlight into electricity"
    topic: "Earth Science"
    explanation: "cm-es.pdf, question 30: Strong sunlight and little wind favor solar panels over wind turbines; coal is not renewable."
  - question: "Ana forgot to water her plant for several days. Which plant part will have difficulty doing its job first?"
    choices:
      - "Flower, because it makes seeds"
      - "Roots, because they absorb water from the soil"
      - "Fruit, because it protects the seeds"
      - "Leaves, because they hold the plant in the soil"
    answer: "Roots, because they absorb water from the soil"
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 1: Roots absorb water from soil, so dry soil prevents them from supplying enough water to the plant."
  - question: "A plant has healthy roots, stem, and leaves, but its flowers were removed. What is most likely to happen?"
    choices:
      - "The plant may have difficulty making seeds."
      - "The plant cannot absorb water anymore."
      - "The plant will fall because it has no support."
      - "The leaves will stop getting sunlight."
    answer: "The plant may have difficulty making seeds."
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 2: Flowers contain reproductive structures that help flowering plants produce seeds."
  - question: "Study the food chain: Grass → Grasshopper → Frog → Hawk. Which statement is correct?"
    choices:
      - "The frog gets energy directly from the grass."
      - "The grasshopper gets energy directly from the grass."
      - "The hawk gets energy directly from the grasshopper."
      - "The grass gets energy directly from the frog."
    answer: "The grasshopper gets energy directly from the grass."
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 5: The arrow from grass to grasshopper shows that the grasshopper obtains energy directly from grass."
  - question: "Study the food chain: Grass → Grasshopper → Frog → Hawk.\nIf the number of grasshoppers becomes much smaller, what is the most likely effect on the frogs?"
    choices:
      - "Frogs may have less food available."
      - "Frogs may have more grass to eat."
      - "Frogs may receive more energy from hawks."
      - "Frogs may no longer depend on other organisms for food."
    answer: "Frogs may have less food available."
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 6: In this chain, frogs eat grasshoppers; fewer grasshoppers means less food for frogs."
  - question: "In a food web, a frog may be eaten by both a snake and a hawk. What does this tell us?"
    choices:
      - "One organism can be connected to more than one consumer."
      - "Every predator eats the same kind of prey."
      - "An organism can belong to only one feeding relationship."
      - "Predators receive energy directly from plants."
    answer: "One organism can be connected to more than one consumer."
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 8: The frog can supply energy to more than one predator, linking several feeding relationships."
  - question: "Mia sees a caterpillar eating leaves. What will most likely happen next as it continues its life cycle?"
    choices:
      - "It will become an egg."
      - "It will form a chrysalis."
      - "It will immediately begin flying."
      - "It will become a tadpole."
    answer: "It will form a chrysalis."
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 12: After growing, a caterpillar enters the pupal stage inside a chrysalis."
  - question: "Aquarium picture labels: Sunlight, Fish, Green plants, Castle, Air pump, Rock, Snail, Gravel.\nLea grouped the fish, snail, and green plants together. What is the best reason for her grouping?"
    choices:
      - "They are all found near the bottom of the aquarium."
      - "They all need certain conditions to live and grow."
      - "They all have the same body parts."
      - "They all move from one place to another."
    answer: "They all need certain conditions to live and grow."
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 14: Fish, snails, and green plants are living things that need suitable conditions to survive and grow."
  - question: "Aquarium picture labels: Sunlight, Fish, Green plants, Castle, Air pump, Rock, Snail, Gravel.\nCarlo says, “The green plant is nonliving because it does not swim.” Which observation best shows that Carlo is incorrect?"
    choices:
      - "The plant stays beside the rock."
      - "The plant can grow and needs water and sunlight."
      - "The plant is green and stands upright."
      - "The plant is surrounded by gravel."
    answer: "The plant can grow and needs water and sunlight."
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 16: Growth and the need for water and sunlight show that the plant is living even though it does not swim."
  - question: "Aquarium picture labels: Sunlight, Fish, Green plants, Castle, Air pump, Rock, Snail, Gravel.\nA pupil makes these two groups: Group 1: Fish, snail, green plants Group 2: Rock, gravel, castle Which rule did the pupil most likely use?"
    choices:
      - "Things that can move and things that cannot move"
      - "Things that are colorful and things that are not"
      - "Living things and nonliving things"
      - "Things found in water and things found on land"
    answer: "Living things and nonliving things"
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 18: Fish, snails, and plants are living; rocks, gravel, and the decorative castle are nonliving."
  - question: "A frog sees a grasshopper and catches it for food. Which statement is correct?"
    choices:
      - "The frog is the prey."
      - "The grasshopper is the predator."
      - "The frog is the predator and the grasshopper is the prey."
      - "Both are predators."
    answer: "The frog is the predator and the grasshopper is the prey."
    topic: "Heat Round"
    explanation: "cm-hr.pdf, question 25: The animal doing the hunting is the predator; the animal being eaten is the prey."
  - question: "Nina has difficulty seeing in dim light. Her teacher explains that one vitamin supports normal vision. Which food would be a good choice?"
    choices:
      - "Carrots"
      - "White rice"
      - "Sugar"
      - "Salt"
    answer: "Carrots"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 7: Carrots contain beta-carotene, which the body can convert into vitamin A for normal vision."
  - question: "Ana eats beans for lunch. She wants her body to absorb more of the iron from the beans. What could she eat with them?"
    choices:
      - "Guava"
      - "Butter"
      - "Candy"
      - "Salt"
    answer: "Guava"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 8: Guava supplies vitamin C, which improves absorption of non-heme iron from beans."
  - question: "Marco cuts his knee while playing. His body needs nutrients that support tissue repair and wound healing. Which pair is most closely connected with these jobs?"
    choices:
      - "Vitamin C and zinc"
      - "Vitamin D and sodium"
      - "Vitamin A and iodine"
      - "Vitamin K and potassium"
    answer: "Vitamin C and zinc"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 9: Vitamin C supports collagen formation, and zinc supports tissue repair and wound healing."
  - question: "A lunch contains fish, leafy vegetables, beans, and fruit. What is the strongest reason this meal can provide several nutrients?"
    choices:
      - "Different foods can provide different vitamins and minerals."
      - "Every food contains exactly the same nutrients."
      - "Only fruits provide vitamins and minerals."
      - "A food's color tells us every nutrient it contains."
    answer: "Different foods can provide different vitamins and minerals."
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 11: A variety of foods supplies a wider range of vitamins and minerals than a single food."
  - question: "Ezra has two minerals. Mineral A has a hardness of 3, while Mineral B has a hardness of 7. Which statement is correct?"
    choices:
      - "Mineral A is harder."
      - "Mineral B is harder."
      - "Both have the same hardness."
      - "Their hardness cannot be compared."
    answer: "Mineral B is harder."
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 15: A higher Mohs number means greater scratch hardness, so mineral B is harder."
  - question: "Mia is in a quiet room at about 20 dB. She then joins a conversation at about 50 dB. What happened to the sound level?"
    choices:
      - "It became louder."
      - "It became quieter."
      - "It stayed the same."
      - "It became silent."
    answer: "It became louder."
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 28: The sound level increased from 20 dB to 50 dB, so the conversation is louder."
  - question: "Ben hears three sounds: a conversation at 50 dB, a loud radio at 80 dB, and a jet plane taking off at 120 dB. Which order shows the sounds from quietest to loudest?"
    choices:
      - "Jet plane → radio → conversation"
      - "Conversation → radio → jet plane"
      - "Radio → conversation → jet plane"
      - "Conversation → jet plane → radio"
    answer: "Conversation → radio → jet plane"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 29: The levels increase from conversation at 50 dB to radio at 80 dB to jet at 120 dB."
  - question: "Ana must choose where to spend a long time. Which place would most likely be safest for her hearing?"
    choices:
      - "Near industrial noise at 110 dB"
      - "Near a subway train at 100 dB"
      - "In a quiet room at 20 dB"
      - "Near a loud radio at 80 dB"
    answer: "In a quiet room at 20 dB"
    topic: "Integrated Science"
    explanation: "cm-is.pdf, question 30: The quiet room has the lowest listed sound level and is the safest of these choices for prolonged exposure."
  - question: "Why are many cooking pots made of metal?"
    choices:
      - "Metal can transfer heat to the food easily."
      - "Metal stops all heat from moving."
      - "Metal always stays cold."
      - "Metal makes food lighter."
    answer: "Metal can transfer heat to the food easily."
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 2: Metal transfers heat from the heat source to the food efficiently."
  - question: "Mia is designing a handle for a hot cooking pan. Which material would be the best choice for the handle?"
    choices:
      - "Copper, because it conducts heat well."
      - "Aluminum, because heat moves through it easily."
      - "Wood, because it slows the movement of heat."
      - "Steel, because it quickly transfers heat."
    answer: "Wood, because it slows the movement of heat."
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 3: Wood conducts heat poorly, reducing heat transfer from the hot pan to the hand."
  - question: "Ezra places a metal spoon and a wooden spoon in the same bowl of hot soup. After a few minutes, the metal spoon feels warmer. What is the best explanation?"
    choices:
      - "The metal spoon created its own heat."
      - "Heat moved through the metal more easily than through the wood."
      - "The wooden spoon removed all the heat from the soup."
      - "Heat can travel only through metal objects."
    answer: "Heat moved through the metal more easily than through the wood."
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 4: Heat travels through metal more readily than through wood."
  - question: "Mia places an ice cube and a piece of butter on separate plates in a warm room. After some time, both begin to change. What best explains what happened?"
    choices:
      - "Both gained heat from their surroundings."
      - "Both lost heat to their surroundings."
      - "Ice and butter have the same melting point."
      - "All solids melt at exactly 0°C."
    answer: "Both gained heat from their surroundings."
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 9: The warmer surroundings transfer heat to the ice and butter, causing them to begin melting."
  - question: "Ben sees the Moon shining brightly at night. His friend says, “The Moon must produce its own light.” Which observation best shows that his friend is incorrect?"
    choices:
      - "The Moon can be seen at night."
      - "The Moon is found in space."
      - "The Moon reflects light coming from the Sun."
      - "The Moon sometimes looks round."
    answer: "The Moon reflects light coming from the Sun."
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 17: The Moon shines by reflecting the Sun's light."
  - question: "A flashlight is pointed at a mirror in a dark room. The mirror becomes very bright. Which conclusion is correct?"
    choices:
      - "The mirror has started producing its own light."
      - "The mirror is reflecting light from the flashlight."
      - "The flashlight receives its light from the mirror."
      - "Both objects are natural sources of light."
    answer: "The mirror is reflecting light from the flashlight."
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 18: The mirror redirects light emitted by the flashlight; it does not become a light source itself."
  - question: "During a power outage, Mia has these objects nearby: 🪞 Mirror 📖 Book 🔦 Flashlight 🥄 Metal spoon She needs an object that can produce light so she can find her way safely. Which should she choose?"
    choices:
      - "🪞 Mirror"
      - "📖 Book"
      - "🔦 Flashlight"
      - "🥄 Metal spoon"
    answer: "🔦 Flashlight"
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 19: The flashlight produces light; the mirror, book, and spoon only reflect available light."
  - question: "Mia rolls a toy car across the floor. She notices that it gradually slows down and stops. Which force mainly causes the car to slow down?"
    choices:
      - "Gravity"
      - "Magnetic force"
      - "Friction"
      - "Spring force"
    answer: "Friction"
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 23: Friction opposes the toy car's motion and helps it slow down."
  - question: "A parachutist opens a parachute while falling. The parachute makes the person fall more slowly. What best explains this?"
    choices:
      - "The parachute increases air resistance."
      - "The parachute removes gravity."
      - "The parachute creates magnetic force."
      - "The parachute stops all forces from acting."
    answer: "The parachute increases air resistance."
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 24: An open parachute increases air resistance, opposing the fall and reducing falling speed."
  - question: "Study the forces acting on the parachute. ↑ AIR RESISTANCE 🪂 ↓ GRAVITY What does the illustration show?"
    choices:
      - "Both forces act upward."
      - "Both forces act downward."
      - "Gravity and air resistance act in opposite directions."
      - "Gravity disappears when the parachute opens."
    answer: "Gravity and air resistance act in opposite directions."
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 27: The diagram shows air resistance upward and gravity downward, so the forces oppose each other."
  - question: "A toy car travels 16 meters in 4 seconds. What is its average speed?"
    choices:
      - "2 meters per second"
      - "4 meters per second"
      - "6 meters per second"
      - "8 meters per second"
    answer: "4 meters per second"
    topic: "Physical Science"
    explanation: "cm-ps.pdf, question 28: Average speed is distance divided by time: 16 ÷ 4 = 4 meters per second."
clincher:
