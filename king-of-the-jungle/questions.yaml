  - question: "Two seedlings get the same soil and water. One gets sunlight; the other stays in a dark cupboard. Which factor is being tested?"
    choices:
      - "Light"
      - "Soil type"
      - "Amount of water"
      - "Container size"
    answer: "Light"
    topic: "Science Skills"
    explanation: "The changed factor is light, while the stated conditions are kept the same."
  - question: "A wet shirt and a wet towel hang in the same sunlight. The shirt dries first. Does this prove sunlight alone caused the difference?"
    choices:
      - "Yes, fabric never affects drying"
      - "No, the fabrics may hold different amounts of water"
      - "Yes, sunlight only dries shirts"
      - "No, water cannot evaporate from cloth"
    answer: "No, the fabrics may hold different amounts of water"
    topic: "Science Skills"
    explanation: "Different fabrics and initial water amounts can affect drying, so the comparison does not isolate sunlight."
  - question: "Water droplets appear outside a cold glass on a humid day. Where does this water mainly come from?"
    choices:
      - "Water passing through solid glass"
      - "The glass making new water"
      - "Water vapor in the air condensing"
      - "Ice turning directly into metal"
    answer: "Water vapor in the air condensing"
    topic: "Matter & Materials"
    explanation: "Water vapor in the surrounding air cools at the glass and condenses into droplets."
  - question: "A metal spoon in hot soup becomes warm at the handle. What mainly transfers heat along the spoon?"
    choices:
      - "Pollination"
      - "Reflection"
      - "Evaporation"
      - "Conduction"
    answer: "Conduction"
    topic: "Matter & Materials"
    explanation: "Conduction transfers heat through the metal from its hotter end toward its cooler end."
  - question: "A spoon looks bent at the water's surface but is straight when removed. What explains this?"
    choices:
      - "Refraction of light"
      - "The water permanently bends metal"
      - "The spoon grows in water"
      - "Gravity stops at the surface"
    answer: "Refraction of light"
    topic: "Light & Sound"
    explanation: "Light changes direction between water and air, making the underwater part appear displaced."
  - question: "A flashlight shines on a wall. A book is placed between them. Why does a dark patch appear?"
    choices:
      - "The book absorbs all air"
      - "The book blocks light from reaching that part of the wall"
      - "The wall stops being solid"
      - "The flashlight makes cold air"
    answer: "The book blocks light from reaching that part of the wall"
    topic: "Light & Sound"
    explanation: "The opaque book blocks the beam and creates a shadow."
  - question: "A child says the Moon makes its own sunlight because it looks bright. What is the best correction?"
    choices:
      - "The Moon is a small Sun"
      - "The Moon uses electricity from Earth"
      - "The Moon reflects light from the Sun"
      - "The Moon is always on fire"
    answer: "The Moon reflects light from the Sun"
    topic: "Earth, Weather & Space"
    explanation: "The Moon's visible brightness mainly comes from reflected sunlight."
  - question: "In a food chain, grass is eaten by a grasshopper, which is eaten by a frog. Where did the energy in the grass originally come from?"
    choices:
      - "The frog's croak"
      - "The grasshopper's legs"
      - "A magnet in the soil"
      - "Sunlight"
    answer: "Sunlight"
    topic: "Ecosystems & Relationships"
    explanation: "Grass captures sunlight through photosynthesis, and that energy passes along the food chain."
  - question: "Many frogs disappear from a garden. If other conditions stay the same, what might initially happen to the insects the frogs ate?"
    choices:
      - "Their numbers may increase"
      - "They all become frogs"
      - "They immediately lose their food"
      - "They stop needing water"
    answer: "Their numbers may increase"
    topic: "Ecosystems & Relationships"
    explanation: "With fewer predators eating them, these insects may increase, though other factors can affect their numbers."
  - question: "A caterpillar becomes a pupa before emerging as a butterfly. A cockroach nymph grows directly into an adult. What is the key difference?"
    choices:
      - "The cockroach never grows"
      - "The butterfly has a pupal stage; the cockroach does not"
      - "The butterfly has no egg stage"
      - "Both have identical stages"
    answer: "The butterfly has a pupal stage; the cockroach does not"
    topic: "Animals & Life Cycles"
    explanation: "Complete metamorphosis includes a pupa; cockroach development does not include that stage."
  - question: "A whale and a fish both live in the sea. Which feature shows that the whale is a mammal?"
    choices:
      - "It swims"
      - "It has a streamlined body"
      - "It feeds milk to its young"
      - "It lives in salt water"
    answer: "It feeds milk to its young"
    topic: "Animals & Life Cycles"
    explanation: "Producing milk for young is a mammalian trait; swimming and habitat do not identify the group."
  - question: "A seed is watered and kept warm but sealed in a jar with no oxygen. Which need is missing for normal germination?"
    choices:
      - "Soil containing stones"
      - "A flower petal"
      - "Direct sunlight for every seed"
      - "Air containing oxygen"
    answer: "Air containing oxygen"
    topic: "Plants & Growth"
    explanation: "Most seeds need oxygen for cellular respiration during germination; not all seeds require light or soil."
  - question: "A plant has healthy leaves, but its roots are badly damaged. Why might it wilt even when the soil is wet?"
    choices:
      - "The roots cannot take in enough water"
      - "Leaves no longer need water"
      - "Wet soil removes sunlight"
      - "The stem turns into a flower"
    answer: "The roots cannot take in enough water"
    topic: "Plants & Growth"
    explanation: "Damaged roots may not absorb enough water to replace water lost by the leaves."
  - question: "Both a battery-powered toy and a seed can change position. Which observation best shows that the seed is living?"
    choices:
      - "It can be pushed across a table"
      - "It can grow into a plant under suitable conditions"
      - "It has a brown color"
      - "It is smaller than the toy"
    answer: "It can grow into a plant under suitable conditions"
    topic: "Science Skills"
    explanation: "Movement alone does not show life; a seed can grow and carry out life processes."
  - question: "A ball is thrown upward. After leaving the hand, what force pulls it back toward the ground?"
    choices:
      - "The ball's color"
      - "Photosynthesis"
      - "Gravity"
      - "The Moon's reflected light"
    answer: "Gravity"
    topic: "Forces & Motion"
    explanation: "Earth's gravity continues pulling the ball downward while it rises and falls."
  - question: "A toy car travels 12 meters in 4 seconds. What is its average speed?"
    choices:
      - "8 meters per second"
      - "16 meters per second"
      - "48 meters per second"
      - "3 meters per second"
    answer: "3 meters per second"
    topic: "Forces & Motion"
    explanation: "Average speed is distance divided by time: 12 divided by 4 equals 3 meters per second."
  - question: "Two identical toy cars receive the same push. One rolls on tile and the other on carpet. Why might the one on carpet stop sooner?"
    choices:
      - "The carpet offers more resistance to rolling"
      - "Gravity disappears on tile"
      - "The carpet makes the car heavier instantly"
      - "The tile supplies a battery"
    answer: "The carpet offers more resistance to rolling"
    topic: "Forces & Motion"
    explanation: "Carpet generally resists rolling more than smooth tile and slows the car more quickly."
  - question: "An ice cube melts in a closed container with no leaks. What happens to the total mass of the container and its contents?"
    choices:
      - "It becomes zero"
      - "It stays the same"
      - "It doubles"
      - "It always decreases"
    answer: "It stays the same"
    topic: "Matter & Materials"
    explanation: "Melting changes the state of the water, but no matter leaves or enters the closed container."
  - question: "Boiling water makes an invisible gas and a visible white cloud above the pot. What is the visible white cloud mainly made of?"
    choices:
      - "Invisible water vapor alone"
      - "Ash from the water"
      - "Tiny liquid water droplets"
      - "Oxygen crystals"
    answer: "Tiny liquid water droplets"
    topic: "Matter & Materials"
    explanation: "Water vapor is invisible; some of it cools and condenses into the tiny droplets we see."
  - question: "Which statement correctly distinguishes digestion from cellular respiration?"
    choices:
      - "Digestion makes sunlight; respiration makes soil"
      - "Both happen only in the stomach"
      - "Respiration is the chewing of food"
      - "Digestion breaks food down; cellular respiration releases usable energy in cells"
    answer: "Digestion breaks food down; cellular respiration releases usable energy in cells"
    topic: "Human Body & Health"
    explanation: "Digestion makes food molecules available; cells use cellular respiration to release usable energy from them."
