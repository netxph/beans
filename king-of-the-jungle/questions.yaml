      - "W–Balance, X–Thermometer, Y–Mortar and pestle, Z–Dropper"
      - "W–Thermometer, X–Balance, Y–Dropper, Z–Mortar and pestle"
      - "W–Balance, X–Funnel, Y–Beaker, Z–Microscope"
      - "W–Beaker, X–Thermometer, Y–Balance, Z–Funnel"
    answer: "W–Balance, X–Thermometer, Y–Mortar and pestle, Z–Dropper"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 6: A balance measures mass, a thermometer measures temperature, a mortar and pestle crush solids, and a dropper transfers drops."
  - question: "Ana and Ben both have water. Ana needs to hold and mix the water with another substance. Ben needs to measure exactly 40 mL of water. Which apparatus should they choose?"
    choices:
      - "Ana—graduated cylinder; Ben—beaker"
      - "Ana—beaker; Ben—graduated cylinder"
      - "Ana—dropper; Ben—test tube"
      - "Ana—funnel; Ben—beaker"
    answer: "Ana—beaker; Ben—graduated cylinder"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 7: A beaker holds and mixes liquids; a graduated cylinder measures a specified liquid volume."
  - question: "A student must: Step 1: Measure 30 mL of water accurately. Step 2: Measure its temperature. Step 3: Add another liquid drop by drop. Which sequence of apparatus is best?"
    choices:
      - "Beaker → Balance → Funnel"
      - "Graduated cylinder → Thermometer → Dropper"
      - "Test tube → Microscope → Funnel"
      - "Balance → Graduated cylinder → Spatula"
    answer: "Graduated cylinder → Thermometer → Dropper"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 8: The tasks require a graduated cylinder for volume, a thermometer for temperature, and a dropper for drops."
  - question: "Four students see a ♨️ Hot Surface sign. A. Ana waits for the teacher before touching the object. B. Ben keeps his bare hands away from the hot object. C. Cara touches the object quickly because it does not look hot. D. Dan follows the teacher's safety instructions. Who is NOT following the meaning of the warning sign?"
    choices:
      - "Ana"
      - "Ben"
      - "Cara"
      - "Dan"
    answer: "Cara"
    topic: "Elementary Chemistry"
    explanation: "cm-ec.pdf, question 14: Cara touches the hot object despite the warning; the others wait, avoid contact, or follow instructions."
  - question: "Study the observations. Change Observation P Ice becomes liquid water. Q An egg becomes firm when cooked. R Water becomes ice. S A cut apple becomes brown. Which pair shows chemical changes?"
    choices:
      - "P and Q"
      - "P and R"
      - "Q and S"
      - "R and S"
    answer: "Q and S"
