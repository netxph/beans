      - "Decantation"
      - "Using a magnet"
    answer: "Evaporation / Distillation"
  - question: "What happens to the rate of dissolving of sugar when stirred in hot water compared to cold water?"
    choices:
      - "It dissolves faster because molecules move quicker"
