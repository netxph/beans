easy:
  - question: "After dead plants and animals rot, their remains become part of the ________."
    choices:
      - "Soil"
      - "Cement"
      - "Plastic"
      - "Glass"
    answer: "Soil"
    topic: "Ecosystems & Relationships"
    explanation: "Decomposed remains add organic matter to soil."
  - question: "A caterpillar is a young butterfly. What is this stage called?"
    choices:
      - "Egg"
      - "Larva"
      - "Pupa"
      - "Adult"
    answer: "Larva"
    topic: "Animals & Life Cycles"
    explanation: "The larva of a butterfly is a caterpillar."
  - question: "Which living thing has no eyes, legs, mouth, or wings?"
    choices:
      - "A duck-billed platypus"
      - "A snake"
      - "A plant"
      - "A butterfly"
    answer: "A plant"
    topic: "Plants & Growth"
    explanation: "Plants are living things without the listed animal body parts."
  - question: "How many main sense organs are usually taught in elementary science?"
    choices:
      - "Three"
      - "Four"
      - "Six"
      - "Five"
    answer: "Five"
    topic: "Human Body & Health"
    explanation: "The eyes, ears, nose, tongue, and skin are the five main sense organs taught at this level."
  - question: "Which animal has a tadpole stage?"
    choices:
      - "Frog"
      - "Mosquito"
      - "Butterfly"
      - "Fly"
    answer: "Frog"
    topic: "Animals & Life Cycles"
    explanation: "A frog egg usually hatches into a tadpole."
  - question: "Which property cannot be identified by sight by a person who is completely blind?"
    choices:
      - "The taste of a cake"
      - "The color of a dress"
      - "The texture of wood"
      - "The shape of a bottle by touch"
    answer: "The color of a dress"
    topic: "Human Body & Health"
    explanation: "Color is detected through sight; taste and touch can give other information."
  - question: "Which animal is NOT a reptile?"
    choices:
      - "Chameleon"
      - "Snake"
      - "Salamander"
      - "Crocodile"
    answer: "Salamander"
    topic: "Animals & Life Cycles"
    explanation: "A salamander is an amphibian, not a reptile."
  - question: "Bread, pasta, and rice are Go foods. Which nutrient do they mainly provide?"
    choices:
      - "Protein"
      - "Vitamin C"
      - "Iron"
      - "Carbohydrates"
    answer: "Carbohydrates"
    topic: "Food & Nutrition"
    explanation: "These foods are rich in carbohydrates, which provide energy."
  - question: "Which animal is known for using strong hind legs to leap?"
    choices:
      - "Frog"
      - "Snail"
      - "Earthworm"
      - "Clam"
    answer: "Frog"
    topic: "Animals & Life Cycles"
    explanation: "A frog pushes against the ground with its strong back legs to leap."
  - question: "Why is the coconut tree often called the tree of life?"
    choices:
      - "It never dies"
      - "Many of its parts are useful to people"
      - "It grows without water"
      - "It has no roots"
    answer: "Many of its parts are useful to people"
    topic: "Plants & Growth"
    explanation: "Coconut fruits, leaves, trunks, and other parts have many uses."
  - question: "What is the main job of the lungs?"
    choices:
      - "Digest food"
      - "Pump blood"
      - "Help the body take in oxygen and remove carbon dioxide"
      - "Move bones"
    answer: "Help the body take in oxygen and remove carbon dioxide"
    topic: "Human Body & Health"
    explanation: "The lungs exchange gases between the air and the blood."
  - question: "What best describes a shrub?"
    choices:
      - "A plant with only soft stems"
      - "A plant without roots"
      - "A very tall tree with one main trunk"
      - "A usually short plant with woody stems branching near the ground"
    answer: "A usually short plant with woody stems branching near the ground"
    topic: "Plants & Growth"
    explanation: "Shrubs usually have several woody stems arising close to the ground."
  - question: "Which part of a plant supports its leaves and helps it stay upright?"
    choices:
      - "Stem"
      - "Petal"
      - "Fruit"
      - "Seed"
    answer: "Stem"
    topic: "Plants & Growth"
    explanation: "The stem holds the above-ground parts of the plant up."
  - question: "What is the young of a cow called?"
    choices:
      - "Puppy"
      - "Calf"
      - "Kitten"
      - "Chick"
    answer: "Calf"
    topic: "Animals & Life Cycles"
    explanation: "A young cow is called a calf."
  - question: "What are the two openings of the nose called?"
    choices:
      - "Eyelids"
      - "Nails"
      - "Nostrils"
      - "Earlobes"
    answer: "Nostrils"
    topic: "Human Body & Health"
    explanation: "Air enters and leaves the nose through the nostrils."
  - question: "Which part of most green plants makes most of their food?"
    choices:
      - "Roots"
      - "Flowers"
      - "Fruits"
      - "Leaves"
    answer: "Leaves"
    topic: "Plants & Growth"
    explanation: "Most photosynthesis in these plants happens in their green leaves."
  - question: "Which sense organ helps us hear sounds?"
    choices:
      - "Ears"
      - "Eyes"
      - "Nose"
      - "Tongue"
    answer: "Ears"
    topic: "Human Body & Health"
    explanation: "The ears detect sound."
  - question: "Which sense organ helps us smell a flower?"
    choices:
      - "Skin"
      - "Nose"
      - "Eyes"
      - "Tongue"
    answer: "Nose"
    topic: "Human Body & Health"
    explanation: "The nose detects smells."
  - question: "Which sense organ helps us taste a ripe mango?"
    choices:
      - "Ears"
      - "Eyes"
      - "Tongue"
      - "Nose"
    answer: "Tongue"
    topic: "Human Body & Health"
    explanation: "Taste buds on the tongue help detect tastes."
  - question: "Which sense organ helps us feel if a towel is rough or smooth?"
    choices:
      - "Eyes"
      - "Ears"
      - "Nose"
      - "Skin"
    answer: "Skin"
    topic: "Human Body & Health"
    explanation: "The skin senses touch, including texture."
  - question: "Which habit helps remove germs from our hands before eating?"
    choices:
      - "Washing with soap and clean water"
      - "Wiping hands on dirty clothes"
      - "Rinsing with mud"
      - "Touching the floor"
    answer: "Washing with soap and clean water"
    topic: "Human Body & Health"
    explanation: "Soap and water help remove dirt and germs from the hands."
  - question: "Which food is a Grow food that helps build the body?"
    choices:
      - "Candy"
      - "Fish"
      - "Soft drink"
      - "Sugar"
    answer: "Fish"
    topic: "Food & Nutrition"
    explanation: "Fish provides protein used for growth and tissue repair."
  - question: "Which group contains Glow foods?"
    choices:
      - "Candies and soft drinks"
      - "Butter and oil only"
      - "Fruits and vegetables"
      - "Salt and sugar only"
    answer: "Fruits and vegetables"
    topic: "Food & Nutrition"
    explanation: "Fruits and vegetables provide vitamins and minerals that help keep the body healthy."
  - question: "Which drink is the best everyday choice for replacing water lost by the body?"
    choices:
      - "Soft drink"
      - "Energy drink"
      - "Very salty water"
      - "Clean drinking water"
    answer: "Clean drinking water"
    topic: "Human Body & Health"
    explanation: "Safe drinking water replaces water the body loses."
  - question: "Which animal feeds milk to its young?"
    choices:
      - "Cat"
      - "Chicken"
      - "Frog"
      - "Butterfly"
    answer: "Cat"
    topic: "Animals & Life Cycles"
    explanation: "Cats are mammals, and mammal mothers produce milk for their young."
  - question: "What covers the body of a bird?"
    choices:
      - "Fur"
      - "Feathers"
      - "Shells"
      - "Moist bare skin"
    answer: "Feathers"
    topic: "Animals & Life Cycles"
    explanation: "Feathers are a characteristic body covering of birds."
  - question: "Which body part helps a fish breathe underwater?"
    choices:
      - "Wings"
      - "Fur"
      - "Gills"
      - "Beak"
    answer: "Gills"
    topic: "Animals & Life Cycles"
    explanation: "Gills take dissolved oxygen from water."
  - question: "How many legs does an adult insect have?"
    choices:
      - "Four"
      - "Eight"
      - "Ten"
      - "Six"
    answer: "Six"
    topic: "Animals & Life Cycles"
    explanation: "Adult insects have three pairs of legs, or six legs."
  - question: "Which animal has eight legs?"
    choices:
      - "Spider"
      - "Ant"
      - "Butterfly"
      - "Chicken"
    answer: "Spider"
    topic: "Animals & Life Cycles"
    explanation: "Spiders are arachnids and have eight legs."
  - question: "Which plant part usually takes in water from the soil?"
    choices:
      - "Flowers"
      - "Roots"
      - "Fruits"
      - "Petals"
    answer: "Roots"
    topic: "Plants & Growth"
    explanation: "Roots absorb water and dissolved minerals from the soil."
  - question: "Which plant part can grow into a new plant?"
    choices:
      - "Stone"
      - "Plastic spoon"
      - "Seed"
      - "Glass bead"
    answer: "Seed"
    topic: "Plants & Growth"
    explanation: "A living seed contains a young plant that can grow under suitable conditions."
  - question: "Which of these is a living thing?"
    choices:
      - "Rock"
      - "Chair"
      - "Spoon"
      - "Grass"
    answer: "Grass"
    topic: "Plants & Growth"
    explanation: "Grass grows and carries out life processes."
  - question: "Which of these is nonliving?"
    choices:
      - "Stone"
      - "Dog"
      - "Mango tree"
      - "Ant"
    answer: "Stone"
    topic: "Matter & Materials"
    explanation: "A stone does not grow or carry out life processes."
  - question: "What does a plant need from the sky to make food?"
    choices:
      - "Smoke"
      - "Sunlight"
      - "Lightning"
      - "Dust"
    answer: "Sunlight"
    topic: "Plants & Growth"
    explanation: "Sunlight supplies energy for photosynthesis."
  - question: "What is a suitable home for a pet fish?"
    choices:
      - "A dry cardboard box"
      - "A closed empty jar"
      - "An aquarium with clean water and enough oxygen"
      - "A hot frying pan"
    answer: "An aquarium with clean water and enough oxygen"
    topic: "Animals & Life Cycles"
    explanation: "Fish need suitable water with dissolved oxygen to survive."
  - question: "Which object is a solid?"
    choices:
      - "Air"
      - "Water vapor"
      - "Cooking oil"
      - "Wooden block"
    answer: "Wooden block"
    topic: "Matter & Materials"
    explanation: "A wooden block keeps its own shape and volume."
  - question: "Which substance is a liquid at room temperature?"
    choices:
      - "Water"
      - "Stone"
      - "Ice cube"
      - "Metal spoon"
    answer: "Water"
    topic: "Matter & Materials"
    explanation: "Liquid water flows and takes the shape of its container."
  - question: "What happens to an ice cube left in a warm room?"
    choices:
      - "It becomes soil"
      - "It melts"
      - "It becomes wood"
      - "It turns into a seed"
    answer: "It melts"
    topic: "Matter & Materials"
    explanation: "Heat from the surroundings changes solid ice into liquid water."
  - question: "Which material can soak up spilled water?"
    choices:
      - "Metal spoon"
      - "Glass marble"
      - "Sponge"
      - "Plastic ruler"
    answer: "Sponge"
    topic: "Matter & Materials"
    explanation: "A sponge has spaces that can hold water."
  - question: "Which object is usually attracted to a magnet?"
    choices:
      - "Wooden pencil"
      - "Plastic cup"
      - "Rubber band"
      - "Iron nail"
    answer: "Iron nail"
    topic: "Forces & Motion"
    explanation: "Iron is a magnetic material."
  - question: "What force do you use when you move a chair away from you?"
    choices:
      - "A push"
      - "A smell"
      - "A shadow"
      - "A taste"
    answer: "A push"
    topic: "Forces & Motion"
    explanation: "A push moves an object away from the source of the force."
  - question: "What force do you use when you bring a drawer toward you?"
    choices:
      - "A reflection"
      - "A pull"
      - "A taste"
      - "A sound"
    answer: "A pull"
    topic: "Forces & Motion"
    explanation: "Pulling draws an object toward the source of the force."
  - question: "Which object gives us light during the day?"
    choices:
      - "Moon"
      - "Soil"
      - "Sun"
      - "Cloud"
    answer: "Sun"
    topic: "Earth, Weather & Space"
    explanation: "The Sun produces the light that lights our surroundings during daytime."
  - question: "What do we call water falling from clouds as drops?"
    choices:
      - "Wind"
      - "Sunlight"
      - "Dust"
      - "Rain"
    answer: "Rain"
    topic: "Earth, Weather & Space"
    explanation: "Rain consists of liquid water drops falling from clouds."
  - question: "What is moving air called?"
    choices:
      - "Wind"
      - "Soil"
      - "Fog"
      - "Ice"
    answer: "Wind"
    topic: "Earth, Weather & Space"
    explanation: "Wind is air in motion."
  - question: "Which item helps keep us dry while walking in light rain?"
    choices:
      - "Sunglasses"
      - "Umbrella"
      - "Paper fan"
      - "Sandals only"
    answer: "Umbrella"
    topic: "Earth, Weather & Space"
    explanation: "An umbrella blocks many of the falling raindrops."
  - question: "Which action helps save water?"
    choices:
      - "Leave the tap running all day"
      - "Pour clean water down the drain"
      - "Turn off the tap while brushing teeth"
      - "Ignore a leaking tap"
    answer: "Turn off the tap while brushing teeth"
    topic: "Environment & Safety"
    explanation: "Turning off an unused tap prevents water waste."
  - question: "Where should an empty snack wrapper go?"
    choices:
      - "Into a river"
      - "Onto the playground"
      - "Into a flower bed"
      - "In the proper waste bin"
    answer: "In the proper waste bin"
    topic: "Environment & Safety"
    explanation: "Putting waste in the proper bin helps keep the surroundings clean."
  - question: "What should a child do before touching an unfamiliar substance in a science activity?"
    choices:
      - "Ask the teacher if it is safe"
      - "Taste it immediately"
      - "Rub it into the eyes"
      - "Mix it with everything"
    answer: "Ask the teacher if it is safe"
    topic: "Environment & Safety"
    explanation: "An adult should check safety before a child handles an unknown substance."
  - question: "Which tool helps us see very small objects more clearly?"
    choices:
      - "Rain gauge"
      - "Magnifying glass"
      - "Thermometer"
      - "Weighing scale"
    answer: "Magnifying glass"
    topic: "Science Skills"
    explanation: "A magnifying glass makes small details appear larger."
average:
  - question: "Water boils in an uncovered pot for a while. What happens to the amount left in the pot?"
    choices:
      - "It decreases"
      - "It stays exactly the same"
      - "It increases"
      - "It doubles every minute"
    answer: "It decreases"
    topic: "Matter & Materials"
    explanation: "Some liquid water escapes into the air as water vapor."
  - question: "A nymph is the young stage of which animal?"
    choices:
      - "Butterfly"
      - "Cockroach"
      - "Ant"
      - "Lizard"
    answer: "Cockroach"
    topic: "Animals & Life Cycles"
    explanation: "Cockroaches develop from eggs into nymphs, then adults, without a pupal stage."
  - question: "An astronaut sees the sunlit side of Earth looking bright. Why is it bright?"
    choices:
      - "It makes visible light like the Sun"
      - "A lamp behind Earth lights it"
      - "It reflects sunlight"
      - "Its rocks all glow in the dark"
    answer: "It reflects sunlight"
    topic: "Earth, Weather & Space"
    explanation: "Earth reflects light from the Sun; it is not a star producing its own sunlight."
  - question: "Dark clouds gather and the wind grows stronger. What weather might be approaching?"
    choices:
      - "Guaranteed dry weather"
      - "A snowfall everywhere"
      - "Permanent sunshine"
      - "A storm"
    answer: "A storm"
    topic: "Earth, Weather & Space"
    explanation: "Dark clouds and stronger winds can be signs of an approaching storm, though they do not guarantee one."
  - question: "How many main body regions does a spider have?"
    choices:
      - "Two"
      - "Three"
      - "Four"
      - "Five"
    answer: "Two"
    topic: "Animals & Life Cycles"
    explanation: "A spider has a cephalothorax and an abdomen, giving it two main body regions."
  - question: "Which statement about light is NOT correct?"
    choices:
      - "Light can reflect from a mirror"
      - "Light passes through every material"
      - "Light can change direction between air and glass"
      - "Light travels in straight lines through uniform air"
    answer: "Light passes through every material"
    topic: "Light & Sound"
    explanation: "Opaque materials block light, so it cannot pass through every material."
  - question: "What force pulls objects toward the center of Earth?"
    choices:
      - "Magnetism only"
      - "Electricity only"
      - "Gravity"
      - "Friction only"
    answer: "Gravity"
    topic: "Forces & Motion"
    explanation: "Earth's gravity attracts objects toward its center."
  - question: "What is Earth's only natural satellite?"
    choices:
      - "Sun"
      - "Mars"
      - "Venus"
      - "Moon"
    answer: "Moon"
    topic: "Earth, Weather & Space"
    explanation: "The Moon is the natural body that orbits Earth."
  - question: "What type of energy does a moving object have because of its motion?"
    choices:
      - "Kinetic energy"
      - "Chemical energy only"
      - "Stored elastic energy only"
      - "Nuclear energy only"
    answer: "Kinetic energy"
    topic: "Forces & Motion"
    explanation: "Kinetic energy is the energy an object has because it is moving."
  - question: "At normal sea-level air pressure, what is the boiling point of pure water?"
    choices:
      - "25°C"
      - "100°C"
      - "50°C"
      - "75°C"
    answer: "100°C"
    topic: "Matter & Materials"
    explanation: "Pure water boils at about 100°C at normal sea-level pressure."
  - question: "Which material lets us see objects clearly through it?"
    choices:
      - "Wood"
      - "Metal"
      - "Clear glass"
      - "Cardboard"
    answer: "Clear glass"
    topic: "Light & Sound"
    explanation: "Clear glass is transparent and lets most visible light pass through."
  - question: "Which nutrient is especially important for building and repairing muscles?"
    choices:
      - "Vitamin C"
      - "Iron"
      - "Water"
      - "Protein"
    answer: "Protein"
    topic: "Food & Nutrition"
    explanation: "Protein supplies materials the body uses to build and repair tissues, including muscles."
  - question: "Ampalaya is sometimes studied for helping manage blood sugar. Which condition is linked to high blood sugar?"
    choices:
      - "Diabetes"
      - "Tuberculosis"
      - "Pneumonia"
      - "Bronchitis"
    answer: "Diabetes"
    topic: "Human Body & Health"
    explanation: "Diabetes involves high blood sugar. Ampalaya is not a cure or a substitute for prescribed treatment."
  - question: "What is the correct order of a butterfly's life cycle?"
    choices:
      - "Egg, pupa, adult, larva"
      - "Egg, larva, pupa, adult"
      - "Adult, pupa, egg, larva"
      - "Larva, adult, egg, pupa"
    answer: "Egg, larva, pupa, adult"
    topic: "Animals & Life Cycles"
    explanation: "A butterfly develops from an egg into a larva, then a pupa, and finally an adult."
  - question: "Which stage comes after the tadpole as a frog develops legs and loses most of its tail?"
    choices:
      - "Caterpillar"
      - "Chrysalis"
      - "Froglet"
      - "Nymph"
    answer: "Froglet"
    topic: "Animals & Life Cycles"
    explanation: "A froglet is a young frog with legs and a shrinking tail."
  - question: "Which animal goes through complete metamorphosis?"
    choices:
      - "Dog"
      - "Cat"
      - "Cow"
      - "Butterfly"
    answer: "Butterfly"
    topic: "Animals & Life Cycles"
    explanation: "A butterfly has egg, larva, pupa, and adult stages."
  - question: "Which animal lays eggs and has feathers?"
    choices:
      - "Hen"
      - "Goat"
      - "Cat"
      - "Dog"
    answer: "Hen"
    topic: "Animals & Life Cycles"
    explanation: "A hen is a bird; birds have feathers and lay eggs."
  - question: "Which animal breathes air with lungs even though it lives in the sea?"
    choices:
      - "Tilapia"
      - "Dolphin"
      - "Tuna"
      - "Sardine"
    answer: "Dolphin"
    topic: "Animals & Life Cycles"
    explanation: "Dolphins are mammals and must surface to breathe air."
  - question: "Which pair contains only amphibians?"
    choices:
      - "Snake and crocodile"
      - "Cat and dog"
      - "Frog and salamander"
      - "Eagle and duck"
    answer: "Frog and salamander"
    topic: "Animals & Life Cycles"
    explanation: "Frogs and salamanders belong to the amphibian group."
  - question: "Which animal helps pollinate flowers by carrying pollen between them?"
    choices:
      - "Earthworm"
      - "Clam"
      - "Fish"
      - "Bee"
    answer: "Bee"
    topic: "Plants & Growth"
    explanation: "Bees can carry pollen as they visit flowers."
  - question: "What does a flower often develop into after pollination and fertilization?"
    choices:
      - "A fruit containing seeds"
      - "A stone"
      - "A root made of metal"
      - "A feather"
    answer: "A fruit containing seeds"
    topic: "Plants & Growth"
    explanation: "In a flowering plant, the ovary can become a fruit and fertilized ovules become seeds."
  - question: "Why do many seeds need water before they start growing?"
    choices:
      - "Water turns them into stones"
      - "Water helps start germination"
      - "Water replaces all their food"
      - "Water removes the young plant"
    answer: "Water helps start germination"
    topic: "Plants & Growth"
    explanation: "Taking in water helps activate the processes that let a seed germinate."
  - question: "Which plant is a vine that commonly climbs using tendrils?"
    choices:
      - "Coconut"
      - "Mango"
      - "Ampalaya"
      - "Narra"
    answer: "Ampalaya"
    topic: "Plants & Growth"
    explanation: "Ampalaya is a climbing vine with tendrils that attach to supports."
  - question: "Which group includes rice, corn, and wheat?"
    choices:
      - "Shrubs"
      - "Ferns"
      - "Mosses"
      - "Grasses"
    answer: "Grasses"
    topic: "Plants & Growth"
    explanation: "Rice, corn, and wheat are members of the grass family."
  - question: "Which organ pumps blood around the body?"
    choices:
      - "Heart"
      - "Stomach"
      - "Lungs"
      - "Brain"
    answer: "Heart"
    topic: "Human Body & Health"
    explanation: "The heart's contractions push blood through blood vessels."
  - question: "Which organ controls many body activities and helps us think?"
    choices:
      - "Liver"
      - "Brain"
      - "Stomach"
      - "Lung"
    answer: "Brain"
    topic: "Human Body & Health"
    explanation: "The brain receives information and coordinates many body activities."
  - question: "What do bones mainly help provide?"
    choices:
      - "Sunlight for plants"
      - "Food digestion by themselves"
      - "Support and protection"
      - "Smell detection"
    answer: "Support and protection"
    topic: "Human Body & Health"
    explanation: "Bones support the body and protect organs such as the brain and heart."
  - question: "What happens to food when we chew it?"
    choices:
      - "It turns into blood instantly"
      - "It becomes a mineral"
      - "It disappears without being swallowed"
      - "It is broken into smaller pieces"
    answer: "It is broken into smaller pieces"
    topic: "Human Body & Health"
    explanation: "Teeth break food into smaller pieces that are easier to swallow and digest."
  - question: "Why should we brush our teeth regularly?"
    choices:
      - "To remove food bits and plaque"
      - "To make teeth soft"
      - "To replace drinking water"
      - "To stop all hunger"
    answer: "To remove food bits and plaque"
    topic: "Human Body & Health"
    explanation: "Brushing helps remove plaque and food that can contribute to tooth decay."
  - question: "Which meal best includes Go, Grow, and Glow foods?"
    choices:
      - "Candy, sugar, and soda"
      - "Rice, fish, and vegetables"
      - "Rice, bread, and pasta only"
      - "Salt, water, and oil"
    answer: "Rice, fish, and vegetables"
    topic: "Food & Nutrition"
    explanation: "Rice supplies energy, fish provides protein, and vegetables provide vitamins and minerals."
  - question: "What happens when liquid water is placed in a freezer long enough?"
    choices:
      - "It becomes sand"
      - "It becomes oil"
