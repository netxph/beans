average:
  - question: "Which of the following represents a chemical change where a new substance is formed?"
    choices:
      - "Rusting of an iron nail"
      - "Melting of an ice cube"
      - "Tearing a sheet of paper"
      - "Dissolving salt in water"
    answer: "Rusting of an iron nail"
  - question: "Why is boiling water classified as a physical change rather than a chemical change?"
    choices:
      - "Water vapor is still chemically water"
      - "A new gas substance is created"
      - "Heat is completely destroyed"
      - "The mass of water turns into air"
    answer: "Water vapor is still chemically water"
  - question: "What process occurs when water vapor cools down and turns back into liquid water droplets?"
    choices:
      - "Condensation"
      - "Evaporation"
      - "Sublimation"
      - "Freezing"
    answer: "Condensation"
  - question: "What do we call the direct change of a solid into a gas without turning into a liquid first?"
    choices:
      - "Sublimation"
      - "Condensation"
      - "Melting"
      - "Deposition"
    answer: "Sublimation"
  - question: "Why do naphthalene balls (mothballs) shrink in a closet over time?"
    choices:
      - "They undergo sublimation directly into gas"
      - "They melt into liquid puddles"
      - "They dissolve into wood"
      - "They are eaten by water"
    answer: "They undergo sublimation directly into gas"
  - question: "Which mixture can be easily separated using a bar magnet?"
